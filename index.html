   }
  }

 }

 const completed=w=>w.sessions.filter(s=>s.finishedAt!==null).slice().sort((a,b)=>b.finishedAt-a.finishedAt);
 const volume=s=>s.exercises.reduce((v,e)=>v+e.sets.filter(t=>t.done).reduce((n,t)=>n+t.kg*t.reps,0),0);
 function previous(w,exercise){return completed(w).flatMap(s=>s.exercises).find(e=>e.exercise===exercise&&e.sets.some(x=>x.done))}

  const w=init(s).workouts;if(active(w))throw Error('Finalize ou descarte o treino atual primeiro.');

 }

function finances(){let f=Core.finance(state,finMonth),budget=state.finance.budgets[finMonth]||{},totalBudget=Object.values(budget).reduce((a,b)=>a+b,0);let html=`<div class="row"><div>${head('UM FUTURO MAIS TRANQUILO','Finanças')}</div><button class="privacy-button icon-btn" data-action="privacy" aria-label="${state.preferences.hideMoney?'Mostrar valores':'Ocultar valores'}" aria-pressed="${state.preferences.hideMoney}">${state.preferences.hideMoney?'◌':'◉'}</button></div>`+monthSwitch(finMonth,'finance-month')+`<div class="tabs finance-tabs" role="group" aria-label="Seções de finanças">${[['overview','Resumo'],['entries','Lançamentos'],['budget','Orçamento'],['goals','Metas'],['reports','Relatórios'],['calendar','Agenda']].map(([v,n])=>`<button class="${finTab===v?'selected':''}" data-action="finance-tab" data-value="${v}" aria-pressed="${finTab===v}">${n}</button>`).join('')}</div>`;

if(finTab==='overview'){html+=financeQuickActions()+`<div class="card finance-hero">${cat('mikan')}<small>Saldo acumulado</small><div class="money">${money(f.balance)}</div><div class="grid balance-grid"><div><small>↓ Recebido no mês</small><b class="positive">${money(f.income)}</b></div><div><small>↑ Pago no mês</small><b>${money(f.expense)}</b></div></div></div><div class="grid"><div class="card"><small>A pagar neste mês</small><p><b class="danger">${money(f.pending)}</b></p></div><div class="card"><small>A receber neste mês</small><p><b class="positive">${money(f.pendingIncome)}</b></p></div></div><div class="row section"><h2>Seu orçamento</h2>${btn('budget','Ajustar','quiet')}</div><div class="card"><div class="row"><small>Despesas pagas + pendentes</small><b>${money(f.committed)}</b></div><div class="bar ${f.committed>totalBudget&&totalBudget?'over':''}"><i style="width:${totalBudget?Math.min(100,f.committed/totalBudget*100):0}%"></i></div><small>${totalBudget?`Orçamento definido: ${money(totalBudget)}`:'Defina limites por categoria para acompanhar o mês.'}</small></div>${financeAttentionPanel()}${spendingChart()}<div class="section row"><h2>Últimos lançamentos</h2>${btn('finance-entries','Ver todos','quiet')}</div>${entryList(f.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4))}`}
if(finTab==='entries'){html+=`<div class="search">${icon('search')}<input id="finance-search" aria-label="Buscar lançamento" placeholder="Buscar lançamento…" value="${esc(financeQuery)}"></div><div class="chips">${[['all','Todos'],['pending','Pendentes'],['overdue','Vencidos'],['paid','Efetivados'],['expense','Despesas'],['income','Receitas']].map(([v,n])=>`<button data-action="finance-filter" data-value="${v}" class="${financeFilter===v?'selected':''}">${n}</button>`).join('')}</div><div id="finance-results">${financeEntryResults(f.entries)}</div>`+`<button class="wide" data-action="repeat-entries">Trazer recorrentes do mês anterior</button><p class="footnote">Copia os lançamentos marcados como mensais para este mês, como pendentes e sem duplicar.</p>`}
if(finTab==='budget'){html+=`<div class="card row">${cat(state.cat,'smallcat')}<p class="muted">Inclui despesas pagas e pendentes do mês.</p></div>${categories.map(c=>{let spent=f.entries.filter(e=>e.type==='expense'&&e.category===c).reduce((a,e)=>a+e.amount,0),limit=budget[c]||0;return `<div class="card"><div class="row"><b>${c}</b><small>${money(spent)} ${limit?'/ '+money(limit):''}</small></div><div class="bar ${limit&&spent>limit?'over':''}"><i style="width:${limit?Math.min(100,spent/limit*100):0}%"></i></div><small class="${limit&&spent>limit?'danger':''}">${limit?(spent>limit?'Acima do limite em '+money(spent-limit):'Disponível: '+money(limit-spent)):'Sem limite definido'}</small></div>`}).join('')}${btn('budget','Editar orçamento do mês','primary wide')}${btn('copy-budget','Copiar limites do mês anterior','wide')}`}
if(finTab==='goals'){html+=`<p class="muted">Acompanhe o dinheiro que você já separou para seus planos.</p>${state.finance.goals.map(g=>`<div class="card"><div class="row">${cat('sora','smallcat')}<div class="grow"><b>${esc(g.title)}</b><small style="display:block">${money(g.saved)} de ${money(g.target)}</small></div><button class="quiet icon-btn" data-action="goal" data-id="${esc(g.id)}" aria-label="Editar meta">${icon('edit')}</button></div><div class="bar"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><small>${g.saved>=g.target?'Meta alcançada!':Math.round(g.saved/g.target*100)+'% do caminho'}</small></div>`).join('')||empty('Um sonho de cada vez','Crie uma meta e atualize o valor que já guardou.','sora')}${btn('goal',icon('plus')+' Nova meta','primary wide')}<p class="footnote">Metas são um acompanhamento separado; seus valores não alteram o saldo ou os lançamentos.</p>`}
if(finTab==='reports')html+=financeReports();if(finTab==='calendar')html+=financeCalendar();
if(['overview','entries'].includes(finTab))html+=btn('entry',icon('plus')+' Novo lançamento','primary wide');html+=`<div class="row section">${btn('opening','Saldo inicial','quiet')}${btn('export-csv',icon('download')+' CSV do mês','quiet')}</div>`;return html}
function history(){let items=[...state.history,...state.sessions.map(s=>({...s,type:'focus',title:s.title||'Sessão de foco'}))].filter(h=>historyTab==='all'||h.type===historyTab).sort((a,b)=>b.at-a.at);return head('SEUS PASSOS CONTAM','Histórico')+`<div class="tabs">${[['all','Todos'],['task','Tarefas'],['focus','Foco'],].map(([v,n])=>`<button data-action="history-tab" data-value="${v}" class="${historyTab===v?'selected':''}">${n}</button>`).join('')}</div>${items.map(h=>`<div class="entry"><div class="entry-icon">${icon(h.type==='task'?'check':h.type==='focus'?'clock':h.type==='reward'?'gift':'reset')}</div><div class="grow"><b>${esc(h.title)}</b><small>${new Date(h.at).toLocaleString('pt-BR')}</small></div><small>${h.type==='task'?(h.reverted?'Revertida':'+'+esc(h.xp)+' XP'):h.type==='reopen'?'Reaberta':''}</small></div>`).join('')||empty('Sua história começa agora','Conclua uma tarefa ou uma sessão de foco.','luna')}`}



function profile(){return head('SEUS GOSTOS, SEU ESTILO','Meu perfil')+`<div class="profile-banner"><img class="profile-portrait" src="${catArtwork[state.cat]||'art-hero.webp'}" alt="Seu gatinho"><div class="profile-label"><strong>Meu Perfil</strong><small>Personalize seu espaço e o NekoQuest do seu jeito.</small><small>Companheiro: ${cats[state.cat][0]}</small></div></div><div class="profile-quick"><button data-page="cats"><img src="art-hero.webp" alt=""><span class="quick-text"><strong>Meu gatinho</strong><small>Escolha e personalize seu companheiro</small></span>${icon('arrow')}</button><button data-page="areas"><img src="art-tasks.webp" alt=""><span class="quick-text"><strong>Minhas áreas</strong><small>Organize sua rotina do seu jeito</small></span>${icon('arrow')}</button></div><h2 class="profile-mini-head">Aparência e preferências</h2><form data-form="profile">${formField('Como quer ser chamado?','name',state.name,'text','required maxlength="40"')}${selectField('Tema','theme',[['dark','Noite · escuro'],['light','Dia · claro']],state.theme)}<label>Cor principal</label><div class="palette">${['#91c4a8','#9485d6','#e99f82','#8fbde8','#efc579'].map(c=>`<button type="button" data-action="color" data-value="${c}" class="${state.color===c?'selected':''}" style="background:${c}" aria-label="Cor ${c}"></button>`).join('')}</div>${formField('Ou escolha sua cor','color',state.color,'color')}<label class="checklabel"><input type="checkbox" name="motion" ${state.preferences.motion?'checked':''}> Animações suaves</label><button class="primary wide">Salvar perfil</button></form><div class="section"><h2>Seus dados</h2></div>${btn('backup',icon('download')+' Exportar backup completo','wide')}<label for="import">Restaurar backup JSON</label><input id="import" type="file" accept="application/json,.json">${btn('install','Instalar NekoQuest','wide')}<p class="footnote">Seus dados ficam neste navegador. O backup inclui todas as áreas, treinos e sessões em andamento. Não há conexão com banco ou sincronização automática.</p><p class="footnote">NekoQuest 5.6.0</p>`+modernSettings()}
function taskForm(id,preset={}){let t=state.tasks.find(t=>t.id===id)||{title:'',date:page==='tasks'&&missionView==='calendar'?day:Core.today(),category:'Estudos',priority:'normal',minutes:25,xp:10,repeat:page==='tasks'&&missionView==='routines'?'daily':'none',notes:'',subtasks:[],...preset};modal(id?'Editar tarefa':'Nova tarefa',`<form data-form="task" data-id="${esc(id||'')}">${selectField('Lista','listId',[['','Sem lista'],...org().lists.map(l=>[l.id,l.title])],t.listId||'')}${formField('O que você quer fazer?','title',t.title,'text','required maxlength="100"')}${selectField('Categoria','category',['Estudos','Trabalho','Saúde','Pessoal'],t.category)}<div class="grid form-grid">${formField('Data','date',t.date,'date','required')}${selectField('Prioridade','priority',[['normal','Normal'],['high','Alta'],['low','Baixa']],t.priority)}</div><div class="grid">${formField('Duração (min)','minutes',t.minutes,'number','min="1" max="600" required')}${formField('XP / moedas','xp',t.xp,'number',`min="1" max="10000" required ${t.done?'readonly':''}`)}</div>${formField('Horário (opcional)','time',t.time||'','time')}${selectField('Recorrência','repeat',[['none','Uma vez — tarefa pontual'],['daily','Todo dia — rotina / hábito'],['weekly','Semanalmente'],['monthly','Mensalmente'],['yearly','Anualmente']],t.repeat)}<p class="footnote">Concluir uma recorrente cria a próxima ocorrência. Todas as tarefas dão XP e moedas.</p><label for="f-notes">Notas</label><textarea id="f-notes" name="notes" maxlength="2000">${esc(t.notes)}</textarea><label for="f-subtasks">Subtarefas · uma por linha</label><textarea id="f-subtasks" name="subtasks" maxlength="3000" placeholder="Separar material&#10;Revisar o conteúdo">${esc(t.subtasks.map(s=>s.title).join('\n'))}</textarea>${t.subtasks.length?'<div class="checklist">'+t.subtasks.map((s,i)=>`<div class="subtask"><button type="button" data-action="subtask" data-id="${esc(id)}" data-index="${i}" aria-label="Alternar subtarefa">${icon(s.done?'check':'box')}</button><span>${esc(s.title)}</span></div>`).join('')+'</div>':''}<button class="primary wide">Salvar tarefa</button>${id?`<button type="button" class="wide danger" data-action="delete-task" data-id="${esc(id)}">Excluir tarefa</button>`:''}</form>`)}
function rewardForm(id){let r=state.rewards.find(r=>r.id===id)||{title:'',cost:25,cat:'mochi'};modal(id?'Editar recompensa':'Nova recompensa',`<form data-form="reward" data-id="${esc(id||'')}">${formField('Sua pausa merecida','title',r.title,'text','required maxlength="100"')}${formField('Custo em moedas de tarefa','cost',r.cost,'number','required min="1" max="10000"')}${selectField('Gatinho','cat',Object.entries(cats).map(([k,v])=>[k,v[0]]),r.cat)}<button class="primary wide">Salvar recompensa</button>${id?`<button type="button" class="wide danger" data-action="delete-reward" data-id="${esc(id)}">Excluir recompensa</button>`:''}</form>`)}

function entryForm(id){let e=state.finance.entries.find(e=>e.id===id)||{title:'',type:'expense',amount:0,date:finMonth===Core.today().slice(0,7)?Core.today():finMonth+'-01',category:'Outros',paid:false,recurring:false};modal(id?'Editar lançamento':'Novo lançamento',`<form data-form="entry" data-id="${esc(id||'')}">${selectField('Tipo','type',[['expense','Despesa'],['income','Receita']],e.type)}${formField('Descrição','title',e.title,'text','required maxlength="100" list="finance-descriptions" autocomplete="off"')}${financeSuggestions(e.type,id)}${formField('Valor (R$)','amount',e.amount?(e.amount/100).toFixed(2).replace('.',','):'','text','inputmode="decimal" required placeholder="0,00"')}${formField('Data de recebimento / vencimento','date',e.date,'date','required')}${selectField('Categoria','category',e.type==='income'?['Salário','Renda extra','Outros']:categories,e.category)}<label class="checklabel"><input type="checkbox" name="paid" ${e.paid?'checked':''}> Já foi pago ou recebido</label><label class="checklabel"><input type="checkbox" name="recurring" ${e.recurring?'checked':''}> Repetir mensalmente</label><p class="footnote">Os recorrentes são trazidos pelo botão da aba Lançamentos, sempre como pendentes.</p><button class="primary wide">Salvar lançamento</button>${id?`<button type="button" class="wide danger" data-action="delete-entry" data-id="${esc(id)}">Excluir lançamento</button>`:''}</form>`)}
function budgetForm(){let b=state.finance.budgets[finMonth]||{};modal('Orçamento · '+monthLabel(finMonth),`<form data-form="budget"><p class="footnote">Limites para este mês. Deixe vazio para não definir limite.</p>${categories.map((c,i)=>formField(c,'budget'+i,b[c]?(b[c]/100).toFixed(2).replace('.',','):'','text','inputmode="decimal" placeholder="Sem limite"')).join('')}<button class="primary wide">Salvar orçamento</button></form>`)}
function goalForm(id){let g=state.finance.goals.find(g=>g.id===id)||{title:'',target:0,saved:0};modal(id?'Editar meta':'Nova meta',`<form data-form="goal" data-id="${esc(id||'')}">${formField('Qual é seu plano?','title',g.title,'text','required maxlength="100"')}${formField('Objetivo (R$)','target',g.target?(g.target/100).toFixed(2).replace('.',','):'','text','inputmode="decimal" required')}${formField('Total já guardado (R$)','saved',(g.saved/100).toFixed(2).replace('.',','),'text','inputmode="decimal" required')}<p class="footnote">Atualize o total acumulado. Não cria lançamento nem altera seu saldo.</p><button class="primary wide">Salvar meta</button>${id?`<button type="button" class="wide danger" data-action="delete-goal" data-id="${esc(id)}">Excluir meta</button>`:''}</form>`)}
function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function tick(){
 const t=state.timer,n=t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.remaining;
 for(const selector of ['#clock','#mini-clock']){const el=$(selector);if(el)el.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
 if(t.end&&n===0){
  const wasFocus=t.mode==='focus';
  if(wasFocus){const at=t.end,title=t.taskTitle||state.tasks.find(x=>x.id===state.focusTask)?.title||'Foco livre',taskId=t.taskId||state.focusTask||null;state.sessions.push({id:Core.id(),at,title,taskId,minutes:t.duration||state.focus});state.lastFocus={at,title,taskId};}
  state.timer={mode:wasFocus?'break':'focus',remaining:state[wasFocus?'break':'focus']*60,end:null};
  save();render();playModernSound('alert');modernNotify('NekoQuest',wasFocus?'Sua sessão de foco terminou. Hora de uma pausa.':'Sua pausa terminou. Continue no seu ritmo.','focus-end');toast(wasFocus?'Sessão concluída. Hora de uma pausa!':'Pausa concluída. Pronto para continuar?');
 }
}

function mutate(fn,message){fn();save();render();if(message)toast(message)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){go(d.page);return}let a=d.action;if(!a)return;
if(a==='close')$('#modal').close();
if(a==='task')taskForm(d.id);if(a==='reward')rewardForm(d.id);if(a==='entry')entryForm(d.id);if(a==='budget')budgetForm();if(a==='goal')goalForm(d.id);
if(a==='complete')completeMission(d.id);
if(a==='subtask'){let t=state.tasks.find(t=>t.id===d.id),s=t.subtasks[+d.index];s.done=!s.done;save();b.innerHTML=icon(s.done?'check':'box')}
if(a.startsWith('delete-')){let type=a.slice(7),collections={task:state.tasks,reward:state.rewards,entry:state.finance.entries,goal:state.finance.goals};if(collections[type]&&confirm('Excluir este registro?')){let arr=collections[type],i=arr.findIndex(x=>x.id===d.id);if(i>=0)arr.splice(i,1);save();$('#modal').close();render();toast('Registro excluído.')}}
if(a==='task-filter'){taskFilter=d.value;render()}if(a==='day'){day=d.value;render()}if(a==='calendar-month'){calMonth=moveMonth(calMonth,+d.dir);day=calMonth+'-01';render()}if(a==='finance-month'){finMonth=moveMonth(finMonth,+d.dir);render()}if(a==='finance-tab'){finTab=d.value;render()}if(a==='finance-entries'){finTab='entries';render()}if(a==='history-tab'){historyTab=d.value;render()}
if(a==='cat')mutate(()=>state.cat=d.value,'Novo companheiro escolhido!');
if(a==='redeem'){let r=state.rewards.find(r=>r.id===d.id);if(state.coins>=r.cost&&confirm(`Resgatar “${r.title}” por ${r.cost} moedas de tarefa?`))mutate(()=>{state.coins-=r.cost;state.history.push({id:Core.id(),type:'reward',title:r.title,cost:r.cost,at:Date.now()})},'Pausa conquistada. Aproveite!')}
if(a==='timer'){let t=state.timer;if(t.end){t.remaining=Math.max(0,Math.ceil((t.end-Date.now())/1000));t.end=null}else{if(!t.startedAt){const task=state.tasks.find(x=>x.id===state.focusTask);t.startedAt=Date.now();t.taskId=task?.id||null;t.taskTitle=task?.title||'Foco livre';t.duration=state[t.mode]}t.end=Date.now()+t.remaining*1000}save();render()}
if(a==='timer-reset'||a==='timer-mode'){if(state.timer.startedAt&&!confirm('Encerrar esta sessão sem registrá-la?'))return;const mode=a==='timer-mode'?(state.timer.mode==='focus'?'break':'focus'):state.timer.mode;state.timer={mode,remaining:state[mode]*60,end:null};save();render()}
if(a==='color'){$('#f-color').value=d.value;document.querySelectorAll('.palette button').forEach(x=>x.classList.toggle('selected',x===b))}
if(a==='opening')modal('Saldo inicial',`<form data-form="opening">${formField('Saldo antes dos lançamentos (R$)','opening',(state.finance.opening/100).toFixed(2).replace('.',','),'text','inputmode="decimal" required')}<p class="footnote">Valor disponível antes do primeiro lançamento. É usado no saldo acumulado de todos os meses.</p><button class="primary wide">Salvar saldo inicial</button></form>`);
if(a==='repeat-entries'){let prev=moveMonth(finMonth,-1),count=0;state.finance.entries.filter(x=>x.date.startsWith(prev)&&x.recurring).forEach(x=>{let root=x.recurringId||x.id;if(!state.finance.entries.some(e=>e.date.startsWith(finMonth)&&(e.recurringId||e.id)===root)){state.finance.entries.push({...x,id:Core.id(),recurringId:root,date:Core.nextDate(x.date,'monthly',x.repeatDay||Number(x.date.slice(8))),repeatDay:x.repeatDay||Number(x.date.slice(8)),paid:false});count++}});save();render();toast(count?`${count} lançamento(s) recorrente(s) trazido(s).`:'Nenhum recorrente novo no mês anterior.')}
if(a==='backup')download('nekoquest-backup-'+Core.today()+'.json',JSON.stringify(state,null,2),'application/json');
if(a==='export-csv'){if(state.preferences.hideMoney&&!confirm('O CSV contém os valores completos. Exportar?'))return;let rows=[['Data','Descrição','Tipo','Categoria','Valor (R$)','Situação'],...Core.finance(state,finMonth).entries.map(e=>[e.date,e.title,e.type==='income'?'Receita':'Despesa',e.category,(e.amount/100).toFixed(2).replace('.',','),e.paid?'Efetivado':'Pendente'])];const cell=x=>'"'+String(x).replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';download('nekoquest-financas-'+finMonth+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
if(a==='install'){if(installPrompt){await installPrompt.prompt();installPrompt=null}else modal('Leve seus gatos com você','<p>Abra o endereço HTTPS do app no navegador do celular.</p><p>No Android: menu do Chrome → Instalar app.</p><p>No iPhone: Compartilhar → Adicionar à Tela de Início.</p>')}
});
document.addEventListener('submit',e=>{let f=e.target,type=f.dataset.form;if(!type)return;e.preventDefault();let v=Object.fromEntries(new FormData(f)),id=f.dataset.id;try{
if(type.startsWith('workout-')){workoutSubmit(type,v,id,f);return;}
if(type.startsWith('food-')){foodSubmit(type,v,id);if(save()){$('#modal').close();render();toast('Salvo!');}return;}if(type.startsWith('water-')){waterSubmit(type,v,id);if(save()){$('#modal').close();render();toast('Salvo!');}return;}if(type.startsWith('breathe-')){breatheSubmit(type,v,id);if(save()){$('#modal').close();render();toast('Registro salvo. Um passo de cada vez.');}return;}if(type.startsWith('ext-')){extSubmit(type,v,id);if(f.dataset.stopwatch==='true')org().stopwatch=null;if(save()){ $('#modal').close();render();toast('Salvo!');}return;}
if(type==='task'){v.title=v.title.trim();if(v.time&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))throw Error('Horário inválido.');if(!v.title||!Core.validDate(v.date))throw Error('Confira o título e a data.');let old=state.tasks.find(t=>t.id===id),lines=v.subtasks.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,30);v.subtasks=lines.map((title,i)=>({title:title.slice(0,150),done:old?.subtasks[i]?.title===title?old.subtasks[i].done:false}));v.minutes=Number(v.minutes);v.xp=old?.done?old.xp:Number(v.xp);if(!Number.isInteger(v.xp)||v.xp<1||v.xp>10000||v.minutes<1||v.minutes>600)throw Error('Confira duração e XP.');if(old){if(v.repeat==='none'&&old.nextId){const next=state.tasks.find(t=>t.id===old.nextId&&!t.done);if(next&&confirm('Parar também a próxima ocorrência já criada?'))state.tasks=state.tasks.filter(t=>t.id!==next.id)}if(old.date!==v.date)old.repeatDay=Number(v.date.slice(8));Object.assign(old,v);if(old.repeat!=='none'&&!old.seriesId)old.seriesId=old.id;if(old.done&&old.nextId){const pending=state.tasks.find(t=>t.id===old.nextId&&!t.done);if(pending&&v.repeat!=='none')Object.assign(pending,{title:v.title,category:v.category,priority:v.priority,minutes:v.minutes,notes:v.notes,repeat:v.repeat});}}else{const id=Core.id();state.tasks.push({...v,id,seriesId:v.repeat!=='none'?id:null,done:false});}}
if(type==='reward'){v.title=v.title.trim();v.cost=Number(v.cost);if(!v.title||!Number.isInteger(v.cost)||v.cost<1||v.cost>10000)throw Error('Confira os dados da recompensa.');if(id)Object.assign(state.rewards.find(r=>r.id===id),v);else state.rewards.push({...v,id:Core.id()})}

function taskGroups(ts){if(!ts.length)return taskList(ts);let groups=[['Atrasadas',ts.filter(t=>!t.done&&t.date<Core.today())],['Hoje',ts.filter(t=>!t.done&&t.date===Core.today())],['Próximos dias',ts.filter(t=>!t.done&&t.date>Core.today())],['Concluídas',ts.filter(t=>t.done)]];return groups.filter(([,ts])=>ts.length).map(([title,ts])=>`<div class="task-group-title">${title}<span>${ts.length}</span></div>${taskList(ts)}`).join('')}
