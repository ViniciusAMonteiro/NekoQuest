/* NekoQuest v4: deterministic data rules; amounts are integer centavos. */
const Core=(()=>{
const cats=['luna','mochi','mikan','nori','yuki','sora'];
const date=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>date(new Date());
const id=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&date(new Date(s+'T12:00:00'))===s;
function addDays(s,n){let d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return date(d)}

function cents(value){let s=String(value).trim().replace(/\s|R\$/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(s))throw Error('Digite um valor como 125,90.');let [a,b='']=s.split('.'),n=Number(a)*100+Number(b.padEnd(2,'0'));if(!Number.isSafeInteger(n)||n>99999999999)throw Error('Valor muito alto.');return n}
const defaults=()=>({version:4,name:'Aventureiro',theme:'dark',color:'#b49aff',cat:'luna',tasks:[],coins:0,xpTotal:0,rewards:[{id:id(),title:'Jogar por 30 minutos',cost:30,cat:'nori'},{id:id(),title:'Um café e uma pausa',cost:20,cat:'mochi'},{id:id(),title:'Assistir a um episódio',cost:25,cat:'mikan'}],history:[],sessions:[],habits:[],finance:{entries:[],budgets:{},goals:[],opening:0},timer:{mode:'focus',remaining:1500,end:null},focus:25,break:5,preferences:{hideMoney:false,scene:'garden',motion:true}});
function migrate(old){let s=Object.assign(defaults(),old||{});s.version=4;s.preferences={hideMoney:!!s.preferences?.hideMoney,scene:['garden','sunset','rain'].includes(s.preferences?.scene)?s.preferences.scene:'garden',motion:s.preferences?.motion!==false};s.finance=s.finance||{entries:[],budgets:{},goals:[],opening:0};s.habits=s.habits||[];s.cat=cats.includes(s.cat)?s.cat:'luna';s.tasks=(s.tasks||[]).map(t=>({...t,id:String(t.id||id()),title:String(t.title||'Missão'),done:typeof t.done==='boolean'?t.done:!!t.completed,xp:Number(t.xp)||10,minutes:Number(t.minutes)||25,date:validDate(t.date)?t.date:today(),priority:t.priority==='alta'?'high':t.priority||'normal',notes:t.notes||'',repeat:t.repeat||'none',subtasks:t.subtasks||[]}));s.xpTotal=Number.isFinite(old?.xpTotal)?old.xpTotal:s.tasks.filter(t=>t.done).reduce((a,t)=>a+t.xp,0);s.rewards=s.rewards.map((r,i)=>({...r,cat:cats.includes(r.cat)?r.cat:cats[i%6]}));unifyHabits(s);return s}
function toggleTask(s,idValue){
 const t=s.tasks.find(t=>t.id===idValue);if(!t)throw Error('Missão não encontrada.');
 if(!t.done&&t.repeat!=='none'&&t.date>today())throw Error('Esta rotina está planejada para '+t.date.split('-').reverse().join('/')+'.');

 if(t.done){
  s.coins+=t.xp;s.xpTotal+=t.xp;t.completedAt=Date.now();t.subtasks.forEach(a=>a.done=true);
  const series=t.repeat!=='none'?(t.seriesId||t.id):t.seriesId;
  if(series)t.seriesId=series;
  s.history.push({id:id(),type:'task',taskId:t.id,seriesId:series,title:t.title,xp:t.xp,at:t.completedAt});
  if(t.repeat!=='none'&&!t.nextId){
   let scheduled=nextDate(t.date,t.repeat,t.repeatDay||Number(t.date.slice(8)));
   if(t.repeat==='daily'&&scheduled<=today())scheduled=addDays(today(),1);let steps=0;while(scheduled<=today()&&steps++<50000)scheduled=nextDate(scheduled,t.repeat,t.repeatDay||Number(t.date.slice(8)));

function unifyHabits(s){

 const key=Object.hasOwn(CAT_ART,name)?name:'luna';
 return CAT_ART[key].replace('<svg ',`<svg class="sprite ${esc(cl)}" role="img" aria-label="Gatinho ${esc(cats[key]?.[0]||'dormindo')} em pixel art" focusable="false" `);
};

let state,loadError=false;try{const stored=localStorage.getItem('nekoquest_v4');if(stored)state=Core.validate(JSON.parse(stored));else{const old=localStorage.getItem('nekoquest_v3');if(old)state=Core.migrate(JSON.parse(old));else{let legacy=JSON.parse(localStorage.getItem('neko_tasks_v1')||'[]');state=Core.migrate({tasks:legacy})}}}catch{state=Core.defaults();loadError=true}
let page='home',taskFilter='today',query='',categoryFilter='all',sort='priority',calMonth=Core.today().slice(0,7),day=Core.today(),finMonth=Core.today().slice(0,7),finTab='overview',historyTab='all',installPrompt=null,financeFilter='all',financeQuery='',appUpdate=false,missionView='list';
function save(){if(loadError){toast('Importe um backup para retomar o salvamento. O arquivo anterior foi preservado.');return false}try{localStorage.setItem('nekoquest_v4',JSON.stringify(state));return true}catch{toast('Armazenamento indisponível. Exporte seu backup.');return false}}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
const btn=(action,label,cl='')=>`<button class="${cl}" data-action="${action}">${label}</button>`;
const empty=(title,desc,skin='mochi')=>`<div class="empty">${cat(skin)}<h3>${title}</h3><p>${desc}</p></div>`;
const head=(k,title,desc='')=>`<div class="eyebrow">${k}</div><h1>${title}</h1>${desc?`<p class="muted">${desc}</p>`:''}`;
function go(p){if(p==='calendar'){p='tasks';missionView='calendar'}if(p==='habits'){p='tasks';missionView='routines'}page=p;render();window.scrollTo({top:0,behavior:'instant'});$('#app').focus({preventScroll:true})}
function modal(title,body){$('#modal').innerHTML=`<div class="row"><h2>${title}</h2><button class="quiet icon-btn" data-action="close" aria-label="Fechar">${icon('close')}</button></div>${body}`;$('#modal').showModal()}
function formField(label,name,value='',type='text',attrs=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}></div>`}
function selectField(label,name,options,value){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>{let [v,n]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(n)}</option>`}).join('')}</select></div>`}
function monthSwitch(m,action){return `<div class="row card"><button class="quiet icon-btn" data-action="${action}" data-dir="-1" aria-label="Mês anterior">${icon('back')}</button><b>${monthLabel(m)}</b><button class="quiet icon-btn" data-action="${action}" data-dir="1" aria-label="Próximo mês">${icon('arrow')}</button></div>`}
function moveMonth(m,dir){let d=new Date(m+'-01T12:00');d.setMonth(d.getMonth()+dir);return Core.date(d).slice(0,7)}
function taskList(tasks){return tasks.length?tasks.map(t=>`<article class="task ${t.done?'done':''} ${t.priority==='high'?'important':''}"><button class="check" data-action="complete" data-id="${esc(t.id)}" aria-pressed="${t.done}" aria-label="${t.done?'Reabrir':'Concluir'} ${esc(t.title)}">${icon(t.done?'check':'box')}</button><button class="task-body grow" data-action="task-detail" data-id="${esc(t.id)}"><span class="title">${esc(t.title)}</span><small><span class="category-dot ${esc(['Estudos','Trabalho','Saúde','Pessoal'].includes(t.category)?t.category:'Pessoal')}"></span>${esc(t.category||'Pessoal')} · <span class="${!t.done&&t.date<Core.today()?'danger':''}">${t.date===Core.today()?'Hoje':shortDate(t.date)}${t.time?' · '+esc(t.time):''}</span></small>${t.subtasks.length?`<span class="mini-progress"><i style="width:${t.subtasks.filter(x=>x.done).length/t.subtasks.length*100}%"></i></span>`:''}</button><div class="task-end">${t.id===state.pinnedTask?'<span class="priority-mark" aria-label="Próximo passo escolhido">★</span>':''}${t.priority==='high'?'<span class="priority-mark" aria-label="Prioridade alta">!</span>':''}<small class="xp-tag">${esc(t.xp)} XP</small>${t.repeat!=='none'?'<small aria-label="Recorrente">↻</small>':''}</div></article>`).join(''):empty('Espaço para o próximo passo','Crie uma missão pequena. Seu gatinho acompanha você.')}

function home(){
 const today=Core.today(),next=Core.nextTask(state),done=Core.completions(state).filter(h=>Core.date(new Date(h.at))===today).length;

 return `<div class="row greeting"><div><div class="eyebrow">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'})}</div><h1>Olá, ${esc(state.name)} <span class="tiny-star">✦</span></h1></div><button class="level-pill" data-page="insights">Nv. ${1+Math.floor(state.xpTotal/100)}</button></div><p class="intro muted">Uma coisa de cada vez.</p>
 <div class="scene scene-home"><div class="scene-copy"><span class="scene-kicker">SEU REFÚGIO</span><b>${esc(cats[state.cat][0])} está com você.</b><small>${next?'Vamos cuidar do próximo passo?':'Aproveite sua pausa.'}</small><button data-page="cats">Visitar os gatos ${icon('arrow')}</button></div>${cat(state.cat,'hero-cat')}</div>

function filteredTasks(){let ts=state.tasks.filter(t=>{if(t.archived)return false;if(taskFilter==='week'&&(t.date<Core.week(state)[0].day||t.date>Core.week(state)[6].day))return false;if(taskFilter==='today'&&(t.done||t.date>Core.today()))return false;if(taskFilter==='pending'&&t.done)return false;if(taskFilter==='done'&&!t.done)return false;if(taskFilter==='upcoming'&&(t.done||t.date<=Core.today()))return false;return t.title.toLocaleLowerCase().includes(query.toLocaleLowerCase())&&(categoryFilter==='all'||t.category===categoryFilter)});return ts.sort((a,b)=>sort==='priority'?(({high:2,normal:1,low:0}[b.priority]||0)-({high:2,normal:1,low:0}[a.priority]||0)||a.date.localeCompare(b.date)):a.date.localeCompare(b.date))}
function tasks(){
 const tabs=`<div class="tabs mission-tabs" role="group" aria-label="Visualização de missões">${[['list','Lista'],['calendar','Agenda'],['routines','Recorrentes']].map(([v,n])=>`<button data-action="mission-view" data-value="${v}" class="${missionView===v?'selected':''}" aria-pressed="${missionView===v}">${n}</button>`).join('')}</div>`;

 else content=`<div class="search">${icon('search')}<input id="search" placeholder="Buscar missão…" aria-label="Buscar missão" value="${esc(query)}"></div><div class="chips">${[['today','Hoje'],['pending','A fazer'],['week','Semana'],['upcoming','Próximas'],['done','Concluídas'],['all','Todas']].map(([v,n])=>`<button data-action="task-filter" data-value="${v}" class="${v===taskFilter?'selected':''}">${n}</button>`).join('')}</div><div class="grid"><select id="categoryFilter" aria-label="Filtrar categoria"><option value="all">Todas as categorias</option>${['Estudos','Trabalho','Saúde','Pessoal'].map(c=>`<option ${categoryFilter===c?'selected':''}>${c}</option>`).join('')}</select><select id="taskSort" aria-label="Ordenar missões"><option value="date" ${sort==='date'?'selected':''}>Por data</option><option value="priority" ${sort==='priority'?'selected':''}>Por prioridade</option></select></div><div id="task-results">${taskGroups(filteredTasks())}</div>`;
 return `<div class="row"><div>${head('TUDO EM UM SÓ LUGAR','Missões')}</div><button class="primary icon-btn" data-action="quick-task" aria-label="Adicionar missão rapidamente">${icon('plus')}</button></div>${tabs}${content}<div class="mission-create"><button class="primary wide" data-action="task">${icon('plus')} ${missionView==='routines'?'Nova missão recorrente':'Nova missão'}</button><button class="quiet wide" data-action="templates">Usar um modelo</button></div>`;
}

function calendar(){let d=new Date(calMonth+'-01T12:00'),count=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return monthSwitch(calMonth,'calendar-month')+`<div class="calendar">${['D','S','T','Q','Q','S','S'].map(c=>`<small>${c}</small>`).join('')}${'<span></span>'.repeat(d.getDay())}${Array.from({length:count},(_,i)=>{let dt=calMonth+'-'+String(i+1).padStart(2,'0');return `<button data-action="day" data-value="${dt}" class="${dt===day?'selected':''} ${state.tasks.some(t=>t.date===dt&&!t.archived)?'dot':''}" aria-label="${shortDate(dt)}">${i+1}</button>`}).join('')}</div><div class="section row"><h2>${shortDate(day)}</h2><button class="quiet" data-action="calendar-today">Voltar para hoje</button></div>${taskList(state.tasks.filter(t=>t.date===day&&!t.archived))}`}

function focus(){const target=state.tasks.find(t=>t.id===state.focusTask),last=state.lastFocus,canFinish=last?.taskId&&state.tasks.some(t=>t.id===last.taskId&&!t.done);return head('UMA COISA DE CADA VEZ','Hora do foco')+`${last?`<div class="focus-finished"><div class="row"><b>${icon('check')} Sessão concluída</b><button class="quiet icon-btn" data-action="dismiss-focus" aria-label="Fechar resumo da sessão">${icon('close')}</button></div><p>${esc(last.title)}</p>${canFinish?`<button class="wide" data-action="finish-focused-task" data-id="${esc(last.taskId)}">Concluir esta missão</button>`:'<small>Mais um tempo dedicado a você.</small>'}</div>`:''}<div class="focus-context"><span class="eyebrow">${state.timer.mode==='focus'?'MISSÃO EM FOCO':'HORA DE RESPIRAR'}</span><h2>${esc(state.timer.taskTitle||target?.title||'Foco livre')}</h2></div><div class="timer">${cat('sleep')}<strong id="clock">25:00</strong><small>${state.timer.mode==='focus'?'FOCO':'PAUSA'}</small></div><div class="row">${btn('timer-reset',icon('reset'),'icon-btn')}${btn('timer',icon(state.timer.end?'pause':'play')+(state.timer.end?'Pausar':state.timer.startedAt?'Continuar':'Começar'),'primary grow')}${btn('timer-mode',state.timer.mode==='focus'?'Pausa':'Foco')}</div><div class="card"><label for="focusTask">Escolher missão</label><select id="focusTask" ${state.timer.startedAt?'disabled':''}><option value="">Foco livre</option>${state.tasks.filter(t=>!t.done&&t.date<=Core.today()).map(t=>`<option value="${esc(t.id)}" ${state.focusTask===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select><details class="focus-settings"><summary>Ajustar duração · ${state.focus} / ${state.break} min</summary><form data-form="timer"><div class="grid">${formField('Foco (min)','focus',state.focus,'number','min="1" max="180" required')}${formField('Pausa (min)','break',state.break,'number','min="1" max="60" required')}</div><button class="wide">Salvar duração</button></form></details></div><p class="center muted">$ function rewardPage(){return head('MERECIDAS PAUSAS','Recompensas')+`<div class="card row">${cat('mikan')}<div><small>Seu saldo de missões</small><h1 class="gold">${state.coins} ◈</h1><small>Moedas virtuais para suas pausas.</small></div></div><div class="grid">${state.rewards.map(r=>`<div class="card rewardcard"><div class="row">${cat(r.cat)}<button class="quiet icon-btn" data-action="reward" data-id="${esc(r.id)}" aria-label="Editar recompensa">${icon('edit')}</button></div><b>${esc(r.title)}</b><p class="gold">◈ ${r.cost}</p><button class="wide" data-action="redeem" data-id="${esc(r.id)}" ${state.coins<r.cost?'disabled':''}>Resgatar</button></div>`).join('')}</div>${btn('reward',icon('plus')+' Nova recompensa','primary wide')}<div class="section"><h2>Já aproveitadas</h2></div>${state.history.filter(h=>h.type==='reward').slice().reverse().slice(0,15).map(h=>`<div class="card row"><span>${esc(h.title)}</span><small>${new Date(h.at).toLocaleDateString('pt-BR')}</small></div>`).join('')||'<p class="muted">Suas pausas conquistadas aparecerão aqui.</p>'}`}

function finances(){let f=Core.finance(state,finMonth),budget=state.finance.budgets[finMonth]||{},totalBudget=Object.values(budget).reduce((a,b)=>a+b,0);let html=`<div class="row"><div>${head('UM FUTURO MAIS TRANQUILO','Finanças')}</div><button class="privacy-button icon-btn" data-action="privacy" aria-label="${state.preferences.hideMoney?'Mostrar valores':'Ocultar valores'}" aria-pressed="${state.preferences.hideMoney}">${state.preferences.hideMoney?'◌':'◉'}</button></div>`+monthSwitch(finMonth,'finance-month')+`<div class="tabs">${[['overview','Resumo'],['entries','Lançamentos'],['budget','Orçamento'],['goals','Metas'],['reports','Relatórios'],['calendar','Agenda']].map(([v,n])=>`<button class="${finTab===v?'selected':''}" data-action="finance-tab" data-value="${v}">${n}</button>`).join('')}</div>`;

if(finTab==='entries'){html+=`<div class="search">${icon('search')}<input id="finance-search" aria-label="Buscar lançamento" placeholder="Buscar lançamento…" value="${esc(financeQuery)}"></div><div class="chips">${[['all','Todos'],['pending','Pendentes'],['expense','Despesas'],['income','Receitas']].map(([v,n])=>`<button data-action="finance-filter" data-value="${v}" class="${financeFilter===v?'selected':''}">${n}</button>`).join('')}</div><div id="finance-results">${entryList(filteredEntries(f.entries))}</div>`+`<button class="wide" data-action="repeat-entries">Trazer recorrentes do mês anterior</button><p class="footnote">Copia os lançamentos marcados como mensais para este mês, como pendentes e sem duplicar.</p>`}

if(finTab==='goals'){html+=`<p class="muted">Acompanhe o dinheiro que você já separou para seus planos.</p>${state.finance.goals.map(g=>`<div class="card"><div class="row">${cat('sora','smallcat')}<div class="grow"><b>${esc(g.title)}</b><small style="display:block">${money(g.saved)} de ${money(g.target)}</small></div><button class="quiet icon-btn" data-action="goal" data-id="${esc(g.id)}" aria-label="Editar meta">${icon('edit')}</button></div><div class="bar"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><small>${g.saved>=g.target?'Meta alcançada!':Math.round(g.saved/g.target*100)+'% do caminho'}</small></div>`).join('')||empty('Um sonho de cada vez','Crie uma meta e atualize o valor que já guardou.','sora')}${btn('goal',icon('plus')+' Nova meta','primary wide')}<p class="footnote">Metas são um acompanhamento separado; seus valores não alteram o saldo ou os lançamentos.</p>`}

if(a==='confirm-settle'){let item=state.finance.entries.find(x=>x.id===d.id);if(item){item.paid=true;save();$('#modal').close();render();toast('Lançamento efetivado.')}}

document.addEventListener('input',e=>{if(e.target.id==='finance-search'){financeQuery=e.target.value;$('#finance-results').innerHTML=entryList(filteredEntries(Core.finance(state,finMonth).entries))}});

function showIssue(message){const dialog=$('#modal');if(dialog?.open){let el=dialog.querySelector('.form-error');if(!el){el=document.createElement('p');el.className='form-error';el.setAttribute('role','alert');dialog.prepend(el)}el.textContent=message}else toast(message)}
function completeMission(id,close=false){try{const done=Core.toggleTask(state,id);if(!save())return false;if(close)$('#modal').close();render();if(done)celebrate();toast(done?'Missão concluída. Um passo a mais!':'Missão reaberta. XP e moedas revertidos.');return true}catch(e){showIssue(e.message);return false}}
function routineTrail(t){const days=Core.routineDays(state,t.seriesId||t.id);return `<div class="routine-trail"><div class="row"><small>REGISTROS DA ROTINA</small><small>${days.length} dias</small></div><div class="week">${Array.from({length:7},(_,i)=>{const d=Core.addDays(Core.today(),i-6);return `<span class="${days.includes(d)?'hit':''}" title="${shortDate(d)}">${new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'narrow'})}${days.includes(d)?'<b>✓</b>':'<b>·</b>'}</span>`}).join('')}</div></div>`}
function routines(){const seen=new Set(),active=state.tasks.filter(t=>!t.done&&t.repeat!=='none'&&!t.archived).sort((a,b)=>a.date.localeCompare(b.date)).filter(t=>{let key=t.seriesId||t.id;if(seen.has(key))return false;seen.add(key);return true});return `<p class="view-description">Missões que se repetem. Cada conclusão cria a próxima ocorrência e vale XP e moedas.</p>${state.habits.length?'<p class="migration-note">Seus hábitos vieram para cá, com os registros anteriores preservados.</p>':''}${active.map(t=>`<div class="routine-card">${taskList([t])}${routineTrail(t)}<div class="routine-footer"><span>${{daily:'Todo dia',weekly:'Toda semana',monthly:'Todo mês'}[t.repeat]}</span><button class="quiet" data-action="task" data-id="${esc(t.id)}">Editar recorrência</button></div></div>`).join('')||empty('Pequenos passos que se repetem','Crie uma missão diária, semanal ou mensal.','yuki')}`}
function quickTask(){modal('Capture uma ideia',`<form data-form="quick-task">${formField('O que você precisa fazer?','title','','text','required maxlength="100" placeholder="Ex.: revisar meu currículo" autofocus')}<div class="grid">${formField('Data','date',Core.today(),'date','required')}${selectField('Categoria','category',['Pessoal','Estudos','Trabalho','Saúde'],'Pessoal')}</div><p class="footnote">Você pode ajustar duração, prioridade e repetição depois.</p><button class="primary wide">Adicionar missão</button></form>`)}
const missionTemplates=[{title:'Estudar SQL',category:'Estudos',minutes:25,xp:15,repeat:'daily',subtasks:[{title:'Revisar um conceito',done:false},{title:'Praticar com exercícios',done:false}]},{title:'Ler por 10 minutos',category:'Pessoal',minutes:10,xp:10,repeat:'daily',subtasks:[]},{title:'Cuidar do corpo',category:'Saúde',minutes:30,xp:15,repeat:'daily',subtasks:[]},{title:'Revisar minhas finanças',category:'Pessoal',minutes:15,xp:10,repeat:'weekly',subtasks:[{title:'Conferir lançamentos',done:false},{title:'Revisar contas pendentes',done:false},{title:'Ajustar orçamento',done:false}]}];
function templates(){modal('Comece com um modelo',`<p class="muted">Personalize antes de salvar.</p>${missionTemplates.map((t,i)=>`<button class="template-option" data-action="use-template" data-index="${i}"><span><b>${esc(t.title)}</b><small>${t.minutes} min · ${t.repeat==='daily'?'Todo dia':'Semanal'} · ${t.category}</small></span>${icon('arrow')}</button>`).join('')}`)}
function startTaskFocus(id){let task=state.tasks.find(t=>t.id===id);if(!task||task.done){showIssue('Escolha uma missão pendente.');return}if(task.date>Core.today()){showIssue('Esta missão está planejada para '+shortDate(task.date)+'. Ajuste a data para começar hoje.');return}
 const timer=state.timer;
 if(timer.startedAt&&timer.taskId===task.id&&timer.mode==='focus'){state.focusTask=task.id;$('#modal').close();go('focus');return}
 if(timer.startedAt&&!confirm('Encerrar a sessão atual sem registrá-la e focar nesta missão?'))return;
 state.focusTask=task.id;state.lastFocus=null;state.timer={mode:'focus',remaining:state.focus*60,end:Date.now()+state.focus*60000,startedAt:Date.now(),taskId:task.id,taskTitle:task.title,duration:state.focus};save();$('#modal').close();go('focus');
}
function focusDock(){const t=state.timer;if(!t.startedAt||page==='focus')return '';return `<button class="focus-dock" data-page="focus"><span>${icon('clock')} ${t.mode==='focus'?'Foco':'Pausa'} ${t.end?'em andamento':'pausado'}</span><b id="mini-clock"></b>${icon('arrow')}</button>`}
function upcomingBills(){const until=Core.addDays(Core.today(),7),bills=state.finance.entries.filter(e=>e.type==='expense'&&!e.paid&&e.date<=until&&e.date.startsWith(finMonth)).sort((a,b)=>a.date.localeCompare(b.date));if(!bills.length)return '';return `<div class="section row"><h2>Contas para cuidar</h2><small>Atrasadas e próximos 7 dias</small></div><div class="card bill-reminders">${bills.slice(0,3).map(e=>`<button data-action="settle" data-id="${esc(e.id)}"><span><b>${esc(e.title)}</b><small class="${e.date<Core.today()?'danger':''}">${e.date<Core.today()?'Vencida · ':''}${shortDate(e.date)}</small></span><strong>${money(e.amount)}</strong>${icon('arrow')}</button>`).join('')}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.action==='open-missions'){missionView='list';go('tasks')}
 if(d.action==='mission-view'){missionView=d.value;render()}
 if(d.action==='quick-task')quickTask();
 if(d.action==='templates')templates();
 if(d.action==='use-template'){const t=missionTemplates[Number(d.index)];if(t)taskForm(undefined,{...t,subtasks:t.subtasks.map(s=>({...s}))})}
 if(d.action==='calendar-today'){day=Core.today();calMonth=day.slice(0,7);render()}
 if(d.action==='focus-task')startTaskFocus(d.id);
 if(d.action==='pin-task'){const t=state.tasks.find(t=>t.id===d.id);if(!t||t.done||t.date>Core.today()){showIssue('Escolha uma missão pendente de hoje ou atrasada.');return}state.pinnedTask=state.pinnedTask===d.id?null:d.id;save();$('#modal').close();render();toast(state.pinnedTask?'Próximo passo escolhido.':'A sugestão automática foi restaurada.')}
 if(d.action==='dismiss-focus'){state.lastFocus=null;save();render()}
 if(d.action==='finish-focused-task'){if(completeMission(d.id)){state.lastFocus=null;save();render()}}
 if(d.action==='copy-budget'){const prev=moveMonth(finMonth,-1),source=state.finance.budgets[prev];if(!source||!Object.keys(source).length){toast('Não há orçamento no mês anterior.');return}if(Object.keys(state.finance.budgets[finMonth]||{}).length&&!confirm('Substituir os limites deste mês pelos do mês anterior?'))return;state.finance.budgets[finMonth]={...source};save();render();toast('Orçamento copiado. Você pode ajustar os limites.')}
});

let listChoice='all',noteChoice='all',onlyFavorites=false,agendaMode='month';
const periodNames={daily:'dia',weekly:'semana',monthly:'mês',yearly:'ano'};
const org=()=>Ext.init(state).organizer;
const series=()=>[...new Map(state.tasks.filter(t=>t.repeat!=='none'&&!t.archived).map(t=>[t.seriesId||t.id,t])).values()];
function organizerOptions(){return [['','Sem rotina'],...series().map(t=>[t.seriesId||t.id,t.title])];}
function extButton(action,label,id=''){return `<button type="button" class="quiet" data-action="${action}" data-id="${esc(id)}">${label}</button>`}
function listManager(){modal('Minhas listas',`${org().lists.map(l=>`<div class="row card"><b class="grow">${esc(l.title)}</b>${extButton('list-rename','Renomear',l.id)}${extButton('list-delete','Excluir',l.id)}</div>`).join('')}<form data-form="ext-list">${formField('Nome da nova lista','title','','text','required maxlength="100"')}<button class="primary wide">Criar lista</button></form><p class="footnote">Excluir uma lista mantém suas tarefas.</p>`)}
const originalTasks=tasks;
tasks=function(){let html=originalTasks();if(missionView==='list')html=html.replace('<div class="search">',`<div class="row list-toolbar"><select id="listChoice" aria-label="Filtrar por lista"><option value="all">Todas as listas</option><option value="" ${listChoice===''?'selected':''}>Sem lista</option>${org().lists.map(l=>`<option value="${esc(l.id)}" ${listChoice===l.id?'selected':''}>${esc(l.title)}</option>`).join('')}</select>${extButton('lists','Gerenciar listas')}</div><div class="search">`);return html};
const originalFiltered=filteredTasks;filteredTasks=()=>originalFiltered().filter(t=>listChoice==='all'||(t.listId||'')===listChoice);
const originalTaskForm=taskForm;taskForm=function(id,preset){originalTaskForm(id,preset);let t=state.tasks.find(x=>x.id===id);$('#modal form').insertAdjacentHTML('afterbegin',selectField('Lista','listId',[['','Sem lista'],...org().lists.map(l=>[l.id,l.title])],t?.listId||''))};
const originalRoutines=routines;
routines=function(){return `<p class="view-description">Rotinas são missões que se repetem. Use metas para registrar quantidades e acompanhar sua consistência; a conclusão da missão continua separada e vale XP.</p>${series().map(t=>{let key=t.seriesId||t.id,g=org().goals[key],s=g?Ext.stats(state,key):null,n=g?Ext.total(state,key,Core.today()):0;return `<section class="card habit-card"><div class="row">${cat('mochi','smallcat')}<h2 class="grow">${esc(t.title)}</h2></div>${g?`<p><b>${n.toLocaleString('pt-BR')} / ${g.target.toLocaleString('pt-BR')}</b> ${esc(g.unit)} por ${periodNames[g.period]}</p><progress value="${Math.min(n,g.target)}" max="${g.target}"></progress><p class="muted">Sequência: ${s.current} · Recorde: ${s.best} ${periodNames[g.period]}(s)</p>`:routineTrail(t)}<div class="row wrap">${extButton('routine-goal','Definir meta',t.id)}${g?extButton('activity','Registrar',t.id)+extButton('activity-history','Registros',t.id)+(g.unit.toLowerCase().startsWith('min')?extButton('routine-timer','Cronometrar',t.id):''):''}${extButton('task','Editar missão',t.id)}</div></section>`}).join('')||empty('Uma rotina de cada vez','Crie uma missão recorrente ou escolha um modelo.','yuki')}<div class="section row"><h2>Novos começos</h2>${extButton('quit','Adicionar')}</div><p class="muted">Acompanhe o tempo desde que deixou um hábito.</p>${org().quits.map(q=>`<div class="card"><h3>${esc(q.title)}</h3><p class="big">${Math.floor((Date.now()-q.since)/86400000)} dias</p><small>Desde ${new Date(q.since).toLocaleDateString('pt-BR')}</small><div class="row">${extButton('quit-reset','Novo começo',q.id)}${extButton('quit-delete','Excluir',q.id)}</div></div>`).join('')}`};
function routineGoalForm(id){let t=state.tasks.find(t=>t.id===id),key=t.seriesId||t.id,g=org().goals[key]||{target:1,unit:'vez',period:t.repeat};modal('Meta · '+esc(t.title),`<form data-form="ext-goal" data-id="${esc(key)}">${formField('Quantidade','target',g.target,'number','min="0.001" max="1000000000" step="any" required')}${formField('Unidade (páginas, minutos, copos…)','unit',g.unit,'text','required maxlength="30"')}${selectField('Período da meta','period',Ext.periods.map(p=>[p,'Por '+periodNames[p]]),g.period)}<p class="footnote">A meta mede sua atividade. A recorrência da missão pode ser ajustada em Editar missão. Alterar a meta recalcula as estatísticas, preservando os registros.</p><button class="primary wide">Salvar meta</button></form>`)}
function activityForm(id){let t=state.tasks.find(t=>t.id===id),key=t.seriesId||t.id,g=org().goals[key];modal('Registrar · '+esc(t.title),`<form data-form="ext-log" data-id="${esc(key)}">${formField('Quantidade em '+g.unit,'amount',1,'number','min="0.001" max="1000000000" step="any" required')}${formField('Data','date',Core.today(),'date',`required max="${Core.today()}"`)}${formField('Nota (opcional)','note','','text','maxlength="2000"')}<p class="footnote">Registros alimentam a meta e as sequências. Não geram XP: conclua a missão quando terminar.</p><button class="primary wide">Registrar atividade</button></form>`)}
function activityHistory(id){let t=state.tasks.find(t=>t.id===id),key=t.seriesId||t.id;modal('Registros · '+esc(t.title),org().logs.filter(l=>l.key===key).sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="card"><div class="row"><b class="grow">${l.amount} · ${shortDate(l.date)}</b>${extButton('log-delete','Excluir',l.id)}</div><p>${esc(l.note)}</p></div>`).join('')||'<p>Nenhuma atividade registrada.</p>')}
function safeNote(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/_([^_]+)_/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function journal(){return head('SEU ESPAÇO DE REFLEXÃO','Diário')+`<div class="row">${extButton('note','+ Nova nota')}<button data-action="note-favorites" class="quiet" aria-pressed="${onlyFavorites}">${onlyFavorites?'★ Favoritas':'☆ Todas'}</button></div><label for="noteChoice">Filtrar por rotina</label><select id="noteChoice"><option value="all">Todas as notas</option>${organizerOptions().map(([k,v])=>`<option value="${esc(k)}" ${noteChoice===k?'selected':''}>${esc(v)}</option>`).join('')}</select>${org().notes.filter(n=>(noteChoice==='all'||n.key===noteChoice)&&(!onlyFavorites||n.favorite)).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<article class="card journal-note"><small>${shortDate(n.date)}</small><h2>${esc(n.title)}</h2><div>${safeNote(n.text)}</div><div class="row">${extButton('note', 'Editar',n.id)}${extButton('note-star',n.favorite?'★ Favorita':'☆ Favoritar',n.id)}${extButton('note-delete','Excluir',n.id)}</div></article>`).join('')||''}`}
function noteForm(id){let n=org().notes.find(n=>n.id===id)||{title:'',text:'',key:'',date:Core.today()};modal('Meu diário',`<form data-form="ext-note" data-id="${esc(id||'')}">${formField('Título','title',n.title,'text','required maxlength="150"')}${formField('Data','date',n.date,'date','required')}${selectField('Rotina associada','key',organizerOptions(),n.key)}<label for="note-text">Reflexão</label><div class="row">${extButton('note-bold','Negrito')}${extButton('note-italic','Itálico')}</div><textarea id="note-text" name="text" maxlength="10000" rows="7" required>${esc(n.text)}</textarea><p class="footnote">Use **negrito** e _itálico_ para destacar trechos.</p><div id="note-preview" class="note-preview">${safeNote(n.text)}</div><button class="primary wide">Salvar nota</button></form>`)}
const originalMore=more;more=()=>originalMore()+`<button class="menu-item" data-page="journal">Diário e reflexões ${icon('arrow')}</button>`;
function reminderForm(id){let r=org().reminders.find(x=>x.id===id)||{title:'',date:Core.today(),time:'09:00',repeat:'once'};modal('Lembrete',`<form data-form="ext-reminder" data-id="${esc(id||'')}">${formField('Título','title',r.title,'text','required maxlength="150"')}${formField('Data inicial','date',r.date,'date','required')}${formField('Horário','time',r.time,'time','required')}${selectField('Repetir','repeat',[['once','Uma vez'],['daily','Diariamente'],['weekly','Semanalmente'],['monthly','Mensalmente']],r.repeat)}<p class="footnote">Avisos funcionam enquanto o aplicativo está aberto. Exporte para o calendário do celular para receber lembretes em segundo plano. Mensais no dia 31 só ocorrem em meses com esse dia.</p><button class="primary wide">Salvar lembrete</button></form>`)}
const originalCalendar=calendar;
calendar=function(){let days=agendaMode==='week'?Array.from({length:7},(_,i)=>Core.addDays(Ext.period(day,'weekly'),i)):[day];return `<div class="tabs">${[['day','Dia'],['week','Semana'],['month','Mês']].map(([v,n])=>`<button data-action="agenda-mode" data-id="${v}" class="${agendaMode===v?'selected':''}">${n}</button>`).join('')}</div>${agendaMode==='month'?originalCalendar():`<label for="agendaDate">Data de referência</label><input id="agendaDate" type="date" value="${day}">${days.map(d=>`<div class="section"><h3>${shortDate(d)}</h3>${taskList(state.tasks.filter(t=>t.date===d&&!t.archived))}</div>`).join('')}`}<div class="section row"><h2>Lembretes</h2>${extButton('reminder','+ Novo')}</div><p class="footnote">${agendaMode==='week'?'Nesta semana':'Em '+shortDate(day)} · horários do dispositivo</p>${org().reminders.filter(r=>days.some(d=>Ext.due(r,d))).map(r=>`<div class="card row"><div class="grow"><b>${esc(r.title)}</b><p>${r.time} · ${{once:'Uma vez',daily:'Diário',weekly:'Semanal',monthly:'Mensal'}[r.repeat]}</p></div>${extButton('reminder','Editar',r.id)}</div>`).join('')||'<p class="muted">Nenhum lembrete neste período.</p>'}<div class="row wrap">${extButton('reminders','Todos os lembretes')}${extButton('export-calendar','Exportar calendário')}</div>`};
function allReminders(){modal('Todos os lembretes',`<p class="footnote">Avisos locais enquanto o NekoQuest estiver aberto. Ao reabrir, serão mostrados lembretes pendentes do dia.</p>${extButton('notify-permission','Ativar notificações')}${org().reminders.map(r=>`<div class="card"><b>${esc(r.title)}</b><p>${shortDate(r.date)} · ${r.time}</p><div class="row wrap">${extButton('reminder','Editar',r.id)}${extButton('reminder-toggle',r.enabled?'Pausar':'Ativar',r.id)}${extButton('reminder-delete','Excluir',r.id)}</div></div>`).join('')}`)}
function quitForm(){modal('Um novo começo',`<form data-form="ext-quit">${formField('Hábito que você deixou','title','','text','required maxlength="100"')}${formField('Desde quando','date',Core.today(),'date',`required max="${Core.today()}"`)}<button class="primary wide">Acompanhar marco</button></form>`)}
function extSubmit(type,v,id){let o=org();if(type==='ext-list'){if(!v.title.trim())throw Error('Informe um nome.');o.lists.push({id:Core.id(),title:v.title.trim()})}if(type==='ext-goal'){let target=Number(v.target);if(!Number.isFinite(target)||target<=0||target>1e9||!v.unit.trim()||!Ext.periods.includes(v.period))throw Error('Confira a meta.');o.goals[id]={target,unit:v.unit.trim(),period:v.period}}
 if(type==='ext-log'){let amount=Number(v.amount);if(!Number.isFinite(amount)||amount<=0||amount>1e9||!Core.validDate(v.date)||v.date>Core.today())throw Error('Confira quantidade e data.');o.logs.push({...v,amount,key:id,id:Core.id()})}
 if(type==='ext-note'){if(!v.title.trim()||!v.text.trim()||!Core.validDate(v.date))throw Error('Confira a nota.');let n=o.notes.find(x=>x.id===id);if(n)Object.assign(n,v);else o.notes.push({...v,id:Core.id(),favorite:false})}
 if(type==='ext-reminder'){if(!v.title.trim()||!Core.validDate(v.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))throw Error('Confira título, data e horário.');let r=o.reminders.find(x=>x.id===id);if(r)Object.assign(r,v,{lastFired:null});else o.reminders.push({...v,id:Core.id(),enabled:true})}
 if(type==='ext-quit'){if(!v.title.trim()||!Core.validDate(v.date)||v.date>Core.today())throw Error('Confira nome e data.');o.quits.push({id:Core.id(),title:v.title.trim(),since:new Date(v.date+'T00:00').getTime()})}}
document.addEventListener('click',async e=>{let d=e.target.closest('button')?.dataset;if(!d)return;let a=d.action,o=org();try{
 if(a==='lists')listManager();if(a==='list-rename'){let l=o.lists.find(x=>x.id===d.id),name=prompt('Nome da lista',l.title);if(name?.trim()){l.title=name.trim().slice(0,100);save();render();listManager()}}
 if(a==='list-delete'&&confirm('Excluir a lista? As tarefas serão mantidas.')){o.lists=o.lists.filter(x=>x.id!==d.id);state.tasks.forEach(t=>{if(t.listId===d.id)t.listId=''});listChoice='all';save();render();listManager()}
 if(a==='routine-timer')routineStopwatch(d.id);if(a==='watch-start'){let w=o.stopwatch;w.startedAt=Date.now();save();routineStopwatch(w.taskId)}if(a==='watch-pause'){let w=o.stopwatch;w.elapsed+=Date.now()-w.startedAt;w.startedAt=null;save();routineStopwatch(w.taskId)}if(a==='watch-log'){let w=o.stopwatch,minutes=(w.elapsed+(w.startedAt?Date.now()-w.startedAt:0))/60000;if(minutes<0.001){toast('Inicie o cronômetro antes de registrar.');return}w.elapsed=minutes*60000;w.startedAt=null;save();activityForm(w.taskId);$('#modal [name=amount]').value=Math.round(minutes*1000)/1000;$('#modal form').dataset.stopwatch='true'}if(a==='watch-reset'&&confirm('Zerar o cronômetro sem registrar?')){o.stopwatch={taskId:d.id,elapsed:0,startedAt:null};save();routineStopwatch(d.id)}
 if(a==='routine-goal')routineGoalForm(d.id);if(a==='activity')activityForm(d.id);if(a==='activity-history')activityHistory(d.id);
 if(a==='log-delete'&&confirm('Excluir o registro e recalcular a sequência?')){o.logs=o.logs.filter(x=>x.id!==d.id);save();$('#modal').close();render()}
 if(a==='note')noteForm(d.id);if(a==='note-favorites'){onlyFavorites=!onlyFavorites;render()}
 if(a==='note-star'){let n=o.notes.find(x=>x.id===d.id);n.favorite=!n.favorite;save();render()}
 if(a==='note-delete'&&confirm('Excluir esta nota?')){o.notes=o.notes.filter(x=>x.id!==d.id);save();render()}
 if(a==='note-bold'||a==='note-italic'){let el=$('#note-text'),mark=a==='note-bold'?'**':'_',i=el.selectionStart,j=el.selectionEnd;el.setRangeText(mark+el.value.slice(i,j)+mark,i,j,'select');el.focus();$('#note-preview').innerHTML=safeNote(el.value)}
 if(a==='quit')quitForm();if(a==='quit-reset'&&confirm('Reiniciar a contagem a partir de agora?')){o.quits.find(x=>x.id===d.id).since=Date.now();save();render()}
 if(a==='quit-delete'&&confirm('Excluir este marco?')){o.quits=o.quits.filter(x=>x.id!==d.id);save();render()}
 if(a==='agenda-mode'){agendaMode=d.id;render()}if(a==='reminder')reminderForm(d.id);if(a==='reminders')allReminders();
 if(a==='reminder-toggle'){let r=o.reminders.find(x=>x.id===d.id);r.enabled=!r.enabled;save();render();allReminders()}
 if(a==='reminder-delete'&&confirm('Excluir lembrete?')){o.reminders=o.reminders.filter(x=>x.id!==d.id);save();render();allReminders()}
 if(a==='notify-permission'){if(!('Notification'in window)){toast('Use a exportação para o calendário neste navegador.');return}toast((await Notification.requestPermission())==='granted'?'Avisos ativados enquanto o app estiver aberto.':'Permissão não concedida. Você pode exportar o calendário.')}
 if(a==='export-calendar'){if(!o.reminders.some(r=>r.enabled)){toast('Crie ou ative um lembrete primeiro.');return}let url=URL.createObjectURL(new Blob([Ext.ics(o.reminders)],{type:'text/calendar;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='nekoquest-agenda.ics';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Importe o arquivo no calendário e confira os alertas. Reimportações podem duplicar eventos.')}
 }catch(err){showIssue(err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='listChoice'){listChoice=e.target.value;render()}if(e.target.id==='noteChoice'){noteChoice=e.target.value;render()}if(e.target.id==='agendaDate'&&Core.validDate(e.target.value)){day=e.target.value;calMonth=day.slice(0,7);render()}});
document.addEventListener('input',e=>{if(e.target.id==='note-text')$('#note-preview').innerHTML=safeNote(e.target.value)});
async function checkLocalReminders(){let now=new Date(),d=Core.today(),time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');for(let r of org().reminders){if(!Ext.due(r,d)||r.time>time||r.lastFired===d)continue;r.lastFired=d;save();toast('Lembrete: '+r.title);if('Notification'in window&&Notification.permission==='granted'){try{let reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.showNotification('NekoQuest',{body:r.title,tag:r.id,icon:'./cat-192.png'});else new Notification('NekoQuest',{body:r.title})}catch{}}}}
setInterval(checkLocalReminders,30000);

function routineStopwatch(id){let o=org(),w=o.stopwatch;if(w&&w.taskId!==id&&(w.elapsed||w.startedAt)&&!confirm('Descartar o cronômetro anterior e iniciar nesta rotina?'))return;if(!w||w.taskId!==id)w=o.stopwatch={taskId:id,elapsed:0,startedAt:null};let t=state.tasks.find(t=>t.id===id);save();modal('Tempo de atividade',`<p>${esc(t.title)}</p><p class="big" id="routine-watch">00:00</p><div class="row wrap">${extButton(w.startedAt?'watch-pause':'watch-start',w.startedAt?'Pausar':'Iniciar',id)}${extButton('watch-log','Registrar minutos',id)}${extButton('watch-reset','Zerar',id)}</div><p class="footnote">O tempo continua ao fechar esta tela. Registrar abre a atividade para você conferir antes de salvar.</p>`);paintStopwatch()}
function paintStopwatch(){let w=org().stopwatch,el=$('#routine-watch');if(!w||!el)return;let seconds=Math.floor((w.elapsed+(w.startedAt?Date.now()-w.startedAt:0))/1000);el.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
setInterval(paintStopwatch,500);

let financeReportFilter=null,financeCalendarDay=null;
function reportFilter(){return financeReportFilter||{from:finMonth+'-01',to:Core.addDays(moveMonth(finMonth,1)+'-01',-1),type:'all',status:'all',category:'all',query:''}}
function reportEntries(filter=reportFilter()){return state.finance.entries.filter(e=>e.date>=filter.from&&e.date<=filter.to&&(filter.type==='all'||e.type===filter.type)&&(filter.status==='all'||e.paid===(filter.status==='paid'))&&(filter.category==='all'||e.category===filter.category)&&(e.title+' '+e.category).toLocaleLowerCase('pt-BR').includes(filter.query.toLocaleLowerCase('pt-BR'))).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))}
function reportTotals(entries){return entries.reduce((a,e)=>{a[e.type]+=e.amount;if(e.paid)a[e.type+'Paid']+=e.amount;return a},{income:0,expense:0,incomePaid:0,expensePaid:0})}
function previousReportFilter(f){const n=Math.round((new Date(f.to+'T12:00Z')-new Date(f.from+'T12:00Z'))/86400000)+1;return {...f,from:Core.addDays(f.from,-n),to:Core.addDays(f.from,-1)}}
function financeReports(){const f=reportFilter(),es=reportEntries(f),t=reportTotals(es),prior=previousReportFilter(f),p=reportTotals(reportEntries(prior)),cats=[...new Set(state.finance.entries.map(e=>e.category))].sort();return `<p class="view-description">Cruze filtros e compare períodos com a mesma duração.</p><form id="finance-report-form"><div class="grid">${formField('De','from',f.from,'date','required')}${formField('Até','to',f.to,'date','required')}</div><div class="grid">${selectField('Tipo','type',[['all','Receitas e despesas'],['income','Receitas'],['expense','Despesas']],f.type)}${selectField('Situação','status',[['all','Todas'],['paid','Efetivadas'],['pending','Pendentes']],f.status)}</div>${selectField('Categoria','category',[['all','Todas as categorias'],...cats.map(c=>[c,c])],f.category)}${formField('Pesquisar descrição ou categoria','query',f.query,'search','maxlength="150"')}<div class="row"><button class="primary">Aplicar filtros</button><button type="button" data-action="report-reset">Mês atual da tela</button></div></form><div class="section"><h2>${es.length} lançamentos encontrados</h2><p class="footnote">${shortDate(f.from)} a ${shortDate(f.to)} · ${f.from.slice(0,4)} / ${f.to.slice(0,4)}</p></div><div class="grid"><div class="card"><small>Receitas selecionadas</small><p>${money(t.income)}</p></div><div class="card"><small>Despesas selecionadas</small><p>${money(t.expense)}</p></div></div><div class="card"><small>Resultado efetivado no período</small><h2>${money(t.incomePaid-t.expensePaid)}</h2><p class="footnote">Recebido menos pago. Não inclui saldo inicial.</p><p>Variação das despesas pagas: ${money(t.expensePaid-p.expensePaid)}</p><small>Comparação com ${prior.from.split('-').reverse().join('/')} a ${prior.to.split('-').reverse().join('/')}, usando os mesmos filtros.</small></div><details class="card"><summary>Exportar resultados</summary><p class="footnote">Arquivos contêm valores completos. CSV abre no Excel. HTML pode ser impresso ou salvo como PDF pelo navegador.</p><div class="row wrap"><button data-action="report-csv">CSV / Excel</button><button data-action="report-html">HTML / impressão</button><button data-action="report-ics">Calendário (.ics)</button></div></details>${entryList(es)}`}
function financeCalendar(){const first=finMonth+'-01',count=Number(Core.addDays(moveMonth(finMonth,1)+'-01',-1).slice(8));if(!financeCalendarDay?.startsWith(finMonth))financeCalendarDay=first;return `<p class="view-description">Datas de recebimento e vencimento dos lançamentos cadastrados.</p><div class="calendar">${['D','S','T','Q','Q','S','S'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(new Date(first+'T12:00').getDay())}${Array.from({length:count},(_,i)=>{let d=finMonth+'-'+String(i+1).padStart(2,'0'),n=state.finance.entries.filter(e=>e.date===d).length;return `<button data-action="finance-day" data-value="${d}" class="${d===financeCalendarDay?'selected':''} ${n?'dot':''}" aria-label="${d.split('-').reverse().join('/')}, ${n} lançamentos">${i+1}</button>`}).join('')}</div><div class="section"><h2>${shortDate(financeCalendarDay)}</h2></div>${entryList(state.finance.entries.filter(e=>e.date===financeCalendarDay))}<button class="primary wide" data-action="finance-day-entry">Novo lançamento nesta data</button>`}
function financeCsv(es){const cell=v=>{let s=String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};return '\uFEFF'+[['Data','Descrição','Tipo','Categoria','Valor (R$)','Situação'],...es.map(e=>[e.date,e.title,e.type==='income'?'Receita':'Despesa',e.category,(e.amount/100).toFixed(2).replace('.',','),e.paid?'Efetivado':'Pendente'])].map(row=>row.map(cell).join(';')).join('\r\n')}
function financeReportHtml(es,f){const fmt=n=>(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),t=reportTotals(es);return '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NekoQuest — relatório financeiro</title><style>body{font:16px system-ui;margin:24px;color:#18202c}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}main{overflow-x:auto}@media print{body{margin:0;font-size:11px}tr{break-inside:avoid}}</style><h1>NekoQuest · Finanças</h1><p>'+esc(f.from)+' a '+esc(f.to)+'</p><p>Filtros: '+esc(f.type)+' · '+esc(f.status)+' · '+esc(f.category)+' · Pesquisa: '+esc(f.query)+'</p><p>Receitas: '+fmt(t.income)+' · Despesas: '+fmt(t.expense)+' · Resultado efetivado: '+fmt(t.incomePaid-t.expensePaid)+'</p><main><table><thead><tr>'+['Data','Descrição','Tipo','Categoria','Valor','Situação'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+es.map(e=>'<tr>'+[e.date,e.title,e.type==='income'?'Receita':'Despesa',e.category,fmt(e.amount),e.paid?'Efetivado':'Pendente'].map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></main><p>Gerado localmente. Use Imprimir no navegador para salvar como PDF. Datas correspondem às datas cadastradas dos lançamentos.</p></html>'}
function downloadFinance(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.addEventListener('submit',e=>{if(e.target.id!=='finance-report-form')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!Core.validDate(f.from)||!Core.validDate(f.to)||f.from>f.to){toast('Confira o intervalo: a data inicial deve vir antes da final.');return}financeReportFilter=f;render()});
document.addEventListener('click',e=>{const d=e.target.closest('button')?.dataset;if(!d)return;if(d.action==='report-reset'){financeReportFilter=null;render()}if(d.action==='finance-day'){financeCalendarDay=d.value;render()}if(d.action==='finance-day-entry'){entryForm();$('#modal [name=date]').value=financeCalendarDay}if(['report-csv','report-html','report-ics'].includes(d.action)){const es=reportEntries();if(!es.length){toast('Nenhum lançamento para exportar.');return}if(!confirm('Exportar os lançamentos filtrados com descrições e valores completos? O arquivo não será criptografado.'))return;if(d.action==='report-csv')downloadFinance(financeCsv(es),'nekoquest-relatorio.csv','text/csv;charset=utf-8');if(d.action==='report-html')downloadFinance(financeReportHtml(es,reportFilter()),'nekoquest-relatorio.html','text/html;charset=utf-8');if(d.action==='report-ics'){const pending=es.filter(x=>!x.paid);if(!pending.length){toast('Não há lançamentos pendentes neste filtro.');return}downloadFinance(Ext.ics(pending.map(x=>({id:'finance-'+x.id,title:x.title,date:x.date,time:'09:00',enabled:true,repeat:'once'}))),'nekoquest-financas.ics','text/calendar;charset=utf-8');toast('Pendências exportadas às 9h. Confira os alertas no calendário; reimportações podem duplicar eventos.')}}});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});setInterval(tick,500);if('serviceWorker'in navigator&&location.protocol!=='file:'){const hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController){appUpdate=true;render()}});navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}render();if(loadError)toast('Não foi possível ler os dados salvos. O original foi preservado.');else save();



function recentFinanceDescriptions(type){const seen=new Set();return state.finance.entries.filter(e=>e.type===type).slice().sort((a,b)=>b.date.localeCompare(a.date)).filter(e=>{const key=e.title.trim().toLocaleLowerCase('pt-BR');if(seen.has(key))return false;seen.add(key);return true}).slice(0,12)}
function financeSuggestions(type,editing){const entries=recentFinanceDescriptions(type);return `<div id="finance-suggestions"><datalist id="finance-descriptions">${entries.map(e=>`<option value="${esc(e.title)}"></option>`).join('')}</datalist>${!editing&&entries.length?`<p class="footnote">Reutilizar descrição e categoria</p><div class="chips">${entries.slice(0,4).map(e=>`<button type="button" data-action="reuse-finance" data-id="${esc(e.id)}">${esc(e.title)}</button>`).join('')}</div>`:''}</div>`}
function suggestFinanceCategory(form){const title=form.querySelector('[name=title]').value.trim().toLocaleLowerCase('pt-BR'),type=form.querySelector('[name=type]').value,entry=recentFinanceDescriptions(type).find(e=>e.title.trim().toLocaleLowerCase('pt-BR')===title);if(entry){const select=form.querySelector('[name=category]');if(Array.from(select.options).some(o=>o.value===entry.category))select.value=entry.category}}
document.addEventListener('click',e=>{const button=e.target.closest('button[data-action="reuse-finance"]');if(!button)return;const form=button.closest('form'),entry=state.finance.entries.find(x=>x.id===button.dataset.id);if(!entry||!form)return;form.querySelector('[name=title]').value=entry.title;suggestFinanceCategory(form);form.querySelector('[name=amount]').focus()});
document.addEventListener('change',e=>{const form=e.target.closest('form[data-form="entry"]');if(!form)return;if(e.target.name==='title')suggestFinanceCategory(form);if(e.target.name==='type'){const box=form.querySelector('#finance-suggestions');if(box)box.outerHTML=financeSuggestions(e.target.value,form.dataset.id)}});
</script></body></html>
