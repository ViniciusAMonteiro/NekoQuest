<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5067cc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>NekoQuest</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="neko-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="cat-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pixelify+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f4fb;
      --screen:#f7f4fb;
      --panel:#ffffff;
      --panel-soft:#f0edf8;
      --text:#1f2145;
      --muted:#6e7196;
      --line:#ebe8f4;
      --primary:#4a63cf;
      --primary-soft:#e9edff;
      --shadow:0 8px 24px rgba(48,43,93,.07);
      --safe-top: env(safe-area-inset-top,0px);
      --safe-bottom: env(safe-area-inset-bottom,0px);
      --font:'Nunito',system-ui,sans-serif;
      --brand:'Pixelify Sans','Nunito',sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--screen);color:var(--text);font-family:var(--font)}
    body{max-width:430px;margin:0 auto;position:relative}
    img{max-width:100%;display:block}
    button,input,select{font:inherit}
    button{border:0;background:none;color:inherit;cursor:pointer}
    .shell{min-height:100dvh;background:var(--screen)}
    .topbar{position:sticky;top:0;z-index:20;background:rgba(247,244,251,.97);backdrop-filter:blur(14px);padding:calc(12px + var(--safe-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .topbar.hidden{display:none}
    .topbar.home{padding-bottom:6px;background:transparent;backdrop-filter:none}
    .topbar .side{width:36px;display:flex;justify-content:center;align-items:center;flex-shrink:0}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand img{width:34px;height:34px;border-radius:12px;box-shadow:var(--shadow)}
    .brand-title{min-width:0}
    .brand-title h1{margin:0;font-family:var(--brand);font-size:24px;line-height:1;color:#2a2268}
    .brand-title p{margin:2px 0 0;font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .page-title{font-size:15px;font-weight:900;letter-spacing:-.02em}
    .icon-circle{width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);border:1px solid var(--line)}
    .icon-circle svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
    main{padding:0 16px calc(98px + var(--safe-bottom))}
    body.home-page main{padding-top:0}
    .stack{display:grid;gap:12px}
    .hero{height:286px;border-radius:0 0 24px 24px;overflow:hidden;position:relative;margin:0 -16px 4px;background:#d8dff7}
    .hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(246,241,255,.80),rgba(246,241,255,.10) 72%)}
    .hero .cat{position:absolute;right:18px;top:70px;width:132px;height:132px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 10px 0 rgba(49,39,90,.08))}
    .hero-content{position:relative;z-index:1;height:100%;padding:22px 18px 14px;display:flex;flex-direction:column;justify-content:space-between}
    .hello h2{margin:0 0 4px;font-size:21px;line-height:1.1;letter-spacing:-.03em;color:#1f2651}
    .hello p{margin:0;max-width:154px;font-size:13px;line-height:1.35;color:#3f4c6c;font-weight:700}
    .quote{align-self:flex-end;max-width:165px;background:#fff7ee;padding:10px 12px;border-radius:16px;font-size:11px;line-height:1.25;font-weight:900;color:#505674;box-shadow:0 8px 18px rgba(71,63,117,.10);text-align:center}
    .card{background:var(--panel);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .section-head h3{margin:0;font-size:18px;line-height:1.2;letter-spacing:-.03em}
    .section-head small{font-size:12px;color:var(--muted);font-weight:800}
    .summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .summary-item{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;padding:10px;border-radius:14px;background:#fff}
    .summary-item:nth-child(1){background:#eef4ff}.summary-item:nth-child(2){background:#eef8f1}.summary-item:nth-child(3){background:#fff2e5}.summary-item:nth-child(4){background:#edf8ff}.summary-item:nth-child(5){background:#fff6e5}.summary-item:nth-child(6){background:#fff0f2}
    .summary-item img{width:36px;height:36px;border-radius:10px}
    .summary-item label{display:block;font-size:11px;font-weight:900;color:#1f2651}
    .summary-item strong{display:block;font-size:14px;line-height:1.15;margin-top:2px}
    .summary-item span{display:block;font-size:10px;line-height:1.1;color:var(--muted);margin-top:2px}
    .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .quick{background:#fff;border-radius:16px;padding:12px 8px;display:grid;justify-items:center;gap:7px;box-shadow:var(--shadow)}
    .quick:nth-child(1){background:#eef4ff}.quick:nth-child(2){background:#eef8f1}.quick:nth-child(3){background:#fff2e5}
    .quick img{width:46px;height:46px;border-radius:14px}
    .quick b{font-size:12px;line-height:1.1;text-align:center}
    .companion{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
    .companion img{width:74px;height:74px;object-fit:contain;image-rendering:pixelated}
    .subtle{font-size:12px;color:var(--muted);font-weight:800}
    .meter{margin-top:7px;height:9px;background:#eceaf6;border-radius:999px;overflow:hidden}
    .meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8d76ff,#5f7cf8)}
    .screen-title{padding:2px 0 0;text-align:center;display:grid;justify-items:center;gap:3px}
    .screen-title h1{margin:0;font-size:22px;line-height:1.18;letter-spacing:-.03em}
    .screen-title p{margin:0;max-width:270px;font-size:13px;line-height:1.35;color:var(--muted)}
    .areas-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .area{min-height:104px;border-radius:18px;padding:14px 10px;display:grid;place-items:center;text-align:center;gap:8px;box-shadow:var(--shadow)}
    .area img{width:56px;height:56px}
    .area b{font-size:13px;line-height:1.12}
    .area.tasks{background:#f5e3c8}.area.workouts{background:#c7eedf}.area.food{background:#f8ddb5}.area.hydration{background:#cfeafc}.area.finance{background:#f7df9f}.area.focus{background:#f5bec2}.area.progress{background:#bed8ff}.area.cats{background:#fde3d7}
    .page-hero{min-height:110px;border-radius:20px;padding:18px;position:relative;overflow:hidden;color:#1d264d}
    .page-hero h1{margin:0 0 5px;font-size:31px;line-height:1.02;letter-spacing:-.05em}
    .page-hero p{margin:0;max-width:145px;font-size:13px;line-height:1.3;font-weight:800;color:#53607b}
    .page-hero img{position:absolute;right:0;top:0;width:54%;height:100%;object-fit:cover}
    .week-strip,.pill-row{display:flex;gap:8px;overflow:auto;padding-bottom:2px;scrollbar-width:none}
    .week-strip::-webkit-scrollbar,.pill-row::-webkit-scrollbar{display:none}
    .daychip{min-width:54px;padding:10px 0;border-radius:14px;background:#efedf6;text-align:center;font-size:11px;line-height:1.2;font-weight:900;color:#5f6488}
    .daychip.active,.pill.active{background:var(--primary);color:#fff}
    .composer{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
    .composer span{font-size:13px;color:#8c90ab;font-weight:700}
    .fab{width:42px;height:42px;border-radius:14px;background:var(--primary);display:grid;place-items:center;color:#fff;box-shadow:0 10px 16px rgba(77,84,211,.28)}
    .fab svg{width:18px;height:18px;stroke:#fff;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .pill{padding:8px 14px;border-radius:999px;background:#efedf6;font-size:12px;font-weight:900;color:#606486}
    .task-list{display:grid;gap:2px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
    .task-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:14px 14px;border-bottom:1px solid #efedf6}
    .task-row:last-child{border-bottom:0}
    .radio{width:18px;height:18px;border-radius:999px;border:2px solid #6671a7;display:grid;place-items:center;font-size:12px;color:#fff}
    .radio.done{border-color:#44bb78;background:#44bb78}
    .task-main strong{display:block;font-size:14px;line-height:1.2}
    .task-main strong.done{text-decoration:line-through;color:#8187a3}
    .tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
    .mini-tag{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:900}
    .mini-tag.blue{background:#e9edff;color:#4a63cf}.mini-tag.green{background:#eaf7ee;color:#37915f}.mini-tag.sky{background:#e9f7ff;color:#2a88bd}.mini-tag.gold{background:#fff4dd;color:#ab7d00}.mini-tag.purple{background:#f0eaff;color:#7a52c9}
    .task-aside{display:grid;justify-items:end;gap:8px}
    .task-aside small{font-size:11px;color:#6c7193;font-weight:800}
    .task-aside .xp{font-size:10px;padding:4px 7px;border-radius:999px;background:#f1eff9;font-weight:900;color:#6c7193}
    .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#efedf6;border-radius:12px;padding:4px}
    .seg button{padding:8px 6px;border-radius:10px;font-size:12px;font-weight:900;color:#5f6488}
    .seg button.active{background:var(--primary);color:#fff}
    .chart-card{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .chart-card h4{margin:0 0 12px;font-size:16px;letter-spacing:-.03em}
    .bars{height:108px;background:#f1eff9;border-radius:14px;padding:12px 12px 8px;display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:10px}
    .bar-col{display:grid;justify-items:center;gap:7px}
    .bar{width:20px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,#9dd5ff,#5c79f7)}
    .bar.gold{background:linear-gradient(180deg,#ffe39a,#f4ca62)}
    .bar.gray{background:linear-gradient(180deg,#dfdfea,#c4c5d8)}
    .bar-col span{font-size:10px;color:#676d90;font-weight:900}
    .progress-list{display:grid;gap:10px;background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .progress-item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center}
    .progress-item img{width:36px;height:36px;border-radius:11px}
    .progress-item b{display:block;font-size:14px}
    .progress-item small{display:block;font-size:11px;color:#6b6f91;font-weight:800}
    .progress-item .line{margin-top:6px;height:8px;background:#eceaf6;border-radius:999px;overflow:hidden}
    .progress-item .line i{display:block;height:100%;border-radius:999px}
    .progress-item .num{font-size:12px;font-weight:900;color:#676d90}
    .cat-room{position:relative;overflow:hidden;border-radius:18px;background:#f3d4cf;height:186px;box-shadow:var(--shadow)}
    .cat-room .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .cat-room .showcase{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:152px;height:152px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 10px 8px rgba(43,33,79,.15))}
    .room-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:var(--shadow)}
    .room-arrow.left{left:10px}.room-arrow.right{right:10px;transform:translateY(-50%) rotate(180deg)}
    .room-arrow svg{width:18px;height:18px;stroke:#485070;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .cat-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .cat-mini{background:#efedf6;border-radius:12px;padding:8px;display:grid;place-items:center;border:2px solid transparent}
    .cat-mini.active{border-color:var(--primary);background:#e9edff}
    .cat-mini img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
    .cat-panel{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .cat-panel img{width:68px;height:68px;object-fit:contain;image-rendering:pixelated}
    .cta{width:100%;margin-top:12px;padding:13px 18px;border-radius:14px;background:#2f439d;color:#fff;font-weight:900;text-align:center}
    .settings{display:grid;gap:10px}
    .setting-row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--shadow)}
    .setting-row img{width:42px;height:42px;border-radius:12px}
    .toggle{width:46px;height:28px;border-radius:999px;background:#d8d6ea;position:relative}
    .toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(29,26,61,.15);transition:.2s}
    .toggle.on{background:var(--primary)}
    .toggle.on i{transform:translateX(18px)}
    .footer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);max-width:430px;width:100%;padding:8px 12px calc(10px + var(--safe-bottom));background:linear-gradient(180deg,rgba(247,244,251,.9),rgba(247,244,251,.98));backdrop-filter:blur(14px)}
    .footer-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border-radius:20px;padding:7px;box-shadow:var(--shadow)}
    .nav{display:grid;justify-items:center;gap:4px;padding:7px 4px 8px;border-radius:14px;color:#65698b;font-size:11px;font-weight:900}
    .nav svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .nav.active{color:var(--primary)}
    .nav.active::before{content:"";width:24px;height:3px;background:currentColor;border-radius:999px;margin-bottom:1px}
    .dialog{border:0;padding:0;background:transparent;width:min(390px,calc(100% - 24px))}
    .dialog::backdrop{background:rgba(24,20,42,.36);backdrop-filter:blur(3px)}
    .modal{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .modal-head h3{margin:0;font-size:20px}
    .grid{display:grid;gap:12px}
    .field{display:grid;gap:5px}
    .field label{font-size:12px;font-weight:900;color:var(--muted)}
    .field input,.field select{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text)}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    .ghost{padding:12px 14px;border-radius:14px;background:#efedf6;font-weight:900;color:#666b8e}
    .primary{padding:12px 14px;border-radius:14px;background:var(--primary);color:#fff;font-weight:900}
    .hidden{display:none!important}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#2f3154;color:#fff;padding:12px 14px;border-radius:14px;font-size:12px;font-weight:900;box-shadow:0 10px 20px rgba(20,18,34,.22);z-index:50}

    .splash{position:fixed;inset:0;z-index:80;background:linear-gradient(180deg,#5242c8 0%,#253572 100%);display:grid;place-items:center;padding:30px 24px;transition:opacity .35s ease, visibility .35s ease}
    .splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .splash-inner{display:grid;justify-items:center;gap:14px;text-align:center;color:#fff}
    .splash-logo{width:132px;height:132px;border-radius:28px;box-shadow:0 18px 32px rgba(0,0,0,.18)}
    .splash-title{font-family:var(--brand);font-size:52px;line-height:1;color:#fff;letter-spacing:.01em}
    .splash-sub{font-size:17px;line-height:1.35;font-weight:800;color:#f0ecff;max-width:260px}
    .splash-stars{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 14%, rgba(255,240,180,.95) 0 1px, transparent 2px), radial-gradient(circle at 84% 24%, rgba(255,240,180,.95) 0 1.5px, transparent 2.5px), radial-gradient(circle at 30% 70%, rgba(255,240,180,.9) 0 1px, transparent 2px), radial-gradient(circle at 65% 10%, rgba(255,240,180,.95) 0 1px, transparent 2px), radial-gradient(circle at 74% 78%, rgba(255,240,180,.95) 0 1px, transparent 2px)}
    body.dark{--screen:#18182b;--panel:#292942;--text:#f4f3ff;--muted:#c2c1de;--shadow:0 8px 24px rgba(0,0,0,.15)}
    body.dark .card,body.dark .chart-card,body.dark .task-list,body.dark .progress-list,body.dark .cat-panel,body.dark .setting-row,body.dark .footer-inner{background:var(--panel)}
    body.dark .topbar,body.dark .footer{background:rgba(24,24,43,.96)}
    body.dark .screen-title h1,body.dark .section-head h3,body.dark .task-main strong,body.dark .progress-item b{color:var(--text)}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7199ff;outline-offset:2px}
    @media(max-width:360px){.summary-item{padding:7px;gap:5px;grid-template-columns:32px 1fr}.summary-item img{width:32px;height:32px}.summary-item strong{font-size:12px}.areas-grid{gap:9px}.area{padding:10px 7px}}
  </style>
</head>
<body>
  <div class="splash" id="splash"><div class="splash-stars"></div><div class="splash-inner"><img class="splash-logo" src="cat-192.png" alt="NekoQuest"><div class="splash-title">NekoQuest</div><div class="splash-sub">Pequenas tarefas, grandes conquistas.</div></div></div>
  <div class="shell">
    <header class="topbar home" id="topbar"></header>
    <main id="app"></main>
    <nav class="footer" id="footer"></nav>
  </div>
  <dialog class="dialog" id="modal"></dialog>
  <div class="toast hidden" id="toast"></div>
  <script>
  (() => {
    'use strict';
    const STORAGE_KEY = 'nekoquest_v4';
    const CATS = {
      luna:{name:'Luna', mood:'Meiga', asset:'assets/concept/cat-luna.png'},
      nori:{name:'Nori', mood:'Calmo', asset:'assets/concept/cat-nori.png'},
      mikan:{name:'Mikan', mood:'Curiosa', asset:'assets/concept/cat-mikan.png'},
      mochi:{name:'Mochi', mood:'Fofo', asset:'assets/concept/cat-mochi.png'},
      yuki:{name:'Yuki', mood:'Leve', asset:'assets/concept/cat-yuki.png'},
      sora:{name:'Sora', mood:'Aventureiro', asset:'assets/concept/cat-sora.png'}
    };
    const AREAS = [
      {key:'tasks',label:'Tarefas',icon:'assets/concept/tasks.png',cls:'tasks'},
      {key:'workouts',label:'Treino',icon:'assets/concept/workouts.png',cls:'workouts'},
      {key:'food',label:'Alimentação',icon:'assets/concept/food.png',cls:'food'},
      {key:'hydration',label:'Hidratação',icon:'assets/concept/hydration.png',cls:'hydration'},
      {key:'finance',label:'Finanças',icon:'assets/concept/finance.png',cls:'finance'},
      {key:'focus',label:'Sem Fumo',icon:'assets/concept/focus.png',cls:'focus'},
      {key:'progress',label:'Progresso',icon:'assets/concept/progress.png',cls:'progress'},
      {key:'cats',label:'Meus Gatos',icon:'assets/concept/cats.png',cls:'cats'}
    ];
    const ROOT = new Set(['home','areas','profile']);
    const labels = {home:'Início',areas:'Áreas',profile:'Perfil',tasks:'Tarefas',progress:'Progresso',cats:'Meus Gatos',workouts:'Treino',food:'Alimentação',hydration:'Hidratação',finance:'Finanças',focus:'Sem Fumo'};
    const app = document.getElementById('app');
    const topbar = document.getElementById('topbar');
    const footer = document.getElementById('footer');
    const modal = document.getElementById('modal');
    const toastEl = document.getElementById('toast');
    let page = 'home';
    let taskFilter='all';
    let progressRange='week';
    let selectedDay = todayISO();
    let toastTimer;

    const defaultState = () => ({
      name:'Vinicius',
      theme:'light',
      cat:'luna',
      tasks:[
        {id:id(),title:'Estudar ADS',category:'Estudos',date:todayISO(),done:false,xp:12},
        {id:id(),title:'Treino de musculação',category:'Treino',date:todayISO(),done:true,xp:16},
        {id:id(),title:'Beber água (500ml)',category:'Hidratação',date:todayISO(),done:false,xp:8},
        {id:id(),title:'Organizar finanças',category:'Finanças',date:todayISO(),done:false,xp:10},
        {id:id(),title:'Ler 20 minutos',category:'Leitura',date:todayISO(),done:true,xp:6}
      ],
      workouts:[{id:id(),title:'Treino de musculação',date:todayISO(),done:true}],
      meals:{[todayISO()]:{breakfast:true,lunch:false,snack:false,dinner:false}},
      hydration:{goal:1400, logs:[{id:id(),at:Date.now()-5000000,amount:700},{id:id(),at:Date.now()-2200000,amount:500}]},
      finance:[{id:id(),title:'Mercado',type:'expense',amount:2490,date:todayISO()},{id:id(),title:'Freela',type:'income',amount:180000,date:todayISO()}],
      smoking:{start:todayISO(), relapses:[]},
      companions:{luna:{level:12,xp:320},nori:{level:7,xp:150},mikan:{level:8,xp:190},mochi:{level:6,xp:120},yuki:{level:5,xp:90},sora:{level:9,xp:245}}
    });
    function id(){ return Math.random().toString(36).slice(2,10); }
    function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
    function human(date){ return new Date(date+'T12:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short'}); }
    function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
    function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
    function fmtMoney(cents){ return (Number(cents||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
    let state;
    try{ state = Object.assign(defaultState(), JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')); }catch{ state = defaultState(); }
    if(!state.companions) state.companions = defaultState().companions;
    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function toast(msg){ toastEl.textContent=msg; toastEl.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),2300); }
    function icon(name){ const p={back:'M15 18 9 12l6-6',home:'M3 11 12 4l9 7M7 10v10h10V10',grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',user:'M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm-7 8a7 7 0 0 1 14 0',plus:'M12 5v14M5 12h14',edit:'m5 19 4-1 9-9-3-3-9 9-1 4',close:'M6 6l12 12M18 6 6 18'}; return `<svg viewBox="0 0 24 24"><path d="${p[name]||p.home}"></path></svg>`; }
    function topBar(){
      document.body.classList.toggle('home-page', page==='home');
      if(page==='home'){
        topbar.className = 'topbar hidden';
        topbar.innerHTML = '';
      } else if(page==='areas' || page==='profile'){
        topbar.className = 'topbar';
        topbar.innerHTML = `<div class="side"></div><div class="page-title">${labels[page]||''}</div><div class="side">${page==='profile'?`<button class="icon-circle" data-action="edit-profile">${icon('edit')}</button>`:''}</div>`;
      } else {
        topbar.className = 'topbar';
        topbar.innerHTML = `<div class="side"><button class="icon-circle" data-action="go" data-page="areas">${icon('back')}</button></div><div class="page-title">${labels[page]||''}</div><div class="side"></div>`;
      }
    }
    function footerNav(){
      const items=[['home','Início','home'],['areas','Áreas','grid'],['profile','Perfil','user']];
      footer.innerHTML = `<div class="footer-inner">${items.map(([k,l,ic])=>`<button class="nav ${page===k?'active':''}" data-action="go" data-page="${k}">${icon(ic)}<span>${l}</span></button>`).join('')}</div>`;
    }
    function hydrationTotal(day=todayISO()){ return state.hydration.logs.filter(l=>new Date(l.at).toISOString().slice(0,10)===day).reduce((a,l)=>a+Number(l.amount||0),0); }
    function mealsCount(day=todayISO()){ const m=(state.meals&&state.meals[day])||{breakfast:false,lunch:false,snack:false,dinner:false}; return Object.values(m).filter(Boolean).length; }
    function smokingDays(){ const rel = (state.smoking.relapses||[]).slice().sort(); const start = rel.length ? rel[rel.length-1] : state.smoking.start; return Math.max(1, Math.round((new Date(todayISO())-new Date(start))/86400000)+1); }
    function week(){ const base=new Date(selectedDay+'T12:00'); return Array.from({length:5},(_,i)=>{ const d=new Date(base); d.setDate(base.getDate()-2+i); const iso=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); return {iso,label:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''),day:d.getDate()}; }); }
    function summaryData(){
      const today= todayISO();
      const todayTasks=state.tasks.filter(t=>t.date===today);
      const doneToday=todayTasks.filter(t=>t.done).length;
      return [
        {icon:'assets/concept/tasks.png',label:'Tarefas',main:`${doneToday} / ${Math.max(todayTasks.length,1)}`,sub:''},
        {icon:'assets/concept/workouts.png',label:'Treino',main:state.workouts.some(w=>w.date===today&&w.done)?'Concluído':'Pendente',sub:''},
        {icon:'assets/concept/food.png',label:'Alimentação',main:`${mealsCount(today)} / 3`,sub:''},
        {icon:'assets/concept/hydration.png',label:'Hidratação',main:`${(hydrationTotal(today)/1000).toFixed(1).replace('.',',')} L`,sub:''},
        {icon:'assets/concept/finance.png',label:'Finanças',main:state.finance.length+' lançamentos',sub:''},
        {icon:'assets/concept/focus.png',label:'Sem Fumo',main:smokingDays()+' dias',sub:''},
      ];
    }
    function homeView(){
      const cat = CATS[state.cat]; const companion=state.companions[state.cat]||{level:1,xp:0};
      return `
      <div class="stack">
        <section class="hero">
          <img class="bg" src="assets/concept/day-scene.png" alt="Cenário">
          <img class="cat" src="${cat.asset}" alt="${cat.name}">
          <div class="hero-content">
            <div class="hello"><h2>Olá, ${esc(state.name)}! 🐱</h2><p>Hoje é um ótimo dia para cuidar de você.</p></div>
            <div class="quote">“Disciplina hoje,<br>liberdade amanhã.”</div>
          </div>
        </section>
        <section class="card">
          <div class="section-head"><h3>Seu resumo de hoje</h3></div>
          <div class="summary">${summaryData().map(x=>`<div class="summary-item"><img src="${x.icon}" alt="${x.label}"><div><label>${x.label}</label><strong>${x.main}</strong>${x.sub?`<span>${x.sub}</span>`:''}</div></div>`).join('')}</div>
        </section>
        <section class="card">
          <div class="section-head"><h3>Atalhos</h3><small>Rápido</small></div>
          <div class="quick-grid">${AREAS.slice(0,3).map(a=>`<button class="quick" data-action="go" data-page="${a.key}"><img src="${a.icon}" alt="${a.label}"><b>${a.label}</b></button>`).join('')}</div>
          <div style="height:14px"></div>
          <div class="companion"><img src="${cat.asset}" alt="${cat.name}"><div><strong>${cat.name}</strong><div class="subtle">Nível ${companion.level}</div><div class="meter"><i style="width:${Math.min(100,(companion.xp%500)/5)}%"></i></div></div></div>
        </section>
      </div>`;
    }
    function areasView(){ return `<div class="stack"><section class="screen-title"><h1>Áreas</h1><p>Escolha uma área para gerenciar e ver seu progresso.</p></section><section class="areas-grid">${AREAS.map(a=>`<button class="area ${a.cls}" data-action="go" data-page="${a.key}"><img src="${a.icon}" alt="${a.label}"><b>${a.label}</b></button>`).join('')}</section></div>`; }
    function taskTag(cat){ const c=cat.toLowerCase(); if(c.includes('treino')) return 'green'; if(c.includes('hidra')) return 'sky'; if(c.includes('finan')) return 'gold'; if(c.includes('leit')) return 'purple'; return 'blue'; }
    function taskList(){
      let list=[...state.tasks];
      if(taskFilter==='today') list=list.filter(t=>t.date===selectedDay); if(taskFilter==='done') list=list.filter(t=>t.done);
      list.sort((a,b)=>a.done-b.done);
      return `<div class="task-list">${list.map(t=>`<div class="task-row"><button class="radio ${t.done?'done':''}" data-action="toggle-task" data-id="${t.id}">${t.done?'✓':''}</button><button class="task-main" data-action="toggle-task" data-id="${t.id}" style="text-align:left"><strong class="${t.done?'done':''}">${esc(t.title)}</strong><div class="tagline"><span class="mini-tag ${taskTag(t.category)}">${esc(t.category)}</span></div></button><div class="task-aside"><small>${t.date===todayISO()?'Hoje':human(t.date)}</small><span class="xp">${t.xp} XP</span></div></div>`).join('')}</div>`;
    }
    function tasksView(){ return `<div class="stack"><div class="week-strip">${week().map(d=>`<button class="daychip ${selectedDay===d.iso?'active':''}" data-action="select-day" data-day="${d.iso}">${d.label}<br>${d.day}</button>`).join('')}</div><div class="composer"><span>Adicionar nova tarefa...</span><button class="fab" data-action="open-task">${icon('plus')}</button></div><div class="pill-row">${[['all','Todas'],['today','Hoje'],['done','Concluídas']].map(([k,l])=>`<button class="pill ${taskFilter===k?'active':''}" data-action="task-filter" data-filter="${k}">${l}</button>`).join('')}</div>${taskList()}</div>`; }
    function progressData(){
      const tp = state.tasks.length ? Math.round(state.tasks.filter(t=>t.done).length / state.tasks.length * 100) : 0;
      const wp = state.workouts.length ? Math.round(state.workouts.filter(w=>w.done).length / state.workouts.length * 100) : 0;
      const fp = Math.round(mealsCount()/4*100);
      const hp = Math.min(100, Math.round(hydrationTotal()/state.hydration.goal*100));
      return [
        {icon:'assets/concept/tasks.png',label:'Tarefas',count:`${state.tasks.filter(t=>t.done).length} / ${state.tasks.length}`,pct:tp,color:'#35c37d'},
        {icon:'assets/concept/workouts.png',label:'Treino',count:`${state.workouts.filter(w=>w.done).length} / ${state.workouts.length}`,pct:wp,color:'#8f6bff'},
        {icon:'assets/concept/food.png',label:'Alimentação',count:`${mealsCount()} / 4`,pct:fp,color:'#f59444'},
        {icon:'assets/concept/hydration.png',label:'Hidratação',count:`${(hydrationTotal()/1000).toFixed(1).replace('.',',')} / ${(state.hydration.goal/1000).toFixed(1).replace('.',',')} L`,pct:hp,color:'#2793f0'},
      ];
    }
    function progressView(){
      const monday=new Date(todayISO()+'T12:00'); monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
      const bars=Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const tasks=state.tasks.filter(t=>t.date===key);return tasks.length?Math.max(5,Math.round(tasks.filter(t=>t.done).length/tasks.length*100)):4;});
      const days=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
      return `<div class="stack"><section class="card"><div class="seg">${[['week','Semana'],['month','Mês'],['year','Ano']].map(([k,l])=>`<button class="${progressRange===k?'active':''}" data-action="progress-range" data-range="${k}">${l}</button>`).join('')}</div></section><section class="chart-card"><h4>Visão geral da ${progressRange==='week'?'semana':progressRange==='month'?'semana atual':'semana atual'}</h4><div class="bars">${bars.map((h,i)=>`<div class="bar-col"><div class="bar ${i===0||i===5?'gold':''} ${i===3||i===4?'gray':''}" style="height:${h}%"></div><span>${days[i]}</span></div>`).join('')}</div></section><section class="progress-list">${progressData().map(p=>`<div class="progress-item"><img src="${p.icon}" alt="${p.label}"><div><b>${p.label}</b><small>${p.count}</small><div class="line"><i style="width:${p.pct}%;background:${p.color}"></i></div></div><div class="num">${p.pct}%</div></div>`).join('')}</section></div>`;
    }
    function catsView(){
      const keys=Object.keys(CATS); const idx=keys.indexOf(state.cat); const active=CATS[state.cat]; const data=state.companions[state.cat]||{level:1,xp:0};
      const featured=keys.slice(0,4);
      return `<div class="stack"><section class="screen-title"><h1>Meus Gatos</h1><p>Escolha seu companheiro de jornada.</p></section><section class="cat-room"><img class="bg" src="assets/scenes/room-pixel.png" alt="Cenário"><button class="room-arrow left" data-action="cycle-cat" data-dir="-1">${icon('back')}</button><button class="room-arrow right" data-action="cycle-cat" data-dir="1">${icon('back')}</button><img class="showcase" src="${active.asset}" alt="${active.name}"></section><section class="cat-mini-grid">${featured.map(key=>`<button class="cat-mini ${state.cat===key?'active':''}" data-action="pick-cat" data-cat="${key}"><img src="${CATS[key].asset}" alt="${CATS[key].name}"></button>`).join('')}</section><section class="cat-panel"><img src="${active.asset}" alt="${active.name}"><div><strong>${active.name}</strong><div class="subtle">Nível ${data.level}</div><div class="meter"><i style="width:${Math.min(100,data.xp/5)}%"></i></div><div class="subtle" style="margin-top:5px">${data.xp} / 500 XP</div></div></section><button class="cta" data-action="pick-cat" data-cat="${state.cat}">Selecionar</button></div>`;
    }
    function profileView(){
      const cat=CATS[state.cat];
      return `<div class="stack"><section class="card"><div class="companion"><img src="${cat.asset}" alt="${cat.name}"><div><strong>${esc(state.name)}</strong><div class="subtle">Companheiro atual: ${cat.name}</div></div></div></section><section class="screen-title"><h1>Perfil</h1><p>Configurações essenciais do aplicativo.</p></section><section class="settings">${[
        ['assets/concept/theme.png','Tema escuro','Aparência do aplicativo','toggle-theme',state.theme==='dark'],
        ['assets/concept/cats.png','Meus Gatos','Escolher companheiro','go-cats',false],
        ['assets/concept/progress.png','Progresso','Ver conquistas','go-progress',false],
        ['assets/concept/edit.png','Editar perfil','Alterar nome', 'edit-profile', false]
      ].map(item=>`<button class="setting-row" ${item[3]?`data-action="${item[3]}"`:''}><img src="${item[0]}" alt=""><div><strong>${item[1]}</strong><div class="subtle">${item[2]}</div></div>${item[3]==='toggle-theme'?`<span class="toggle ${item[4]?'on':''}"><i></i></span>`:`<span class="subtle">Abrir</span>`}</button>`).join('')}</section></div>`;
    }
    function render(){ topBar(); footerNav(); app.innerHTML = ({home:homeView,areas:areasView,tasks:tasksView,progress:progressView,cats:catsView,profile:profileView,workouts:()=>genericView('Treino','assets/concept/workouts.png','Acompanhe sua rotina de treinos.'),food:()=>foodView(),hydration:()=>hydrationView(),finance:()=>financeView(),focus:()=>focusView()})[page](); }
    function genericView(title, icon, desc){ return `<div class="stack"><section class="page-hero" style="background:linear-gradient(135deg,#dce1ff,#c8d0ff)"><img src="${icon}" alt=""><h1>${title}</h1><p>${desc}</p></section><section class="card"><div class="section-head"><h3>Seus treinos</h3><button class="icon-circle" data-action="new-workout" aria-label="Adicionar treino">${iconSvgPlus()}</button></div>${state.workouts.map(w=>`<div class="task-row"><button class="radio ${w.done?'done':''}" data-action="toggle-workout" data-id="${w.id}">${w.done?'✓':''}</button><div class="task-main"><strong>${esc(w.title)}</strong><div class="subtle">${human(w.date)}</div></div></div>`).join('')||'<p class="subtle">Nenhum treino cadastrado.</p>'}</section></div>`; }
    function iconSvgPlus(){return icon('plus');}
    function foodView(){ const d=todayISO(); const meals=state.meals[d]||{breakfast:false,lunch:false,snack:false,dinner:false}; const labels={breakfast:'Café da manhã',lunch:'Almoço',snack:'Lanche',dinner:'Jantar'}; return `<div class="stack"><section class="page-hero" style="background:linear-gradient(135deg,#ffe9ba,#ffd08a)"><img src="assets/concept/food.png" alt=""><h1>Alimentação</h1><p>Marque suas refeições principais.</p></section><section class="areas-grid">${Object.entries(labels).map(([k,v])=>`<button class="area food" data-action="toggle-meal" data-meal="${k}" style="min-height:88px"><img src="assets/concept/food.png" alt=""><b>${v}</b><small class="subtle">${meals[k]?'Feito':'Pendente'}</small></button>`).join('')}</section></div>`; }
    function hydrationView(){ const total=hydrationTotal(); const pct=Math.min(100,Math.round(total/state.hydration.goal*100)); return `<div class="stack"><section class="page-hero" style="background:linear-gradient(135deg,#dff4ff,#bfe5ff)"><img src="assets/concept/hydration.png" alt=""><h1>Hidratação</h1><p>Beba água e cuide da sua saúde.</p></section><section class="card"><div class="section-head"><h3>Hoje</h3><small>${total} / ${state.hydration.goal} mL</small></div><div class="meter"><i style="width:${pct}%"></i></div><div style="height:14px"></div><div class="quick-grid">${[250,500,750].map(v=>`<button class="quick" data-action="add-water" data-amount="${v}"><img src="assets/concept/hydration.png" alt=""><b>+ ${v} mL</b></button>`).join('')}</div></section></div>`; }
    function financeView(){ return `<div class="stack"><section class="page-hero" style="background:linear-gradient(135deg,#d7f3df,#b4e9cb)"><img src="assets/concept/finance.png" alt=""><h1>Finanças</h1><p>Acompanhe seus gastos e metas.</p></section><section class="card"><div class="section-head"><h3>Lançamentos</h3><button class="icon-circle" data-action="open-finance">${icon('plus')}</button></div>${state.finance.map(e=>`<div class="task-row" style="padding-left:0;padding-right:0"><div class="radio done">${e.type==='income'?'↓':'↑'}</div><div class="task-main"><strong>${esc(e.title)}</strong><div class="tagline"><span class="mini-tag ${e.type==='income'?'green':'gold'}">${e.type==='income'?'Receita':'Despesa'}</span></div></div><div class="task-aside"><small>${human(e.date)}</small><span class="xp">${fmtMoney(e.amount)}</span></div></div>`).join('')}</section></div>`; }
    function focusView(){ return `<div class="stack"><section class="page-hero" style="background:linear-gradient(135deg,#ffe0e5,#ffc4ca)"><img src="assets/concept/focus.png" alt=""><h1>Sem Fumo</h1><p>Um passo de cada vez para manter o foco.</p></section><section class="card"><div class="section-head"><h3>Sequência atual</h3><small>${smokingDays()} dias</small></div><div class="meter"><i style="width:${Math.min(100,smokingDays()*8)}%"></i></div><div style="height:14px"></div><div class="quick-grid"><button class="quick" data-action="confirm-focus"><img src="assets/concept/focus.png" alt=""><b>Mantive firme</b></button><button class="quick" data-action="relapse"><img src="assets/concept/focus.png" alt=""><b>Registrar recaída</b></button><button class="quick" data-action="go" data-page="progress"><img src="assets/concept/progress.png" alt=""><b>Ver progresso</b></button></div></section></div>`; }
    function openModal(title, fields, action){ modal.innerHTML = `<form method="dialog" class="modal" data-submit="${action}"><div class="modal-head"><h3>${title}</h3><button class="icon-circle" value="cancel">${icon('close')}</button></div>${fields}<div class="modal-actions"><button class="ghost" value="cancel">Cancelar</button><button class="primary" value="default">Salvar</button></div></form>`; modal.showModal(); }
    document.addEventListener('click', e=>{
      const btn=e.target.closest('[data-action]'); if(!btn) return; const a=btn.dataset.action;
      if(a==='go' || a==='go-cats' || a==='go-progress'){ page=a==='go'?btn.dataset.page:(a==='go-cats'?'cats':'progress'); render(); window.scrollTo({top:0}); return; }
      if(a==='select-day'){ selectedDay=btn.dataset.day; render(); return; }
      if(a==='task-filter'){ taskFilter=btn.dataset.filter; render(); return; }
      if(a==='progress-range'){ progressRange=btn.dataset.range; render(); return; }
      if(a==='new-workout'){ openModal('Novo treino', '<div class="grid"><div class="field"><label>Nome</label><input name="title" required placeholder="Ex.: Treino A"></div><div class="field"><label>Data</label><input name="date" type="date" value="'+todayISO()+'"></div></div>', 'workout'); return; }
      if(a==='toggle-workout'){const w=state.workouts.find(x=>x.id===btn.dataset.id);if(w){w.done=!w.done;save();render();}return;}
      if(a==='toggle-task'){ const t=state.tasks.find(x=>x.id===btn.dataset.id); if(!t) return; t.done=!t.done; state.companions[state.cat].xp+= t.done ? t.xp : -t.xp; save(); render(); return; }
      if(a==='open-task'){ openModal('Nova tarefa', `<div class="grid"><div class="field"><label>Título</label><input name="title" required placeholder="Ex.: Ler 20 minutos"></div><div class="split"><div class="field"><label>Categoria</label><select name="category"><option>Estudos</option><option>Treino</option><option>Hidratação</option><option>Finanças</option><option>Leitura</option></select></div><div class="field"><label>Data</label><input type="date" name="date" value="${selectedDay}"></div></div></div>`, 'task'); return; }
      if(a==='open-finance'){ openModal('Novo lançamento', `<div class="grid"><div class="field"><label>Descrição</label><input name="title" required></div><div class="split"><div class="field"><label>Tipo</label><select name="type"><option value="expense">Despesa</option><option value="income">Receita</option></select></div><div class="field"><label>Valor (R$)</label><input type="number" step="0.01" name="amount" required></div></div><div class="field"><label>Data</label><input type="date" name="date" value="${todayISO()}"></div></div>`, 'finance'); return; }
      if(a==='edit-profile'){ openModal('Editar perfil', `<div class="grid"><div class="field"><label>Nome</label><input name="name" value="${esc(state.name)}" required></div></div>`, 'profile'); return; }
      if(a==='pick-cat'){ state.cat=btn.dataset.cat; save(); render(); toast('Companheiro atualizado.'); return; }
      if(a==='cycle-cat'){ const keys=Object.keys(CATS); const idx=keys.indexOf(state.cat); const dir=Number(btn.dataset.dir||1); state.cat = keys[(idx+dir+keys.length)%keys.length]; save(); render(); return; }
      if(a==='toggle-theme'){ document.body.classList.toggle('dark'); state.theme=document.body.classList.contains('dark')?'dark':'light'; save(); render(); return; }
      if(a==='toggle-meal'){ const d=todayISO(); state.meals[d] ||= {breakfast:false,lunch:false,snack:false,dinner:false}; state.meals[d][btn.dataset.meal]=!state.meals[d][btn.dataset.meal]; save(); render(); return; }
      if(a==='add-water'){ state.hydration.logs.push({id:id(),at:Date.now(),amount:Number(btn.dataset.amount||0)}); save(); render(); return; }
      if(a==='relapse'){ state.smoking.relapses.push(todayISO()); save(); render(); return; }
      if(a==='confirm-focus'){ toast('Boa! Mais um dia firme.'); return; }
    });
    modal.addEventListener('close', ()=>{ const form=modal.querySelector('form'); if(!form || modal.returnValue==='cancel') return; const data=Object.fromEntries(new FormData(form).entries()); const submit=form.dataset.submit; if(submit==='task'){ state.tasks.push({id:id(),title:String(data.title),category:String(data.category),date:data.date||todayISO(),done:false,xp:10}); page='tasks'; save(); render(); } if(submit==='workout'){ state.workouts.push({id:id(),title:String(data.title||'Treino'),date:data.date||todayISO(),done:false});page='workouts';save();render(); } if(submit==='finance'){ state.finance.unshift({id:id(),title:String(data.title),type:data.type==='income'?'income':'expense',amount:Math.round(Number(data.amount||0)*100),date:data.date||todayISO()}); page='finance'; save(); render(); } if(submit==='profile'){ state.name=String(data.name||state.name); save(); render(); } });
    if(state.theme==='dark') document.body.classList.add('dark');
    if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{})); }
    const splash=document.getElementById('splash');
    setTimeout(()=>splash.classList.add('hidden'), 1500);
    splash.addEventListener('click', ()=>splash.classList.add('hidden'));
    render();
  })();
  </script>
</body>
</html>
