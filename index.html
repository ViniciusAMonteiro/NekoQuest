idth:100%;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;font-size:16px}input[type=color]{height:48px}dialog{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:20px;width:calc(100% - 28px);max-width:440px;max-height:90dvh;padding:22px}dialog::backdrop{background:#000a}.wide{width:100%;margin-top:18px}.reward .cat{width:48px;height:48px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:10;max-width:90%;text-align:center}a{color:var(--accent)}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><header><strong><img class="brandcat" src="cat.svg" alt="Gatinho pixel art">NekoQuest</strong><button id="topProfile" aria-label="Abrir perfil">☷</button></header><main id="app"></main><nav id="nav"></nav><dialog id="modal"></dialog><div id="toast" role="status" hidden></div><script>
const $=s=>document.querySelector(s),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem('nekoquest_v3'))}catch{}if(!state){let old=[];try{old=JSON.parse(localStorage.getItem('neko_tasks_v1')||'[]')}catch{}state={name:'Aventureiro',theme:'dark',color:'#9970ff',tasks:old.map(t=>({...t,id:String(t.id),title:t.title||'Missão',done:!!(t.completed||t.done),xp:Number(t.xp)||10,date:t.date||today(),minutes:25})),coins:0,rewards:[{id:uid(),title:'Jogar por 30 minutos',cost:30},{id:uid(),title:'Assistir a um episódio',cost:25},{id:uid(),title:'Tomar um café especial',cost:20}],history:[],sessions:[],timer:{mode:'focus',remaining:1500,end:null},focus:25,break:5}}let page='home',filter='pending',month=new Date(),day=today();

function go(p){page=p;render();window.scrollTo(0,0)}function tasklist(ts){return ts.length?ts.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" data-toggle="${esc(t.id)}" aria-label="${t.done?'Reabrir':'Concluir'} ${esc(t.title)}">${t.done?'✓':'□'}</button><div class="copy">${esc(t.title)}<small>${esc(t.category||'Pessoal')} · ${t.minutes||25} min · ${t.xp} XP</small></div><button class="edit" data-edit="${esc(t.id)}" aria-label="Editar missão">✎</button></div>`).join(''):'<div class="empty">Nenhuma missão aqui.<br>Um pequeno passo já faz diferença.</div>'}

if(page==='calendar'){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();html=`<h1>Calendário</h1><div class="row"><button data-month="-1" aria-label="Mês anterior">‹</button><b>${month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button data-month="1" aria-label="Próximo mês">›</button></div><div class="calendar">${['D','S','T','Q','Q','S','S'].map(s=>`<small>${s}</small>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:count},(_,i)=>{let date=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button data-day="${date}" class="${date===day?'selected':''} ${state.tasks.some(t=>t.date===date)?'marked':''}">${i+1}</button>`}).join('')}</div><h2>${new Date(day+'T12:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}</h2>${tasklist(state.tasks.filter(t=>t.date===day))}<button class="primary wide" data-newtask>＋ Nova missão</button>`}
if(page==='pomodoro'){html=`<h1>Pomodoro</h1><div class="center">${cat()}<p class="muted">Uma missão de cada vez.</p></div><div class="timer"><span id="clock"></span><small>${state.timer.mode==='focus'?'FOCO':'PAUSA'}</small></div><div class="row"><button data-reset>↺ Reiniciar</button><button class="primary" data-timer>${state.timer.end?'Pausar':'Começar'}</button><button data-mode>${state.timer.mode==='focus'?'Pausa':'Foco'}</button></div><div class="card"><label for="focusTask">Missão atual</label><select id="focusTask"><option value="">Foco livre</option>${state.tasks.filter(t=>!t.done).map(t=>`<option value="${esc(t.id)}" ${state.focusTask===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select><div class="grid"><div><label for="focusMin">Foco (min)</label><input id="focusMin" type="number" min="1" max="180" value="${state.focus}"></div><div><label for="breakMin">Pausa (min)</label><input id="breakMin" type="number" min="1" max="60" value="${state.break}"></div></div><button class="wide" data-duration>Salvar duração</button></div><p class="center muted">${state.sessions.length} sessões concluídas</p>`}
if(page==='rewards'){html=`<div class="row"><h1>Recompensas</h1><b>◈ ${state.coins}</b></div><div class="center">${cat()}<p class="muted">Conclua missões. Reserve tempo para você.</p></div>${state.rewards.map(r=>`<div class="card reward"><div class="row"><b>${esc(r.title)}</b><button class="edit" data-rewardedit="${r.id}" aria-label="Editar recompensa">✎</button></div><div class="row"><small>◈ ${r.cost} moedas</small><button data-redeem="${r.id}" ${state.coins<r.cost?'disabled':''}>Resgatar</button></div></div>`).join('')}<button class="primary wide" data-newreward>＋ Nova recompensa</button><h2>Já resgatadas</h2>${state.history.filter(h=>h.type==='reward').map(h=>`<div class="card">${esc(h.title)}<small> · ${new Date(h.at).toLocaleDateString('pt-BR')}</small></div>`).join('')||'<p class="muted">Suas conquistas aparecerão aqui.</p>'}`}
if(page==='history'){html=`<h1>Histórico</h1><p class="muted">Cada pequeno passo conta.</p>${[...state.history,...state.sessions.map(s=>({...s,type:'focus',title:s.title||'Sessão de foco'}))].sort((a,b)=>b.at-a.at).map(h=>`<div class="card row"><div>${h.type==='task'?'✓':h.type==='reward'?'♧':'◷'} ${esc(h.title)}<small style="display:block">${new Date(h.at).toLocaleString('pt-BR')}</small></div><small>${h.type==='task'?'+'+h.xp+' XP':''}</small></div>`).join('')||'<div class="empty">Seu progresso aparecerá aqui.</div>'}`}
if(page==='profile'){html=`<h1>Meu perfil</h1><div class="center">${cat()}<h2>${esc(state.name)}</h2><p class="muted">Nível ${1+Math.floor(xp()/100)} · ${xp()} XP</p></div><div class="grid"><div class="card center"><small>Missões</small><h2>${state.tasks.filter(t=>t.done).length}</h2></div><div class="card center"><small>Pomodoros</small><h2>${state.sessions.length}</h2></div></div><label for="name">Seu nome</label><input id="name" maxlength="40" value="${esc(state.name)}"><label for="theme">Tema</label><select id="theme"><option value="dark">Escuro</option><option value="light" ${state.theme==='light'?'selected':''}>Claro</option></select><label for="color">Cor principal</label><input id="color" type="color" value="${state.color}"><button class="primary wide" data-profile>Salvar perfil</button><button class="wide" data-page="history">Histórico de conquistas</button><button class="wide" data-export>Exportar backup</button><label for="import">Restaurar backup</label><input id="import" type="file" accept="application/json"><button class="wide" data-install>Instalar aplicativo</button><p class="muted">Dados salvos neste navegador. Exporte um backup para guardar seu progresso.</p>`}$('#app').innerHTML=html;clock()}

function rewardform(id){let r=state.rewards.find(r=>r.id===id)||{title:'',cost:25};open(`<h2>${id?'Editar':'Nova'} recompensa</h2><form id="rewardform" data-id="${id||''}"><label>O que você quer fazer?</label><input name="title" required maxlength="100" value="${esc(r.title)}"><label>Custo em moedas</label><input name="cost" type="number" min="1" max="10000" required value="${r.cost}"><button class="primary wide">Salvar recompensa</button>${id?'<button type="button" class="wide" data-rewarddelete="'+id+'">Excluir recompensa</button>':''}</form>`)}
function clock(){let t=state.timer,remaining=t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.remaining;if($('#clock'))$('#clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');if(t.end&&remaining===0){if(t.mode==='focus'){state.sessions.push({at:Date.now(),title:state.tasks.find(x=>x.id===state.focusTask)?.title||'Foco livre',minutes:state.focus});toast('Foco concluído! Hora de descansar.')}else toast('Pausa concluída!');t.end=null;t.mode=t.mode==='focus'?'break':'focus';t.remaining=state[t.mode]*60;save();render()}}setInterval(clock,500);
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.page)go(d.page);if('close'in d)$('#modal').close();if(d.filter){filter=d.filter;render()}if('newtask'in d)taskform();if(d.edit)taskform(d.edit);if(d.toggle){let t=state.tasks.find(t=>t.id===d.toggle);t.done=!t.done;if(t.done){state.coins+=Number(t.xp);t.completedAt=Date.now();state.history.push({type:'task',taskId:t.id,title:t.title,xp:t.xp,at:t.completedAt});toast('Missão concluída! +'+t.xp+' moedas')}else{state.coins-=Number(t.xp);state.history=state.history.filter(h=>h.taskId!==t.id);toast('Missão reaberta; recompensa revertida.')}save();render()}if(d.delete){if(confirm('Excluir esta missão?')){state.tasks=state.tasks.filter(t=>t.id!==d.delete);save();$('#modal').close();render()}}if(d.month){month=new Date(month.getFullYear(),month.getMonth()+Number(d.month),1);render()}if(d.day){day=d.day;render()}if('newreward'in d)rewardform();if(d.rewardedit)rewardform(d.rewardedit);if(d.rewarddelete){if(confirm('Excluir recompensa?')){state.rewards=state.rewards.filter(r=>r.id!==d.rewarddelete);save();$('#modal').close();render()}}if(d.redeem){let r=state.rewards.find(r=>r.id===d.redeem);if(state.coins>=r.cost&&confirm('Resgatar “'+r.title+'” por '+r.cost+' moedas?')){state.coins-=r.cost;state.history.push({type:'reward',title:r.title,at:Date.now(),cost:r.cost});save();render();toast('Recompensa resgatada. Aproveite!')}}if('timer'in d){let t=state.timer;if(t.end){t.remaining=Math.max(0,Math.ceil((t.end-Date.now())/1000));t.end=null}else t.end=Date.now()+t.remaining*1000;save();render()}if('reset'in d||'mode'in d){let t=state.timer;t.end=null;if('mode'in d)t.mode=t.mode==='focus'?'break':'focus';t.remaining=state[t.mode]*60;save();render()}if('duration'in d){let f=Number($('#focusMin').value),r=Number($('#breakMin').value);if(f<1||f>180||r<1||r>60){toast('Use foco de 1–180 e pausa de 1–60 minutos.');return}state.focus=f;state.break=r;if(!state.timer.end)state.timer.remaining=state[state.timer.mode]*60;save();render();toast('Duração salva')}if('profile'in d){state.name=$('#name').value.trim()||'Aventureiro';state.theme=$('#theme').value;state.color=$('#color').value;save();render();toast('Perfil atualizado')}if('export'in d){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='nekoquest-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}if('install'in d)install()});
document.addEventListener('submit',e=>{if(!['taskform','rewardform'].includes(e.target.id))return;e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f)),id=f.dataset.id;if(f.id==='taskform'){v.title=v.title.trim();if(!v.title)return;v.xp=Number(v.xp);v.minutes=Number(v.minutes);if(id){let t=state.tasks.find(t=>t.id===id);if(t.done)v.xp=t.xp;Object.assign(t,v)}else state.tasks.push({...v,id:uid(),done:false})}else{v.title=v.title.trim();if(!v.title)return;v.cost=Number(v.cost);if(id)Object.assign(state.rewards.find(r=>r.id===id),v);else state.rewards.push({...v,id:uid()})}save();$('#modal').close();render()});document.addEventListener('change',async e=>{if(e.target.id==='focusTask'){state.focusTask=e.target.value;save()}if(e.target.id==='import'&&e.target.files[0]){try{let s=JSON.parse(await e.target.files[0].text());if(!Array.isArray(s.tasks)||!Array.isArray(s.rewards)||!Array.isArray(s.history)||!Array.isArray(s.sessions)||!s.timer||!['focus','break'].includes(s.timer.mode)||!Number.isFinite(s.coins)||!/^#[0-9a-f]{6}$/i.test(s.color)||s.tasks.some(t=>!t.id||typeof t.title!=='string'||!Number.isFinite(t.xp))||s.rewards.some(r=>!r.id||typeof r.title!=='string'||!Number.isFinite(r.cost)))throw Error();if(confirm('Substituir os dados atuais pelo backup?')){state=s;save();render();toast('Backup restaurado')}}catch{toast('Arquivo de backup inválido.')}}});$('#topProfile').onclick=()=>go('profile');let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});async function install(){if(installPrompt){await installPrompt.prompt();installPrompt=null}else open('<h2>Instalar NekoQuest</h2><p>Abra o endereço publicado em HTTPS no navegador do celular.</p><p>No Android, use o menu do Chrome → Instalar app. No iPhone, use Compartilhar → Adicionar à Tela de Início.</p>')}if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});render();save();
