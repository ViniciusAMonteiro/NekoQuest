function activityHistory(id){let t=state.tasks.find(t=>t.id===id),key=t.seriesId||t.id;modal('Registros · '+esc(t.title),org().logs.filter(l=>l.key===key).sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="card"><div class="row"><b class="grow">${l.amount} · ${shortDate(l.date)}</b>${extButton('log-delete','Excluir',l.id)}</div><p>${esc(l.note)}</p></div>`).join('')||'<p>Nenhuma atividade registrada.</p>')}
function safeNote(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/_([^_]+)_/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function journal(){return head('SEU ESPAÇO DE REFLEXÃO','Diário')+`<div class="row">${extButton('note','+ Nova nota')}<button data-action="note-favorites" class="quiet" aria-pressed="${onlyFavorites}">${onlyFavorites?'★ Favoritas':'☆ Todas'}</button></div><label for="noteChoice">Filtrar por rotina</label><select id="noteChoice"><option value="all">Todas as notas</option>${organizerOptions().map(([k,v])=>`<option value="${esc(k)}" ${noteChoice===k?'selected':''}>${esc(v)}</option>`).join('')}</select>${org().notes.filter(n=>(noteChoice==='all'||n.key===noteChoice)&&(!onlyFavorites||n.favorite)).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<article class="card journal-note"><small>${shortDate(n.date)}</small><h2>${esc(n.title)}</h2><div>${safeNote(n.text)}</div><div class="row">${extButton('note', 'Editar',n.id)}${extButton('note-star',n.favorite?'★ Favorita':'☆ Favoritar',n.id)}${extButton('note-delete','Excluir',n.id)}</div></article>`).join('')||''}`}
function noteForm(id){let n=org().notes.find(n=>n.id===id)||{title:'',text:'',key:'',date:Core.today()};modal('Meu diário',`<form data-form="ext-note" data-id="${esc(id||'')}">${formField('Título','title',n.title,'text','required maxlength="150"')}${formField('Data','date',n.date,'date','required')}${selectField('Rotina associada','key',organizerOptions(),n.key)}<label for="note-text">Reflexão</label><div class="row">${extButton('note-bold','Negrito')}${extButton('note-italic','Itálico')}</div><textarea id="note-text" name="text" maxlength="10000" rows="7" required>${esc(n.text)}</textarea><p class="footnote">Use **negrito** e _itálico_ para destacar trechos.</p><div id="note-preview" class="note-preview">${safeNote(n.text)}</div><button class="primary wide">Salvar nota</button></form>`)}
function reminderForm(id){let r=org().reminders.find(x=>x.id===id)||{title:'',date:Core.today(),time:'09:00',repeat:'once'};modal('Lembrete',`<form data-form="ext-reminder" data-id="${esc(id||'')}">${formField('Título','title',r.title,'text','required maxlength="150"')}${formField('Data inicial','date',r.date,'date','required')}${formField('Horário','time',r.time,'time','required')}${selectField('Repetir','repeat',[['once','Uma vez'],['daily','Diariamente'],['weekly','Semanalmente'],['monthly','Mensalmente']],r.repeat)}<p class="footnote">Avisos funcionam enquanto o aplicativo está aberto. Exporte para o calendário do celular para receber lembretes em segundo plano. Mensais no dia 31 só ocorrem em meses com esse dia.</p><button class="primary wide">Salvar lembrete</button></form>`)}

function calendar(){let days=agendaMode==='week'?Array.from({length:7},(_,i)=>Core.addDays(Ext.period(day,'weekly'),i)):[day];return `<div class="tabs">${[['day','Dia'],['week','Semana'],['month','Mês']].map(([v,n])=>`<button data-action="agenda-mode" data-id="${v}" class="${agendaMode===v?'selected':''}">${n}</button>`).join('')}</div>${agendaMode==='month'?monthCalendar():`<label for="agendaDate">Data de referência</label><input id="agendaDate" type="date" value="${day}">${days.map(d=>`<div class="section"><h3>${shortDate(d)}</h3>${taskList(state.tasks.filter(t=>t.date===d&&!t.archived))}</div>`).join('')}`}<div class="section row"><h2>Lembretes</h2>${extButton('reminder','+ Novo')}</div><p class="footnote">${agendaMode==='week'?'Nesta semana':'Em '+shortDate(day)} · horários do dispositivo</p>${org().reminders.filter(r=>days.some(d=>Ext.due(r,d))).map(r=>`<div class="card row"><div class="grow"><b>${esc(r.title)}</b><p>${r.time} · ${{once:'Uma vez',daily:'Diário',weekly:'Semanal',monthly:'Mensal'}[r.repeat]}</p></div>${extButton('reminder','Editar',r.id)}</div>`).join('')||'<p class="muted">Nenhum lembrete neste período.</p>'}<div class="row wrap">${extButton('reminders','Todos os lembretes')}${extButton('export-calendar','Exportar calendário')}</div>`};
function allReminders(){modal('Todos os lembretes',`<p class="footnote">Avisos locais enquanto o NekoQuest estiver aberto. Ao reabrir, serão mostrados lembretes pendentes do dia.</p>${extButton('notify-permission','Ativar notificações')}${org().reminders.map(r=>`<div class="card"><b>${esc(r.title)}</b><p>${shortDate(r.date)} · ${r.time}</p><div class="row wrap">${extButton('reminder','Editar',r.id)}${extButton('reminder-toggle',r.enabled?'Pausar':'Ativar',r.id)}${extButton('reminder-delete','Excluir',r.id)}</div></div>`).join('')}`)}
function quitForm(){modal('Um novo começo',`<form data-form="ext-quit">${formField('Hábito que você deixou','title','','text','required maxlength="100"')}${formField('Desde quando','date',Core.today(),'date',`required max="${Core.today()}"`)}<button class="primary wide">Acompanhar marco</button></form>`)}
function extSubmit(type,v,id){let o=org();if(type==='ext-list'){if(!v.title.trim())throw Error('Informe um nome.');o.lists.push({id:Core.id(),title:v.title.trim()})}if(type==='ext-goal'){let target=Number(v.target);if(!Number.isFinite(target)||target<=0||target>1e9||!v.unit.trim()||!Ext.periods.includes(v.period))throw Error('Confira a meta.');o.goals[id]={target,unit:v.unit.trim(),period:v.period}}
 if(type==='ext-log'){let amount=Number(v.amount);if(!Number.isFinite(amount)||amount<=0||amount>1e9||!Core.validDate(v.date)||v.date>Core.today())throw Error('Confira quantidade e data.');o.logs.push({...v,amount,key:id,id:Core.id()})}
 if(type==='ext-note'){if(!v.title.trim()||!v.text.trim()||!Core.validDate(v.date))throw Error('Confira a nota.');let n=o.notes.find(x=>x.id===id);if(n)Object.assign(n,v);else o.notes.push({...v,id:Core.id(),favorite:false})}
 if(type==='ext-reminder'){if(!v.title.trim()||!Core.validDate(v.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))throw Error('Confira título, data e horário.');let r=o.reminders.find(x=>x.id===id);if(r)Object.assign(r,v,{lastFired:null});else o.reminders.push({...v,id:Core.id(),enabled:true})}
 if(type==='ext-quit'){if(!v.title.trim()||!Core.validDate(v.date)||v.date>Core.today())throw Error('Confira nome e data.');o.quits.push({id:Core.id(),title:v.title.trim(),since:new Date(v.date+'T00:00').getTime()})}}
document.addEventListener('click',async e=>{let d=e.target.closest('button')?.dataset;if(!d)return;let a=d.action,o=org();try{
 if(a==='lists')listManager();if(a==='list-rename'){let l=o.lists.find(x=>x.id===d.id),name=prompt('Nome da lista',l.title);if(name?.trim()){l.title=name.trim().slice(0,100);save();render();listManager()}}
 if(a==='list-delete'&&confirm('Excluir a lista? As tarefas serão mantidas.')){o.lists=o.lists.filter(x=>x.id!==d.id);state.tasks.forEach(t=>{if(t.listId===d.id)t.listId=''});listChoice='all';save();render();listManager()}
 if(a==='routine-timer')routineStopwatch(d.id);if(a==='watch-start'){let w=o.stopwatch;w.startedAt=Date.now();save();routineStopwatch(w.taskId)}if(a==='watch-pause'){let w=o.stopwatch;w.elapsed+=Date.now()-w.startedAt;w.startedAt=null;save();routineStopwatch(w.taskId)}if(a==='watch-log'){let w=o.stopwatch,minutes=(w.elapsed+(w.startedAt?Date.now()-w.startedAt:0))/60000;if(minutes<0.001){toast('Inicie o cronômetro antes de registrar.');return}w.elapsed=minutes*60000;w.startedAt=null;save();activityForm(w.taskId);$('#modal [name=amount]').value=Math.round(minutes*1000)/1000;$('#modal form').dataset.stopwatch='true'}if(a==='watch-reset'&&confirm('Zerar o cronômetro sem registrar?')){o.stopwatch={taskId:d.id,elapsed:0,startedAt:null};save();routineStopwatch(d.id)}
 if(a==='routine-goal')routineGoalForm(d.id);if(a==='activity')activityForm(d.id);if(a==='activity-history')activityHistory(d.id);
 if(a==='log-delete'&&confirm('Excluir o registro e recalcular a sequência?')){o.logs=o.logs.filter(x=>x.id!==d.id);save();$('#modal').close();render()}
 if(a==='note')noteForm(d.id);if(a==='note-favorites'){onlyFavorites=!onlyFavorites;render()}
 if(a==='note-star'){let n=o.notes.find(x=>x.id===d.id);n.favorite=!n.favorite;save();render()}
 if(a==='note-delete'&&confirm('Excluir esta nota?')){o.notes=o.notes.filter(x=>x.id!==d.id);save();render()}
 if(a==='note-bold'||a==='note-italic'){let el=$('#note-text'),mark=a==='note-bold'?'**':'_',i=el.selectionStart,j=el.selectionEnd;el.setRangeText(mark+el.value.slice(i,j)+mark,i,j,'select');el.focus();$('#note-preview').innerHTML=safeNote(el.value)}
 if(a==='quit')quitForm();if(a==='quit-reset'&&confirm('Reiniciar a contagem a partir de agora?')){o.quits.find(x=>x.id===d.id).since=Date.now();save();render()}
 if(a==='quit-delete'&&confirm('Excluir este marco?')){o.quits=o.quits.filter(x=>x.id!==d.id);save();render()}
 if(a==='agenda-mode'){agendaMode=d.id;render()}if(a==='reminder')reminderForm(d.id);if(a==='reminders')allReminders();
 if(a==='reminder-toggle'){let r=o.reminders.find(x=>x.id===d.id);r.enabled=!r.enabled;save();render();allReminders()}
 if(a==='reminder-delete'&&confirm('Excluir lembrete?')){o.reminders=o.reminders.filter(x=>x.id!==d.id);save();render();allReminders()}
 if(a==='notify-permission')await authorizeModernNotifications();
 if(a==='export-calendar'){if(!o.reminders.some(r=>r.enabled)){toast('Crie ou ative um lembrete primeiro.');return}let url=URL.createObjectURL(new Blob([Ext.ics(o.reminders)],{type:'text/calendar;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='nekoquest-agenda.ics';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Importe o arquivo no calendário e confira os alertas. Reimportações podem duplicar eventos.')}
 }catch(err){showIssue(err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='listChoice'){listChoice=e.target.value;render()}if(e.target.id==='noteChoice'){noteChoice=e.target.value;render()}if(e.target.id==='agendaDate'&&Core.validDate(e.target.value)){day=e.target.value;calMonth=day.slice(0,7);render()}});
document.addEventListener('input',e=>{if(e.target.id==='note-text')$('#note-preview').innerHTML=safeNote(e.target.value)});
async function checkLocalReminders(){let now=new Date(),d=Core.today(),time=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');for(let r of org().reminders){if(!Ext.due(r,d)||r.time>time||r.lastFired===d)continue;r.lastFired=d;if(r.source==='hydration'&&(now.getHours()*60+now.getMinutes()-(Number(r.time.slice(0,2))*60+Number(r.time.slice(3))))>15){save();continue}save();toast('Lembrete: '+r.title);playModernSound('alert');await modernNotify('NekoQuest',r.title,r.id);}}

setInterval(checkLocalReminders,30000);

function routineStopwatch(id){let o=org(),w=o.stopwatch;if(w&&w.taskId!==id&&(w.elapsed||w.startedAt)&&!confirm('Descartar o cronômetro anterior e iniciar nesta rotina?'))return;if(!w||w.taskId!==id)w=o.stopwatch={taskId:id,elapsed:0,startedAt:null};let t=state.tasks.find(t=>t.id===id);save();modal('Tempo de atividade',`<p>${esc(t.title)}</p><p class="big" id="routine-watch">00:00</p><div class="row wrap">${extButton(w.startedAt?'watch-pause':'watch-start',w.startedAt?'Pausar':'Iniciar',id)}${extButton('watch-log','Registrar minutos',id)}${extButton('watch-reset','Zerar',id)}</div><p class="footnote">O tempo continua ao fechar esta tela. Registrar abre a atividade para você conferir antes de salvar.</p>`);paintStopwatch()}
function paintStopwatch(){let w=org().stopwatch,el=$('#routine-watch');if(!w||!el)return;let seconds=Math.floor((w.elapsed+(w.startedAt?Date.now()-w.startedAt:0))/1000);el.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
setInterval(paintStopwatch,500);

let financeReportFilter=null,financeCalendarDay=null;
function reportFilter(){return financeReportFilter||{from:finMonth+'-01',to:Core.addDays(moveMonth(finMonth,1)+'-01',-1),type:'all',status:'all',category:'all',query:''}}
function reportEntries(filter=reportFilter()){return state.finance.entries.filter(e=>e.date>=filter.from&&e.date<=filter.to&&(filter.type==='all'||e.type===filter.type)&&(filter.status==='all'||e.paid===(filter.status==='paid'))&&(filter.category==='all'||e.category===filter.category)&&normalizeSearch(e.title+' '+e.category).includes(normalizeSearch(filter.query))).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))}
function reportTotals(entries){return entries.reduce((a,e)=>{a[e.type]+=e.amount;if(e.paid)a[e.type+'Paid']+=e.amount;return a},{income:0,expense:0,incomePaid:0,expensePaid:0})}
function previousReportFilter(f){const n=Math.round((new Date(f.to+'T12:00Z')-new Date(f.from+'T12:00Z'))/86400000)+1;return {...f,from:Core.addDays(f.from,-n),to:Core.addDays(f.from,-1)}}
function financeReports(){const f=reportFilter(),es=reportEntries(f),t=reportTotals(es),prior=previousReportFilter(f),p=reportTotals(reportEntries(prior)),cats=[...new Set(state.finance.entries.map(e=>e.category))].sort();return `<p class="view-description">Cruze filtros e compare períodos com a mesma duração.</p><div class="chips report-presets"><button data-action="report-preset" data-value="today">Hoje</button><button data-action="report-preset" data-value="30days">Últimos 30 dias</button><button data-action="report-preset" data-value="all">Todo o histórico</button></div><form id="finance-report-form"><div class="grid">${formField('De','from',f.from,'date','required')}${formField('Até','to',f.to,'date','required')}</div><div class="grid">${selectField('Tipo','type',[['all','Receitas e despesas'],['income','Receitas'],['expense','Despesas']],f.type)}${selectField('Situação','status',[['all','Todas'],['paid','Efetivadas'],['pending','Pendentes']],f.status)}</div>${selectField('Categoria','category',[['all','Todas as categorias'],...cats.map(c=>[c,c])],f.category)}${formField('Pesquisar descrição ou categoria','query',f.query,'search','maxlength="150"')}<div class="row"><button class="primary">Aplicar filtros</button><button type="button" data-action="report-reset">Mês atual da tela</button></div></form><div class="section"><h2>${es.length} lançamentos encontrados</h2><p class="footnote">${shortDate(f.from)} a ${shortDate(f.to)} · ${f.from.slice(0,4)} / ${f.to.slice(0,4)}</p></div><div class="grid"><div class="card"><small>Receitas selecionadas</small><p>${money(t.income)}</p></div><div class="card"><small>Despesas selecionadas</small><p>${money(t.expense)}</p></div></div><div class="card"><small>Resultado efetivado no período</small><h2>${money(t.incomePaid-t.expensePaid)}</h2><p class="footnote">Recebido menos pago. Não inclui saldo inicial.</p><p>Variação das despesas pagas: ${money(t.expensePaid-p.expensePaid)}</p><small>Comparação com ${prior.from.split('-').reverse().join('/')} a ${prior.to.split('-').reverse().join('/')}, usando os mesmos filtros.</small></div><details class="card"><summary>Exportar resultados</summary><p class="footnote">Arquivos contêm valores completos. CSV abre no Excel. HTML pode ser impresso ou salvo como PDF pelo navegador.</p><div class="row wrap"><button data-action="report-csv">CSV / Excel</button><button data-action="report-html">HTML / impressão</button><button data-action="report-ics">Calendário (.ics)</button></div></details>${entryList(es)}`}
function financeCalendar(){const first=finMonth+'-01',count=Number(Core.addDays(moveMonth(finMonth,1)+'-01',-1).slice(8));if(!financeCalendarDay?.startsWith(finMonth))financeCalendarDay=first;return `<p class="view-description">Datas de recebimento e vencimento dos lançamentos cadastrados.</p><div class="calendar">${['D','S','T','Q','Q','S','S'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(new Date(first+'T12:00').getDay())}${Array.from({length:count},(_,i)=>{let d=finMonth+'-'+String(i+1).padStart(2,'0'),n=state.finance.entries.filter(e=>e.date===d).length;return `<button data-action="finance-day" data-value="${d}" class="${d===financeCalendarDay?'selected':''} ${n?'dot':''}" aria-label="${d.split('-').reverse().join('/')}, ${n} lançamentos">${i+1}</button>`}).join('')}</div><div class="section"><h2>${shortDate(financeCalendarDay)}</h2></div>${entryList(state.finance.entries.filter(e=>e.date===financeCalendarDay))}<button class="primary wide" data-action="finance-day-entry">Novo lançamento nesta data</button>`}
function financeCsv(es){const cell=v=>{let s=String(v);if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};return '\uFEFF'+[['Data','Descrição','Tipo','Categoria','Valor (R$)','Situação'],...es.map(e=>[e.date,e.title,e.type==='income'?'Receita':'Despesa',e.category,(e.amount/100).toFixed(2).replace('.',','),e.paid?'Efetivado':'Pendente'])].map(row=>row.map(cell).join(';')).join('\r\n')}
function financeReportHtml(es,f){const fmt=n=>(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),t=reportTotals(es);return '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NekoQuest — relatório financeiro</title><style>body{font:16px system-ui;margin:24px;color:#18202c}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}main{overflow-x:auto}@media print{body{margin:0;font-size:11px}tr{break-inside:avoid}}</style><h1>NekoQuest · Finanças</h1><p>'+esc(f.from)+' a '+esc(f.to)+'</p><p>Filtros: '+esc(f.type)+' · '+esc(f.status)+' · '+esc(f.category)+' · Pesquisa: '+esc(f.query)+'</p><p>Receitas: '+fmt(t.income)+' · Despesas: '+fmt(t.expense)+' · Resultado efetivado: '+fmt(t.incomePaid-t.expensePaid)+'</p><main><table><thead><tr>'+['Data','Descrição','Tipo','Categoria','Valor','Situação'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+es.map(e=>'<tr>'+[e.date,e.title,e.type==='income'?'Receita':'Despesa',e.category,fmt(e.amount),e.paid?'Efetivado':'Pendente'].map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></main><p>Gerado localmente. Use Imprimir no navegador para salvar como PDF. Datas correspondem às datas cadastradas dos lançamentos.</p></html>'}
function downloadFinance(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.addEventListener('submit',e=>{if(e.target.id!=='finance-report-form')return;e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!Core.validDate(f.from)||!Core.validDate(f.to)||f.from>f.to){toast('Confira o intervalo: a data inicial deve vir antes da final.');return}financeReportFilter=f;render()});
document.addEventListener('click',e=>{const d=e.target.closest('button')?.dataset;if(!d)return;if(d.action==='report-reset'){financeReportFilter=null;render()}if(d.action==='finance-day'){financeCalendarDay=d.value;render()}if(d.action==='finance-day-entry'){entryForm();$('#modal [name=date]').value=financeCalendarDay}if(['report-csv','report-html','report-ics'].includes(d.action)){const es=reportEntries();if(!es.length){toast('Nenhum lançamento para exportar.');return}if(!confirm('Exportar os lançamentos filtrados com descrições e valores completos? O arquivo não será criptografado.'))return;if(d.action==='report-csv')downloadFinance(financeCsv(es),'nekoquest-relatorio.csv','text/csv;charset=utf-8');if(d.action==='report-html')downloadFinance(financeReportHtml(es,reportFilter()),'nekoquest-relatorio.html','text/html;charset=utf-8');if(d.action==='report-ics'){const pending=es.filter(x=>!x.paid);if(!pending.length){toast('Não há lançamentos pendentes neste filtro.');return}downloadFinance(Ext.ics(pending.map(x=>({id:'finance-'+x.id,title:x.title,date:x.date,time:'09:00',enabled:true,repeat:'once'}))),'nekoquest-financas.ics','text/calendar;charset=utf-8');toast('Pendências exportadas às 9h. Confira os alertas no calendário; reimportações podem duplicar eventos.')}}});

function normalizeSearch(text){return String(text).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR')}
function financialAttention(){const today=Core.today(),until=Core.addDays(today,7);return state.finance.entries.filter(e=>e.type==='expense'&&!e.paid&&e.date<=until).sort((a,b)=>a.date.localeCompare(b.date)||b.amount-a.amount)}
function financeAttentionPanel(){const entries=financialAttention(),overdue=entries.filter(e=>e.date<Core.today());if(!entries.length)return `<div class="finance-calm"><span>${icon('check')}</span><p>Nenhuma despesa cadastrada pendente até os próximos 7 dias.</p></div>`;return `<section class="card finance-attention"><div class="row"><h2>Precisa de atenção</h2><span class="badge">${entries.length}</span></div><p class="muted">${overdue.length?`${overdue.length} vencida(s) · `:''}Até ${shortDate(Core.addDays(Core.today(),7))}, incluindo outros meses.</p>${entries.slice(0,3).map(e=>`<button class="attention-item" data-action="settle" data-id="${esc(e.id)}"><span><b>${esc(e.title)}</b><small class="${e.date<Core.today()?'danger':''}">${e.date<Core.today()?'Vencida · ':e.date===Core.today()?'Hoje · ':''}${shortDate(e.date)}</small></span><strong>${money(e.amount)}</strong>${icon('arrow')}</button>`).join('')}<button class="quiet wide" data-action="attention-all">Ver todas as pendências</button></section>`}
function financeEntryResults(entries){const filtered=filteredEntries(entries);return `<p class="result-count" role="status">${filtered.length} de ${entries.length} lançamentos neste mês</p>${filtered.length?entryList(filtered):`<div class="card center"><h3>${entries.length?'Nenhum resultado':'Nenhum lançamento neste mês'}</h3><p class="muted">${entries.length?'Tente outra busca ou remova os filtros.':'Registre sua primeira receita ou despesa.'}</p>${entries.length?'<button data-action="finance-clear">Limpar busca e filtros</button>':'<button data-action="entry">Adicionar lançamento</button>'}</div>`}`}
function financeQuickActions(){return `<div class="finance-quick"><button data-action="finance-fast" data-value="expense"><span>${icon('up')}</span><b>Despesa</b><small>Registrar saída</small></button><button data-action="finance-fast" data-value="income"><span>${icon('down')}</span><b>Receita</b><small>Registrar entrada</small></button></div>`}
function setReportPreset(preset){const today=Core.today();let from,to;if(preset==='today'){from=to=today}else if(preset==='30days'){from=Core.addDays(today,-29);to=today}else{from=state.finance.entries.reduce((d,e)=>e.date<d?e.date:d,today);to=state.finance.entries.reduce((d,e)=>e.date>d?e.date:d,today)}financeReportFilter={...reportFilter(),from,to};finTab='reports';render()}
document.addEventListener('click',e=>{const d=e.target.closest('button')?.dataset;if(!d)return;
 if(d.action==='finance-now'){finMonth=Core.today().slice(0,7);financeCalendarDay=Core.today();render()}
 if(d.action==='finance-clear'){financeQuery='';financeFilter='all';render();$('#finance-search')?.focus()}
 if(d.action==='finance-fast'){entryForm();const form=$('#modal form'),type=form.querySelector('[name=type]');type.value=d.value;type.dispatchEvent(new Event('change',{bubbles:true}));form.querySelector('[name=title]').focus()}
 if(d.action==='attention-all'){const es=financialAttention();financeReportFilter={from:es.length?es[0].date:Core.today(),to:Core.addDays(Core.today(),7),type:'expense',status:'pending',category:'all',query:''};finTab='reports';render()}
 if(d.action==='report-preset')setReportPreset(d.value);
});

let breatheTab='progress',breatheFilter='all',supportEnd=null;
const breatheLabels={craving:'Vontade',smoke:'Cigarro',vape:'Vape',replacement:'Reposição de nicotina',reflection:'Reflexão'};
const breatheTriggers=['Ao acordar','Pessoas fumando','Após comer','Café','Ansiedade / estresse','Tédio / sozinho','Bebida alcoólica','Outro'];
const breatheStrategies=['Mudei de ambiente','Bebi água','Caminhei um pouco','Conversei com alguém','Ocupei as mãos','Esperei antes de decidir','Outra'];
const breatheData=()=>Breathe.init(state).breathe;
const localDateTime=t=>{const d=new Date(t);return Core.date(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function breatheDuration(ms){const h=Math.floor(ms/3600000);return `${Math.floor(h/24)}d ${h%24}h ${Math.floor(ms/60000)%60}min`}
function breathe(){const b=breatheData();return head('UM PASSO DE CADA VEZ','Respirar','Seu espaço para uma vida sem cigarro.')+`<button class="primary wide breathe-sos" data-action="breathe-sos">Estou com vontade agora</button><div class="tabs breathe-tabs">${[['progress','Progresso'],['diary','Diário'],['plan','Meu plano']].map(([k,n])=>`<button data-action="breathe-tab" data-value="${k}" class="${breatheTab===k?'selected':''}" aria-pressed="${breatheTab===k}">${n}</button>`).join('')}</div>${breatheTab==='diary'?breatheDiary():breatheTab==='plan'?breathePlan():breatheProgress()}<p class="footnote">Registros locais, incluídos no backup geral. Este espaço oferece organização e apoio; não substitui acompanhamento de saúde.</p>`}
function breatheProgress(){const b=breatheData(),s=Breathe.stats(b);if(!s)return `<div class="card center">${cat('yuki')}<h2>Você não precisa fazer tudo de uma vez.</h2><p>Defina seu ponto de partida e o motivo que quer levar com você. Você também pode começar apenas registrando suas vontades.</p><button class="primary wide" data-action="breathe-profile">Configurar minha jornada</button><button class="wide" data-action="breathe-log" data-kind="craving">Registrar uma vontade</button></div>`;const milestones=[1,3,7,14,30,60,90,180,365],elapsed=s.streak/86400000,next=milestones.find(n=>n>elapsed);return `<div class="card breathe-hero">${cat('yuki')}<small>Tempo desde o último cigarro registrado</small><h2 id="breathe-elapsed">${breatheDuration(s.streak)}</h2><p>${esc(b.profile.reason||'Um passo de cada vez, no seu ritmo.')}</p></div><div class="grid"><div class="card"><small>Cigarros evitados · estimativa</small><h2>${s.avoided}</h2></div><div class="card"><small>Economia bruta estimada</small><h2>${money(s.saved)}</h2></div></div><details class="card"><summary>Como são feitas as estimativas?</summary><p>Comparamos ${b.profile.daily} cigarros por dia com o tempo desde ${new Date(b.profile.start).toLocaleString('pt-BR')} e descontamos os cigarros registrados nesse intervalo. A economia usa o preço informado; não desconta gastos com tratamentos ou outros produtos e não altera Finanças.</p><p>Os contadores dependem dos seus registros. Vape e reposição são acompanhados separadamente: tempo sem cigarro não significa tempo sem nicotina. Alterar o ponto de partida recalcula os números, sem apagar o diário.</p></details><div class="breathe-actions">${[['craving','Registrar vontade'],['smoke','Fumei um cigarro'],['vape','Registrar vape'],['replacement','Registrar reposição']].map(([k,n])=>`<button data-action="breathe-log" data-kind="${k}">${n}</button>`).join('')}</div><div class="section"><h2>Pequenas conquistas</h2><p class="muted">Marcos da sequência atual, conforme seus registros.</p></div><div class="breathe-milestones">${milestones.map(n=>`<span class="${elapsed>=n?'reached':''}">${elapsed>=n?'✓':'○'} ${n} ${n===1?'dia':'dias'}</span>`).join('')}</div>${next?`<p class="footnote">Próximo marco: ${next} dias. O seu valor não depende de uma sequência.</p>`:''}<div class="card"><b>${s.cravings} vontades registradas</b><p>Em ${s.helped}, você marcou que a estratégia ajudou.</p><p class="muted">Se fumou, registre com honestidade. O diário e o que você aprendeu continuam aqui.</p></div>`}
function breatheDiary(){const b=breatheData(),logs=b.logs.filter(l=>breatheFilter==='all'||l.kind===breatheFilter).slice().sort((a,b)=>b.at-a.at);const counts={};b.logs.filter(l=>l.kind==='craving').forEach(l=>{if(l.trigger)counts[l.trigger]=(counts[l.trigger]||0)+1});return `<button class="wide" data-action="breathe-log" data-kind="reflection">+ Escrever reflexão</button><label for="breathe-filter">Mostrar registros</label><select id="breathe-filter"><option value="all">Todos</option>${Object.entries(breatheLabels).map(([k,v])=>`<option value="${k}" ${breatheFilter===k?'selected':''}>${v}</option>`).join('')}</select>${Object.keys(counts).length?`<details class="card"><summary>Gatilhos que você registrou</summary>${Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<p>${esc(k)}: ${n}</p>`).join('')}<small>Frequência dos registros, não uma avaliação clínica.</small></details>`:''}<p class="footnote">${logs.length} registro(s). Mostrando os 100 mais recentes; o backup preserva todos.</p>${logs.slice(0,100).map(l=>`<article class="card breathe-record"><small>${new Date(l.at).toLocaleString('pt-BR')}</small><h3>${breatheLabels[l.kind]}${l.kind==='smoke'?' · '+l.amount+' cigarro(s)':''}</h3>${l.kind==='craving'?`<p>Intensidade: ${l.intensity}/10 · ${esc(l.trigger)}</p><p>${esc(l.strategy)}${l.helped?' · Ajudou':''}</p>`:''}${['vape','replacement'].includes(l.kind)?`<p>${l.amount} ${esc(l.unit)}</p>`:''}<p class="detail-notes">${esc(l.note)}</p><div class="row"><button class="quiet" data-action="breathe-edit" data-id="${esc(l.id)}">Editar</button><button class="quiet" data-action="breathe-remove" data-id="${esc(l.id)}">Excluir</button></div></article>`).join('')||'<div class="card"><p>Seu diário começa com o próximo registro.</p></div>'}`}
function breathePlan(){const p=breatheData().profile;return `<div class="card"><h2>Meu motivo</h2><p class="detail-notes">${esc(p?.reason||'O que você quer conquistar ao deixar o cigarro?')}</p><h3>Meu plano para momentos difíceis</h3><p class="detail-notes">${esc(p?.plan||'Ao acordar, depois do café, perto de pessoas fumando… combine uma alternativa para os momentos que pesam mais para você.')}</p><button class="wide" data-action="breathe-profile">${p?'Editar':'Criar'} meu plano</button></div><div class="card"><h2>Apoio fora do aplicativo</h2><p>Você pode procurar uma Unidade Básica de Saúde e perguntar pelo tratamento do tabagismo no SUS.</p><p>Reposição de nicotina é registrada aqui apenas para acompanhamento. Combine uso, dose e mudanças com um profissional de saúde. Vape não é apresentado como tratamento.</p><a href="https://www.gov.br/inca/pt-br/assuntos/causas-e-prevencao-do-cancer/tabagismo/como-parar-de-fumar" target="_blank" rel="noopener noreferrer">Orientações do INCA ↗</a><p class="footnote">O link externo precisa de internet. O diário e as ferramentas funcionam localmente.</p></div><button class="quiet wide" data-action="breathe-clear">Apagar somente os dados de Respirar</button>`}
function breatheProfile(){const p=breatheData().profile||{start:Date.now(),daily:'',packPrice:0,packCount:20,reason:'',plan:''};modal('Meu ponto de partida',`<form data-form="breathe-profile">${formField('Início do acompanhamento','start',localDateTime(p.start),'datetime-local',`required max="${localDateTime(Date.now())}"`)}${formField('Média de cigarros por dia antes de começar','daily',p.daily,'number','min="0.1" max="200" step="0.1" required')}${formField('Preço do maço (R$) · 0 se não quiser calcular','packPrice',(p.packPrice/100).toFixed(2).replace('.',','),'text','inputmode="decimal" required')}${formField('Cigarros por maço','packCount',p.packCount,'number','min="1" max="200" required')}<label for="breathe-reason">Meu motivo</label><textarea id="breathe-reason" name="reason" maxlength="1000">${esc(p.reason)}</textarea><label for="breathe-plan">Se surgir vontade, o que posso tentar?</label><textarea id="breathe-plan" name="plan" maxlength="2000" placeholder="Ex.: pedir que não me ofereçam cigarro; mudar de ambiente; conversar com alguém.">${esc(p.plan)}</textarea><p class="footnote">Alterar estes dados recalcula as estimativas e os marcos. Nenhum registro do diário será apagado.</p><button class="primary wide">Salvar meu plano</button></form>`)}
function breatheLog(kind='craving',id){const l=breatheData().logs.find(l=>l.id===id)||{kind,at:Date.now(),amount:1,intensity:5,trigger:breatheTriggers[0],strategy:breatheStrategies[0],note:'',unit:'',helped:false};kind=l.kind;modal(breatheLabels[kind],`<form data-form="breathe-log" data-id="${esc(id||'')}"><input type="hidden" name="kind" value="${kind}">${formField('Quando aconteceu?','at',localDateTime(l.at),'datetime-local',`required max="${localDateTime(Date.now())}"`)}${kind==='craving'?`${formField('Intensidade da vontade · 1 a 10','intensity',l.intensity,'number','min="1" max="10" required')}${selectField('O que estava acontecendo?','trigger',breatheTriggers,l.trigger)}${selectField('O que você tentou?','strategy',breatheStrategies,l.strategy)}<label class="checklabel"><input type="checkbox" name="helped" ${l.helped?'checked':''}> Essa estratégia me ajudou</label>`:''}${kind==='smoke'?`${formField('Quantidade de cigarros','amount',l.amount,'number','min="1" max="1000" required')}<p>Um episódio não apaga seu esforço. A sequência será contada a partir do último cigarro registrado; o histórico permanece.</p>`:''}${['vape','replacement'].includes(kind)?`${formField('Quantidade registrada','amount',l.amount,'number','min="0.001" max="10000" step="any" required')}${formField('Produto e unidade','unit',l.unit,'text','required maxlength="80" placeholder="Ex.: unidades de goma, adesivo ou mL de líquido"')}<p class="footnote">Somente registro do que foi usado. Não calculamos doses, equivalência em cigarros ou redução de tratamento. Use as notas para registrar concentração do rótulo, se desejar.</p>`:''}<label for="breathe-note">Como foi? O que pode ajudar na próxima vez?</label><textarea id="breathe-note" name="note" maxlength="2000">${esc(l.note)}</textarea><button class="primary wide">Salvar registro</button></form>`)}
function breatheSubmit(type,v,id){const b=breatheData();if(type==='breathe-profile'){const p={start:new Date(v.start).getTime(),daily:Number(v.daily),packPrice:Core.cents(v.packPrice),packCount:Number(v.packCount),reason:v.reason.trim(),plan:v.plan.trim()};Breathe.validate({...state,breathe:{...b,profile:p}});b.profile=p;return}const old=b.logs.find(x=>x.id===id),l={id:old?.id||Core.id(),kind:v.kind,at:new Date(v.at).getTime(),amount:['smoke','vape','replacement'].includes(v.kind)?Number(v.amount):0,intensity:v.kind==='craving'?Number(v.intensity):0,trigger:v.trigger||'',strategy:v.strategy||'',unit:v.unit?.trim()||'',helped:v.helped==='on',note:v.note.trim()};if(l.at>Date.now()||(['vape','replacement'].includes(l.kind)&&(l.amount<=0||!l.unit)))throw Error('Confira a data, quantidade e unidade.');const next=b.logs.filter(x=>x.id!==l.id).concat(l);Breathe.validate({...state,breathe:{...b,logs:next}});b.logs=next}
function breatheSupport(){modal('Vamos atravessar este momento',`<div class="center">${cat('yuki')}<h2>Cuide dos próximos minutos.</h2><p>A vontade não precisa decidir por você.</p><div id="breathe-support-clock" class="breathe-clock">${supportEnd?'':'03:00'}</div><button class="primary wide" data-action="breathe-start">Começar pausa de 3 minutos</button></div><div class="card"><p>1. Afaste-se do cigarro ou mude de ambiente.</p><p>2. Experimente beber água ou ocupar as mãos.</p><p>3. Se puder, caminhe um pouco ou converse com alguém que apoia você.</p></div><p class="footnote">A pausa é uma ferramenta de apoio, não uma promessa de que a vontade passará em três minutos. Você pode repeti-la ou procurar apoio.</p><button class="wide" data-action="breathe-log" data-kind="craving">Registrar como estou</button>`);breatheTick()}
function breatheTick(){const el=document.querySelector('#breathe-elapsed');if(el&&breatheData().profile)el.textContent=breatheDuration(Breathe.stats(breatheData()).streak);const clock=document.querySelector('#breathe-support-clock');if(clock&&supportEnd){const sec=Math.max(0,Math.ceil((supportEnd-Date.now())/1000));clock.textContent=sec?`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`:'Pausa concluída. Como você está?'}}
setInterval(breatheTick,1000);
document.addEventListener('click',e=>{const d=e.target.closest('button')?.dataset;if(!d)return;const b=breatheData();if(d.action==='breathe-tab'){breatheTab=d.value;render()}if(d.action==='breathe-profile')breatheProfile();if(d.action==='breathe-log')breatheLog(d.kind);if(d.action==='breathe-edit')breatheLog(undefined,d.id);if(d.action==='breathe-sos')breatheSupport();if(d.action==='breathe-start'){supportEnd=Date.now()+180000;breatheTick()}if(d.action==='breathe-remove'&&confirm('Excluir este registro? As estimativas e a sequência serão recalculadas.')){b.logs=b.logs.filter(l=>l.id!==d.id);save();render()}if(d.action==='breathe-clear'&&confirm('Apagar o plano e todos os registros de Respirar? As outras áreas do NekoQuest serão preservadas.')){state.breathe={profile:null,logs:[]};supportEnd=null;save();render()}});
document.addEventListener('change',e=>{if(e.target.id==='breathe-filter'){breatheFilter=e.target.value;render()}});

let waterTab='today',waterDate=Core.today(),waterUndo=null;
const waterData=()=>Hydration.init(state).hydration;
function hydration(){return head('UM CUIDADO NO SEU RITMO','Hidratação','Registre seus copos, acompanhe sua rotina.')+`<div class="tabs water-tabs">${[['today','Hoje'],['history','Histórico'],['settings','Meta e avisos']].map(([k,n])=>`<button data-action="water-tab" data-value="${k}" class="${waterTab===k?'selected':''}" aria-pressed="${waterTab===k}">${n}</button>`).join('')}</div>${waterTab==='history'?waterHistory():waterTab==='settings'?waterSettings():waterToday()}<p class="footnote">Seus registros ficam neste navegador e entram no backup geral do NekoQuest.</p>`}
function waterToday(){const h=waterData(),d=Hydration.day(h,Core.today()),percent=d.goal?Math.min(100,Math.round(d.water/d.goal*100)):0;return `<section class="card water-hero"><div class="water-avatar" role="img" aria-label="${d.goal?percent+'% da meta pessoal de água':'Meta ainda não definida'}"><div class="water-fill" style="height:${percent}%"></div>${cat('sora')}</div><h2>${d.water.toLocaleString('pt-BR')} <small>mL de água</small></h2><p>${d.goal?`Meta pessoal: ${d.goal.toLocaleString('pt-BR')} mL · ${percent}%`:'Defina uma meta pessoal para acompanhar o progresso.'}</p>${d.goal?`<progress aria-label="Progresso da meta pessoal de água" value="${Math.min(d.water,d.goal)}" max="${d.goal}"></progress><p class="muted">${d.water>=d.goal?'Meta registrada! Não é preciso beber mais para ganhar pontos.':`Faltam ${d.goal-d.water} mL para a meta que você escolheu.`}</p>`:'<button data-action="water-goal">Definir minha meta</button>'}</section><div class="section"><h2>Já bebeu água? Registre.</h2></div><div class="water-quick">${[150,250,500].map(n=>`<button data-action="water-quick" data-amount="${n}" aria-label="Registrar ${n} mililitros de água"><b>+ ${n}</b><small>mL</small></button>`).join('')}</div><button class="wide" data-action="water-log">Outro volume ou bebida</button>${waterUndo&&h.logs.some(l=>l.id===waterUndo)?'<button class="quiet wide" data-action="water-undo">Desfazer último registro rápido</button>':''}<div class="grid section"><div class="card"><small>Outras bebidas hoje</small><h3>${(d.total-d.water).toLocaleString('pt-BR')} mL</h3></div><div class="card"><small>Sequência de registros</small><h3>${Hydration.streak(h)} dia(s)</h3></div></div><p class="footnote">A meta acompanha apenas água. Outras bebidas são registradas em volume, sem calcular equivalências de hidratação. A sequência mede dias com registros, não quantidade consumida.</p><h2>Registros de hoje</h2>${waterLogList(Core.today())}`}
function waterLogList(date){const logs=waterData().logs.filter(l=>Core.date(new Date(l.at))===date).sort((a,b)=>b.at-a.at);return logs.map(l=>`<article class="card water-record"><div class="row"><div class="grow"><b>${Hydration.beverages[l.beverage]} · ${l.amount} mL</b><small>${new Date(l.at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</small></div><button class="quiet" data-action="water-edit" data-id="${esc(l.id)}">Editar</button><button class="quiet" data-action="water-delete" data-id="${esc(l.id)}" aria-label="Excluir registro de ${l.amount} mL">Excluir</button></div>${l.note?`<p class="detail-notes">${esc(l.note)}</p>`:''}</article>`).join('')||'<div class="card"><p class="muted">Nenhuma bebida registrada nesta data.</p></div>'}
function waterHistory(){const h=waterData(),days=Array.from({length:7},(_,i)=>{const date=Core.addDays(waterDate,i-6);return {date,...Hydration.day(h,date)}}),max=Math.max(1,...days.map(d=>d.water));return `<label for="water-date">Dia de referência</label><input id="water-date" type="date" value="${waterDate}" max="${Core.today()}"><div class="row"><button class="quiet" data-action="water-day" data-dir="-1">Dia anterior</button><button class="quiet" data-action="water-now">Hoje</button><button class="quiet" data-action="water-day" data-dir="1" ${waterDate>=Core.today()?'disabled':''}>Próximo dia</button></div><section class="card"><h2>Água nos últimos 7 dias</h2><div class="water-chart" aria-label="Volume de água por dia">${days.map(d=>`<button data-action="water-chart-day" data-value="${d.date}" aria-label="${d.date.split('-').reverse().join('/')}: ${d.water} mililitros"><small>${d.water}</small><span><i style="height:${d.water/max*100}%"></i></span><small>${d.date.slice(8)}</small></button>`).join('')}</div><p class="footnote">Volumes em mL. Toque em um dia para ver os registros. Não há bônus por beber acima da meta.</p></section><h2>${waterDate.split('-').reverse().join('/')}</h2><p class="muted">${Hydration.day(h,waterDate).water} mL de água · Meta da data: ${Hydration.goal(h,waterDate)||'não definida'}${Hydration.goal(h,waterDate)?' mL':''}</p>${waterLogList(waterDate)}<button class="wide" data-action="water-log" data-date="${waterDate}">Adicionar registro nesta data</button>`}
function waterSettings(){const reminders=org().reminders.filter(r=>r.source==='hydration');return `<div class="card"><h2>Sua meta, no seu contexto</h2><p>Defina o volume de água que pretende acompanhar. Este aplicativo não calcula necessidades por peso, clima ou idade. Se você tem orientação de restrição de líquidos, siga o volume combinado com seu profissional de saúde.</p><button class="wide" data-action="water-goal">Editar meta diária</button><p class="footnote">Mudanças valem a partir de hoje; metas de dias anteriores são preservadas.</p></div><div class="card"><h2>Lembretes nos seus horários</h2><p>Escolha horários em que costuma estar acordado. Nenhum lembrete é ativado automaticamente.</p>${reminders.map(r=>`<div class="row water-reminder"><span>${r.time} · ${r.enabled?'Ativo':'Pausado'}</span><button class="quiet" data-action="water-reminder-toggle" data-id="${esc(r.id)}">${r.enabled?'Pausar':'Ativar'}</button><button class="quiet" data-action="water-reminder-remove" data-id="${esc(r.id)}">Excluir</button></div>`).join('')}<form data-form="water-reminder">${formField('Novo horário diário','time','','time','required')}<button class="wide">Adicionar horário</button></form><div class="row wrap"><button class="quiet" data-action="notify-permission">Permitir notificações</button><button class="quiet" data-action="water-export">Exportar horários</button></div><p class="footnote">Avisos locais dependem da permissão e do aplicativo aberto. Avisos de hidratação com mais de 15 minutos de atraso são ignorados. Para alertas em segundo plano, importe os horários no calendário do celular. Alterações aqui não atualizam os eventos já exportados.</p></div>`}
function waterGoalForm(){const g=Hydration.goal(waterData(),Core.today());modal('Minha meta de água',`<form data-form="water-goal">${formField('Meta pessoal diária em mL','amount',g||'','number','min="100" max="10000" step="1" required placeholder="Informe sua meta"')}<p class="footnote">O valor é escolhido por você, não uma recomendação médica. A faixa permitida é apenas um limite técnico de cadastro.</p><button class="primary wide">Salvar meta</button></form>`)}
function waterLogForm(id,date){const l=waterData().logs.find(l=>l.id===id)||{at:date?new Date(date+'T12:00').getTime():Date.now(),amount:250,beverage:'water',note:''};modal(id?'Editar bebida':'Registrar bebida',`<form data-form="water-log" data-id="${esc(id||'')}">${selectField('Bebida','beverage',Object.entries(Hydration.beverages),l.beverage)}${formField('Volume em mL','amount',l.amount,'number','min="1" max="5000" step="1" required')}${formField('Data e hora','at',localDateTime(Math.min(l.at,Date.now())),'datetime-local',`required max="${localDateTime(Date.now())}"`)}<label for="water-note">Observação (opcional)</label><textarea id="water-note" name="note" maxlength="1000">${esc(l.note)}</textarea><button class="primary wide">Salvar registro</button></form>`)}
function waterSubmit(type,v,id){const h=waterData();if(type==='water-reminder'){if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))throw Error('Escolha um horário válido.');if(org().reminders.some(r=>r.source==='hydration'&&r.time===v.time))throw Error('Esse horário já está cadastrado.');org().reminders.push({id:Core.id(),title:'Hidratação · uma pausa para cuidar de você',date:Core.today(),time:v.time,repeat:'daily',enabled:true,source:'hydration'});return}if(type==='water-goal'){const goals=h.goals.filter(g=>g.date!==Core.today()).concat({date:Core.today(),amount:Number(v.amount)});Hydration.validate({...state,hydration:{...h,goals}});h.goals=goals;return}const l={id:id||Core.id(),at:new Date(v.at).getTime(),amount:Number(v.amount),beverage:v.beverage,note:v.note?.trim()||''};if(l.at>Date.now())throw Error('Use uma data e hora atuais ou passadas.');const logs=h.logs.filter(x=>x.id!==l.id).concat(l);Hydration.validate({...state,hydration:{...h,logs}});h.logs=logs}
document.addEventListener('click',e=>{const d=e.target.closest('button')?.dataset;if(!d)return;try{const h=waterData();if(d.action==='water-tab'){waterTab=d.value;render()}if(d.action==='water-goal')waterGoalForm();if(d.action==='water-log')waterLogForm(undefined,d.date);if(d.action==='water-edit')waterLogForm(d.id);if(d.action==='water-quick'){const amount=Number(d.amount);if(![150,250,500].includes(amount))return;const l={id:Core.id(),at:Date.now(),amount,beverage:'water',note:''};Hydration.validate({...state,hydration:{...h,logs:h.logs.concat(l)}});h.logs.push(l);waterUndo=l.id;if(save()){render();toast(`${amount} mL registrados. Você pode desfazer.`)}}if(d.action==='water-undo'){h.logs=h.logs.filter(l=>l.id!==waterUndo);waterUndo=null;save();render()}if(d.action==='water-delete'&&confirm('Excluir este registro de bebida?')){h.logs=h.logs.filter(l=>l.id!==d.id);save();render()}if(d.action==='water-day'){waterDate=Core.addDays(waterDate,Number(d.dir));if(waterDate>Core.today())waterDate=Core.today();render()}if(d.action==='water-now'){waterDate=Core.today();render()}if(d.action==='water-chart-day'){waterDate=d.value;render()}if(d.action==='water-reminder-toggle'){const r=org().reminders.find(r=>r.id===d.id&&r.source==='hydration');if(r){r.enabled=!r.enabled;save();render()}}if(d.action==='water-reminder-remove'&&confirm('Excluir este horário?')){org().reminders=org().reminders.filter(r=>!(r.id===d.id&&r.source==='hydration'));save();render()}if(d.action==='water-export'){const rs=org().reminders.filter(r=>r.source==='hydration'&&r.enabled);if(!rs.length){toast('Adicione ou ative um horário primeiro.');return}downloadFinance(Ext.ics(rs),'nekoquest-hidratacao.ics','text/calendar;charset=utf-8');toast('Importe no calendário e confira os alertas. Reimportações podem duplicar eventos.')}}catch(err){showIssue(err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='water-date'&&Core.validDate(e.target.value)&&e.target.value<=Core.today()){waterDate=e.target.value;render()}});

let foodTab='week',foodStart=Core.today();
const foodData=()=>Food.init(state).food;
const foodQty=n=>Number(n.toFixed(2)).toLocaleString('pt-BR');
function food(){const f=foodData();return head('DA RECEITA À SUA ROTINA','Alimentação','Planeje com calma. Cozinhe do seu jeito.')+`<div class="tabs food-tabs">${[['week','Cardápio'],['recipes','Receitas'],['shopping','Compras'],['prep','Preparo']].map(([k,n])=>`<button data-action="food-tab" data-value="${k}" class="${foodTab===k?'selected':''}" aria-pressed="${foodTab===k}">${n}</button>`).join('')}</div>${foodTab==='recipes'?foodRecipes():`<label for="food-start">Planejamento de 7 dias a partir de</label><input id="food-start" type="date" value="${foodStart}"><div class="row"><button data-action="food-week" data-dir="-7">← Semana</button><button data-action="food-week" data-dir="7">Semana →</button></div>${foodTab==='shopping'?foodShopping():foodTab==='prep'?foodPrep():foodWeek()}`}<p class="footnote">Receitas e planejamento ficam no dispositivo e entram no backup geral. Quantidades são calculadas pelas porções informadas.</p>`}
function foodRecipes(){const f=foodData();return `<button class="primary wide" data-action="food-recipe">+ Nova receita</button>${f.recipes.map(r=>`<article class="card"><h2>${esc(r.name)}</h2><p class="muted">Rende ${foodQty(r.servings)} porção(ões) · ${r.ingredients.length} ingredientes</p><details><summary>Ingredientes e preparo</summary>${r.ingredients.map(i=>`<p>${foodQty(i.amount)} ${i.unit} · ${esc(i.name)}</p>`).join('')}<p class="detail-notes">${esc(r.steps||'Sem instruções cadastradas.')}</p></details><div class="row wrap"><button data-action="food-recipe" data-id="${esc(r.id)}">Editar</button><button data-action="food-plan" data-id="${esc(r.id)}">Planejar</button><button class="quiet" data-action="food-delete-recipe" data-id="${esc(r.id)}">Excluir</button></div></article>`).join('')||'<div class="card"><h2>Seu caderno de receitas</h2><p>Cadastre uma receita com ingredientes e rendimento para calcular as compras da semana.</p></div>'}`}
function foodWeek(){const f=foodData();return `<button class="primary wide" data-action="food-plan">+ Planejar refeição</button>${Array.from({length:7},(_,i)=>{const date=Core.addDays(foodStart,i);return `<section class="card"><h3>${new Date(date+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})}</h3>${f.plans.filter(p=>p.date===date).map(p=>`<div class="food-entry"><b>${esc(p.meal)} · ${esc(f.recipes.find(r=>r.id===p.recipe).name)}</b><small>${foodQty(p.servings)} porção(ões)${p.done?' · Preparado ✓':''}</small><div class="row"><button class="quiet" data-action="food-edit-plan" data-id="${esc(p.id)}">Editar</button><button class="quiet" data-action="food-remove" data-id="${esc(p.id)}">Remover</button></div></div>`).join('')||'<p class="muted">Dia livre para planejar.</p>'}</section>`}).join('')}`}
function foodShopping(){const f=foodData(),items=Food.shopping(f,foodStart);return `<div class="card"><h2>Compras da semana</h2><p>Ingredientes somados para as porções planejadas. Unidades diferentes permanecem separadas.</p><button data-action="food-export">Exportar lista de texto</button></div>${items.map(i=>{const key=foodStart+'|'+i.key;return `<label class="card food-check"><input type="checkbox" data-food-check="${esc(key)}" ${f.checked.includes(key)?'checked':''}><span><small>${esc(i.section||'Outros')}</small><b>${esc(i.name)}</b><span>${foodQty(i.amount)} ${i.unit}</span></span></label>`}).join('')||'<p class="card">Adicione refeições ao cardápio para gerar sua lista.</p>'}`}
function foodPrep(){const f=foodData(),plans=f.plans.filter(p=>p.date>=foodStart&&p.date<=Core.addDays(foodStart,6));return `<p class="muted">Marque cada refeição quando terminar o preparo.</p>${plans.map(p=>{const r=f.recipes.find(r=>r.id===p.recipe);return `<article class="card"><h2>${esc(r.name)}</h2><p>${p.date.split('-').reverse().join('/')} · ${esc(p.meal)} · ${foodQty(p.servings)} porção(ões)</p><details><summary>Ver quantidades e passos</summary>${r.ingredients.map(i=>`<p>${foodQty(i.amount*p.servings/r.servings)} ${i.unit} · ${esc(i.name)}</p>`).join('')}<p class="detail-notes">${esc(r.steps||'Inclua os passos na receita.')}</p></details><button class="wide ${p.done?'':'primary'}" data-action="food-done" data-id="${esc(p.id)}">${p.done?'✓ Preparado · desfazer':'Marcar como preparado'}</button></article>`}).join('')||'<p class="card">Suas refeições planejadas aparecerão aqui.</p>'}`}
function foodRecipeForm(id){const r=foodData().recipes.find(r=>r.id===id)||{name:'',servings:1,ingredients:[],steps:''};modal(id?'Editar receita':'Nova receita',`<form data-form="food-recipe" data-id="${esc(id||'')}">${formField('Nome','name',r.name,'text','required maxlength="120"')}${formField('Rendimento em porções','servings',r.servings,'number','required min="0.1" max="1000" step="any"')}<label for="food-ingredients">Ingredientes · um por linha</label><p class="footnote">Formato: nome; quantidade; unidade; seção do mercado. Unidades: g, mL, un, colher, xícara. Exemplo: Arroz; 200; g; Mercearia</p><textarea id="food-ingredients" name="ingredients" rows="6" required placeholder="Arroz; 200; g; Mercearia">${esc(r.ingredients.map(i=>[i.name,i.amount,i.unit,i.section].join('; ')).join('\n'))}</textarea><label for="food-steps">Modo de preparo</label><textarea id="food-steps" name="steps" rows="5" maxlength="10000">${esc(r.steps)}</textarea><button class="primary wide">Salvar receita</button></form>`)}
function foodPlanForm(recipe,id){const f=foodData();if(!f.recipes.length){toast('Cadastre uma receita primeiro.');foodRecipeForm();return}const p=f.plans.find(p=>p.id===id)||{date:foodStart,meal:'Almoço',recipe:recipe||f.recipes[0].id,servings:1};modal('Planejar refeição',`<form data-form="food-plan" data-id="${esc(id||'')}">${formField('Data','date',p.date,'date','required')}${selectField('Refeição','meal',['Café da manhã','Almoço','Lanche','Jantar'],p.meal)}${selectField('Receita','recipe',f.recipes.map(r=>[r.id,r.name]),p.recipe)}${formField('Porções a preparar','servings',p.servings,'number','required min="0.1" max="1000" step="any"')}<button class="primary wide">Salvar no cardápio</button></form>`)}
function foodSubmit(type,v,id){const f=foodData(),next=JSON.parse(JSON.stringify(f));if(type==='food-recipe'){const ingredients=v.ingredients.split('\n').filter(s=>s.trim()).map(line=>{const [name,amount,unit,section='Outros']=line.split(';').map(s=>s.trim());return {name,amount:Number((amount||'').replace(',','.')),unit,section}});const r={id:id||Core.id(),name:v.name.trim(),servings:Number(v.servings),ingredients,steps:v.steps.trim()};next.recipes=next.recipes.filter(x=>x.id!==r.id).concat(r);next.checked=[]}else{const p={id:id||Core.id(),date:v.date,meal:v.meal,recipe:v.recipe,servings:Number(v.servings),done:false};next.plans=next.plans.filter(x=>x.id!==p.id).concat(p);next.checked=[]}Food.validate({food:next});state.food=next}
document.addEventListener('click',e=>{const d=e.target.closest('button')?.dataset;if(!d?.action?.startsWith('food-'))return;try{const f=foodData();if(d.action==='food-tab'){foodTab=d.value;render()}if(d.action==='food-week'){foodStart=Core.addDays(foodStart,Number(d.dir));render()}if(d.action==='food-recipe')foodRecipeForm(d.id);if(d.action==='food-plan')foodPlanForm(d.id);if(d.action==='food-edit-plan')foodPlanForm(null,d.id);if(d.action==='food-done'){const p=f.plans.find(p=>p.id===d.id);p.done=!p.done;if(save())render()}if(d.action==='food-remove'&&confirm('Remover esta refeição do planejamento?')){f.plans=f.plans.filter(p=>p.id!==d.id);f.checked=[];if(save())render()}if(d.action==='food-delete-recipe'){if(f.plans.some(p=>p.recipe===d.id)){toast('Remova as refeições vinculadas antes de excluir a receita.');return}if(confirm('Excluir esta receita?')){f.recipes=f.recipes.filter(r=>r.id!==d.id);if(save())render()}}if(d.action==='food-export'){const text=Food.shopping(f,foodStart).map(i=>`${f.checked.includes(foodStart+'|'+i.key)?'[x]':'[ ]'} ${i.name}: ${foodQty(i.amount)} ${i.unit} (${i.section})`).join('\n');downloadFinance('Compras · '+foodStart+'\n\n'+text,'nekoquest-compras.txt','text/plain;charset=utf-8')}}catch(err){showIssue(err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='food-start'&&Core.validDate(e.target.value)){foodStart=e.target.value;render()}const key=e.target.dataset.foodCheck;if(key){const f=foodData();f.checked=f.checked.filter(k=>k!==key);if(e.target.checked)f.checked.push(key);save()}});

// Presentation layer: shared section navigation, concise dashboard and local feedback.
function modernSettings(){const p=state.preferences,status=!('Notification'in window)?'Indisponíveis neste navegador':Notification.permission==='granted'?(p.alerts?'Ativadas':'Pausadas'):Notification.permission==='denied'?'Bloqueadas nas configurações do navegador':'Permissão ainda não solicitada';return `<section class="card feedback-settings"><h2>Sons e notificações</h2><p class="muted">Pequenos sinais, no volume que funciona para você.</p><label class="checklabel"><input id="modern-sounds" type="checkbox" ${p.sounds?'checked':''}> Sons do aplicativo</label><label for="modern-volume">Volume dos sons · ${Math.round(p.soundVolume*100)}%</label><input id="modern-volume" type="range" min="0" max="100" step="5" value="${Math.round(p.soundVolume*100)}"><button class="wide" data-action="modern-test-sound">Ouvir um exemplo</button><hr><h3>Notificações</h3><p class="muted" role="status">${status}</p><p class="footnote">Tarefas concluídas têm um som curto; o fim do foco e os lembretes também podem emitir uma notificação. Sons dependem de uma interação anterior com o app e das configurações do dispositivo.</p><div class="row wrap"><button data-action="notify-permission">${p.alerts?'Conferir permissão':'Ativar notificações'}</button><button data-action="modern-pause-alerts" ${!p.alerts?'disabled':''}>Pausar</button><button data-action="modern-test-notification">Testar aviso</button></div><button class="wide" data-action="reminders">Gerenciar lembretes</button><p class="footnote">Os avisos são verificados enquanto o aplicativo está aberto. Com ele fechado, não há garantia de alertas. Exporte seus lembretes para o calendário do celular para receber avisos em segundo plano.</p></section>`}
let modernAudio=null;
function unlockModernAudio(){if(!state.preferences.sounds)return;try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;modernAudio=modernAudio||new Audio();if(modernAudio.state==='suspended')modernAudio.resume().catch(()=>{})}catch{}}
function playModernSound(kind='tap'){if(!state.preferences.sounds||!state.preferences.soundVolume)return;unlockModernAudio();if(!modernAudio||modernAudio.state!=='running')return;try{const tones=kind==='success'?[523.25,659.25,783.99]:kind==='alert'?[659.25,523.25,659.25]:[440],start=modernAudio.currentTime;tones.forEach((frequency,i)=>{const o=modernAudio.createOscillator(),g=modernAudio.createGain(),at=start+i*.11;o.type='sine';o.frequency.value=frequency;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(state.preferences.soundVolume*.16,at+.012);g.gain.exponentialRampToValueAtTime(.0001,at+.15);o.connect(g);g.connect(modernAudio.destination);o.start(at);o.stop(at+.17);o.onended=()=>{o.disconnect();g.disconnect()}})}catch{}}
async function modernNotify(title,body,tag='nekoquest-alert'){if(!state.preferences.alerts||!('Notification'in window)||Notification.permission!=='granted')return false;try{const registration=await navigator.serviceWorker?.getRegistration();const options={body,tag,icon:'./cat-192.png',badge:'./cat-192.png',data:{page:tag.startsWith('focus')?'focus':tag.startsWith('workout')?'workouts':'tasks'}};if(registration)await registration.showNotification(title,options);else new Notification(title,options);return true}catch{return false}}
async function authorizeModernNotifications(){if(!('Notification'in window)){toast('Este navegador não oferece notificações. Use a exportação para o calendário.');return}try{const permission=await Notification.requestPermission();state.preferences.alerts=permission==='granted';save();render();toast(state.preferences.alerts?'Notificações ativadas enquanto o app estiver aberto.':'Permissão não concedida. Confira as configurações do navegador.')}catch{toast('Não foi possível ativar as notificações neste navegador.')}}
document.addEventListener('pointerdown',unlockModernAudio,{capture:true});
document.addEventListener('keydown',unlockModernAudio,{capture:true});
document.addEventListener('click',async e=>{const d=e.target.closest('button')?.dataset;if(!d)return;if(d.page)playModernSound('tap');if(d.action==='modern-test-sound'){if(!state.preferences.sounds){toast('Ative os sons para ouvir o exemplo.');return}unlockModernAudio();if(modernAudio?.state==='suspended')await modernAudio.resume().catch(()=>{});playModernSound('success')}if(d.action==='modern-pause-alerts'){state.preferences.alerts=false;save();render();toast('Notificações pausadas.')}if(d.action==='modern-test-notification'){const sent=await modernNotify('NekoQuest','Seu aviso de teste chegou.','nekoquest-test');toast(sent?'Aviso enviado. Confira a central de notificações.':'Ative as notificações e permita os avisos no navegador primeiro.')}});
document.addEventListener('change',e=>{if(e.target.id==='modern-sounds'){state.preferences.sounds=e.target.checked;save();if(e.target.checked){unlockModernAudio();setTimeout(()=>playModernSound('tap'),50)}else if(modernAudio)modernAudio.suspend().catch(()=>{})}if(e.target.id==='modern-volume'){state.preferences.soundVolume=Number(e.target.value)/100;save();const label=document.querySelector('label[for="modern-volume"]');if(label)label.textContent=`Volume dos sons · ${e.target.value}%`;playModernSound('tap')}});

if(navigator.serviceWorker)navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='nekoquest-notification'&&['focus','tasks','workouts'].includes(e.data.page))go(e.data.page)});

/** Use a single accent against all surfaces, with AA text and control contrast. */
function contrastAccent(hex,theme){
 const source=[0,2,4].map(i=>parseInt(hex.slice(i+1,i+3),16));
 const surfaces=theme==='light'?['#f8faf9','#ffffff','#edf2ef']:['#111917','#19241f','#24312a'];
 const L=rgb=>rgb.map(v=>{const x=v/255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}).reduce((n,v,i)=>n+v*[.2126,.7152,.0722][i],0);
 const rgb=h=>[0,2,4].map(i=>parseInt(h.slice(i+1,i+3),16));
 const target=theme==='light'?[0,35,22]:[244,255,249],ink=theme==='light'?[255,255,255]:[16,25,22];
 const ratio=(a,b)=>(Math.max(a,b)+.05)/(Math.min(a,b)+.05);
 for(let i=0;i<=100;i++){
  const c=source.map((v,j)=>Math.round(v*(1-i/100)+target[j]*i/100)),l=L(c);
  if(surfaces.every(s=>ratio(l,L(rgb(s)))>=4.5)&&ratio(l,L(ink))>=4.5)return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
 }
 return theme==='light'?'#245f43':'#b2e4c8';
}

 const exercises=[...new Map([...w.exercises,...all.flatMap(s=>s.exercises.map(e=>({id:e.exercise,name:e.name})))].map(e=>[e.id,e])).values()];
 const prs=exercises.map(e=>({name:e.name,record:workoutRecord({sets:all.flatMap(s=>s.exercises.filter(x=>x.exercise===e.id)).flatMap(e=>e.sets)})})).filter(e=>e.record);
 return `<section class="card"><h2>Esta semana</h2><p class="big">${workoutNumber(weekly.reduce((n,s)=>n+Workouts.volume(s),0))} kg</p><p class="muted">Volume · carga × repetições das séries concluídas</p><small>${weekly.length} treino(s) · segunda a domingo. Peso corporal sem carga não soma kg.</small></section><label for="workout-history-date">Filtrar por data</label><input id="workout-history-date" type="date" value="${workoutDate}"><label for="workout-history-exercise">Histórico por exercício</label><select id="workout-history-exercise"><option value="all">Todos os exercícios</option>${exercises.map(e=>`<option value="${esc(e.id)}" ${workoutExercise===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>${workoutButton('workout-history-reset','Limpar filtros','','quiet wide')}${workoutChart(all)}<details class="card"><summary>Recordes pessoais · ${prs.length}</summary><p class="footnote">Maior carga; em empate, maior número de repetições. Apenas séries concluídas.</p>${prs.map(e=>`<div class="entry row"><b class="grow">${esc(e.name)}</b><span>${workoutNumber(e.record.kg)} kg × ${e.record.reps}</span></div>`).join('')||'<p class="muted">Seus recordes aparecerão após o primeiro treino.</p>'}</details><div class="section"><h2>Sessões salvas</h2></div>${filtered.map(s=>`<article class="card"><small>${new Date(s.finishedAt).toLocaleDateString('pt-BR')} · ${Math.max(1,Math.round((s.finishedAt-s.startedAt)/60000))} min</small><h2>${esc(s.name)}</h2><p class="muted">${workoutNumber(Workouts.volume(s))} kg de volume</p><details><summary>Ver séries</summary>${s.exercises.filter(e=>workoutExercise==='all'||e.exercise===workoutExercise).map(e=>`<div class="workout-history-exercise"><b>${esc(e.name)}</b>${e.sets.map((t,i)=>`<p class="muted">${i+1} · ${workoutNumber(t.kg)} kg × ${t.reps} · ${t.done?'Concluída':'Não realizada'}</p>`).join('')}</div>`).join('')}</details></article>`).join('')||empty('Sua evolução começa aqui','Finalize um treino ou ajuste os filtros.',state.cat)}`;
}
function workoutChart(all){
 const selected=workoutExercise!=='all';
 const points=all.filter(s=>(!workoutDate||Core.date(new Date(s.finishedAt))===workoutDate)&&(!selected||s.exercises.some(e=>e.exercise===workoutExercise&&e.sets.some(t=>t.done)))).slice(0,10).reverse().map(s=>({date:Core.date(new Date(s.finishedAt)),value:selected?Math.max(0,...s.exercises.filter(e=>e.exercise===workoutExercise).flatMap(e=>e.sets.filter(t=>t.done).map(t=>t.kg))):Workouts.volume(s)}));
 if(!points.length)return '';
 const max=Math.max(1,...points.map(p=>p.value)),coords=points.map((p,i)=>[24+i*252/Math.max(1,points.length-1),115-p.value/max*90]);
 return `<section class="card"><h2>${selected?'Evolução de carga':'Evolução de volume'}</h2><p class="footnote">${selected?'Maior carga concluída por sessão':'Volume concluído por sessão'}, em kg. Últimas ${points.length} sessões do filtro.</p><svg class="workout-chart" viewBox="0 0 300 140" role="img" aria-label="${selected?'Carga máxima':'Volume'} em kg por sessão; valores na tabela abaixo"><path d="M24 15v100h252" fill="none" stroke="var(--line)"/><polyline points="${coords.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="3"/>${coords.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`).join('')}</svg><details><summary>Ver valores do gráfico</summary><table><thead><tr><th>Data</th><th>kg</th></tr></thead><tbody>${points.map(p=>`<tr><td>${shortDate(p.date)}</td><td>${workoutNumber(p.value)}</td></tr>`).join('')}</tbody></table></details></section>`;
}
function workoutCommit(next){Workouts.validate({workouts:next});state.workouts=next;if(!save())throw Error('Não foi possível salvar. Exporte seu backup antes de fechar o app.')}
function workoutSubmit(type,v,id,form){
 const w=structuredClone(workoutData());
 if(type==='workout-exercise'){
  const e={id:id||Core.id(),name:v.name.trim(),group:v.group.trim(),type:v.type};
  w.exercises=id?w.exercises.map(x=>x.id===id?e:x):[...w.exercises,e];
 }else if(type==='workout-routine'){
  const exercises=Array.from(form.querySelectorAll('.workout-routine-row')).map(row=>Object.fromEntries(['exercise','sets','reps','kg','rest'].map(k=>[k,k==='exercise'?row.querySelector(`[name="${k}"]`).value:Number(row.querySelector(`[name="${k}"]`).value)])));
  const r={id:id||Core.id(),name:v.name.trim(),exercises};w.routines=id?w.routines.map(x=>x.id===id?r:x):[...w.routines,r];
 }else throw Error('Formulário de treino desconhecido.');
 workoutCommit(w);$('#modal').close();render();toast('Treino salvo.');
}
// Flush visible inputs before any action or navigation; a click must not lose an edit.
function syncWorkoutInputs(){
 const s=Workouts.active(workoutData());if(!s||!document.querySelector('[data-workout-field]'))return true;
 const next=structuredClone(workoutData()),draft=Workouts.active(next);
 for(const input of document.querySelectorAll('[data-workout-field]')){
  if(!input.reportValidity())return false;
  draft.exercises[Number(input.dataset.exercise)].sets[Number(input.dataset.set)][input.dataset.workoutField]=Number(input.value);
 }
 workoutCommit(next);return true;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset,a=d.action;
 if(!a?.startsWith('workout-')&&!d.page)return;
 try{
  if(Workouts.active(workoutData())&&page==='workouts'&&a!=='workout-discard'&&!syncWorkoutInputs()){e.stopImmediatePropagation();e.preventDefault();return}
  if(!a?.startsWith('workout-'))return;
  e.stopImmediatePropagation();e.preventDefault();
  if(a==='workout-tab'){workoutTab=d.id;render()}
  if(a==='workout-exercise')workoutExerciseForm(d.id);
  if(a==='workout-routine')workoutRoutineForm(d.id);
  if(a==='workout-add-row'){
   const box=$('#workout-routine-rows');if(box.children.length>=50)throw Error('Limite de 50 exercícios por rotina.');
   box.insertAdjacentHTML('beforeend',workoutRoutineRow({exercise:workoutData().exercises[0].id,sets:3,reps:10,kg:0,rest:60},box.children.length));labelRoutineRows();
  }
  if(a==='workout-remove-row'){const row=b.closest('fieldset');if(row.parentElement.children.length<=1)throw Error('Mantenha pelo menos um exercício.');row.remove();labelRoutineRows()}
  if(a==='workout-row-up'){const row=b.closest('fieldset');if(row.previousElementSibling)row.parentElement.insertBefore(row,row.previousElementSibling);labelRoutineRows()}
  if(a==='workout-start'){const copy=structuredClone(state);Workouts.start(copy,d.id);workoutCommit(copy.workouts);render();window.scrollTo({top:0,behavior:'instant'})}
  if(a==='workout-set'){
   const next=structuredClone(workoutData()),s=Workouts.active(next),exercise=s.exercises[Number(d.exercise)],set=exercise.sets[Number(d.set)];
   set.done=!set.done;s.restUntil=set.done&&exercise.rest?Date.now()+exercise.rest*1000:null;workoutCommit(next);render();if(set.done)playModernSound('tap');
  }
  if(a==='workout-skip-rest'){const next=structuredClone(workoutData());Workouts.active(next).restUntil=null;workoutCommit(next);paintWorkoutClock()}
  if(a==='workout-finish'){
   const s=Workouts.active(workoutData());if(!s)throw Error('Nenhum treino ativo.');
   if(!s.exercises.some(e=>e.sets.some(t=>t.done)))throw Error('Conclua ao menos uma série.');
   if(s.exercises.some(e=>e.sets.some(t=>!t.done))&&!confirm('Finalizar com séries não realizadas? Apenas as séries concluídas entram no volume e nos recordes.'))return;
   const copy=structuredClone(state);Workouts.finish(copy);Workouts.validate(copy);
   const before=state;state=copy;if(!save()){state=before;throw Error('Não foi possível salvar o treino. Tente novamente ou exporte um backup.')}
   workoutTab='history';render();window.scrollTo({top:0,behavior:'instant'});celebrate('Treino concluído · +30 XP · +20 moedas');playModernSound('success');
  }
  if(a==='workout-discard'&&confirm('Descartar esta sessão? Nenhum XP será gerado.')){const next=structuredClone(workoutData());next.sessions=next.sessions.filter(s=>s.finishedAt!==null);workoutCommit(next);render()}
  if(a==='workout-history-reset'){workoutDate='';workoutExercise='all';render()}
 }catch(err){e.stopImmediatePropagation();showIssue(err.message)}
},true);
document.addEventListener('input',e=>{
 if(e.target.id==='workout-search'){workoutQuery=e.target.value;$('#workout-library-results').innerHTML=workoutLibraryResults()}
 if(e.target.matches('[data-workout-field]')&&e.target.validity.valid){try{syncWorkoutInputs()}catch(err){showIssue(err.message)}}
});
document.addEventListener('change',e=>{try{
 if(e.target.id==='workout-type'){workoutType=e.target.value;render()}
 if(e.target.id==='workout-group'){workoutGroup=e.target.value;render()}
 if(e.target.id==='workout-history-date'){workoutDate=e.target.value;render()}
 if(e.target.id==='workout-history-exercise'){workoutExercise=e.target.value;render()}
 if(e.target.matches('[data-workout-field]'))syncWorkoutInputs();
}catch(err){showIssue(err.message)}});
setInterval(paintWorkoutClock,500);

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});setInterval(tick,500);if('serviceWorker'in navigator&&location.protocol!=='file:'){const hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController){appUpdate=true;render()}});navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}render();if(location.search){const notice=new URLSearchParams(location.search).get('notice');if(['focus','tasks'].includes(notice))go(notice);}if(loadError)toast('Não foi possível ler os dados salvos. O original foi preservado.');else save();
</script></body></html>
